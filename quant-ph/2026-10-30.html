<script>
// Shared rendering for the live app and exported/published digest pages.

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function readinessClass(r) {
  if (r.startsWith("Usable")) return "ready-now";
  if (r.startsWith("Near")) return "ready-near";
  return "ready-far";
}

function paperCard(p) {
  const s = p.summary;
  const head = `
    <div class="paper-head">
      <div class="rank">${p.rank}</div>
      <div>
        <h2><a href="${esc(p.abs_url)}" target="_blank" rel="noopener">${esc(p.title)}</a></h2>
        <div class="authors">${esc(p.authors)}</div>
        ${s ? `<div class="tldr">${esc(s.tldr)}</div>` : ""}
        <div class="chips">
          ${s ? `<span class="chip ${readinessClass(s.practicality.readiness)}">${esc(s.practicality.readiness)}</span>` : ""}
          ${(s?.tags || []).map((t) => `<span class="chip">${esc(t)}</span>`).join("")}
          ${p.basis !== "full text" ? `<span class="chip">Based on ${esc(p.basis)}</span>` : ""}
        </div>
      </div>
    </div>`;
  if (!s) {
    return `<article class="paper">${head}<p class="authors">The full breakdown couldn't be generated: ${esc(p.error)}</p>
      <p>${esc(p.abstract)}</p>${links(p)}</article>`;
  }
  const pct = Math.max(0, Math.min(10, s.practicality.score)) * 10;
  return `<article class="paper">${head}
    <div class="grid">
      <div class="section"><h3>Goal</h3><p>${esc(s.goal)}</p></div>
      <div class="section"><h3>How they did it</h3><p>${esc(s.approach)}</p></div>
      <div class="section"><h3>Key results</h3><ul>${s.key_results.map((r) => `<li>${esc(r)}</li>`).join("")}</ul></div>
      <div class="section"><h3>Implications</h3><p>${esc(s.implications)}</p></div>
      <div class="section"><h3>Real-world practicality · ${s.practicality.score}/10</h3>
        <div class="practical-bar"><div style="width:${pct}%"></div></div>
        <p>${esc(s.practicality.explanation)}</p></div>
      <div class="section"><h3>Limitations</h3><p>${esc(s.limitations)}</p></div>
    </div>
    <details><summary>Why it made the top 10</summary><p>${esc(p.why_selected)}</p></details>
    ${links(p)}
  </article>`;
}

function links(p) {
  return `<div class="links"><a href="${esc(p.abs_url)}" target="_blank" rel="noopener">Abstract</a>
    <a href="${esc(p.pdf_url)}" target="_blank" rel="noopener">PDF</a></div>`;
}

function fmtDate(iso) {
  return new Date(iso + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
}

const PAPERS = [{"id": "2610.37839", "title": "Shor's algorithm compiled on cat qubits: 22 593 qubits for RSA-2048 in 3.14 days", "authors": "Axel Pappalardo, Dahmun Goudarzi, Victor Hertz, Hugo Jacinto, Larissa Kroell, Andr\\'e Schrottenloher, Peter Shanahan, \\'Elie Gouzien, R\\'emi de la Vieuville, Vivien Londe", "abstract": "We present an end-to-end resource estimation of Shor's algorithm on superconducting cat qubits, from its mathematical description to the allocation and scheduling of physical qubits on a chip layout. We review modern versions of Shor's algorithm for RSA, ECDLP and FFDLP, and make their logical circuits and trade-offs explicit. We compile the dominant subroutines down to physical-qubit operations on two architectures: one based on repetition cat codes and one on LDPC cat codes. We design a parity-Cnot gate for cat qubits, extend a multi-target Cnot gate to the LDPC-cat architecture, and adapt an active injection procedure to cat qubits. Building on these primitives, we adapt to cat qubits the adder from Gidney's 2025 resource estimate for factoring RSA-2048. We combine our adder compilation and a coarser estimate for the phaseup with the factory designs and lookup compilation from the FeMoco resource estimation of Kroell et al. Together, these lead to chip layouts and schedules for factoring RSA-2048. Assuming a 1$\\mu$s error-correction cycle time, a 10$\\mu$s reaction time, circuit-level phase-flip noise with probability $p_Z = 5 \\times 10^{-4}$ and no bit-flips, factoring RSA-2048, the configuration we compile in full, requires about 23 000 cat qubits and 3.14 days. Reusing the compiled operations, solving ECDLP on secp256k1 requires at most 30 000 cat qubits and 1 hour, and FFDLP-512, which we propose as an intermediate benchmark, about 6 700 cat qubits and 21 minutes. Trading space for time, RSA-2048 runs in 1.25 hours on about 611 000 cat qubits. The no-bit-flip requirement (a bit-flip time of about 100 years) can be relaxed to a bit-flip time of about one hour by adding a concatenation layer with a distance-3 bit-flip code, in which case RSA-2048 needs about 45 000 cat qubits.", "categories": ["quant-ph"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.37839", "pdf_url": "https://arxiv.org/pdf/2610.37839", "score": 95, "why_selected": "End-to-end compilation putting RSA-2048 at about 23,000 cat qubits is a landmark resource estimate with direct cryptographic and hardware-roadmap consequences, though it rests on demanding bit-flip and noise assumptions.", "basis": "abstract only", "summary": {"tldr": "End-to-end compilation estimates RSA-2048 could be factored with about 23,000 superconducting cat qubits in 3.14 days, under optimistic noise assumptions including no bit-flips.", "goal": "The paper asks how much hardware Shor's algorithm would need on superconducting cat qubits, which are designed so that error correction mainly has to handle phase flips. Such estimates matter because they inform when public-key cryptography could be at risk and whether this hardware route could lower the cost of fault-tolerant computing.", "approach": "The authors review modern versions of Shor's algorithm for RSA, ECDLP and FFDLP, then compile the dominant subroutines to physical-qubit operations on two architectures, based on repetition cat codes and LDPC cat codes. They design a parity-CNOT gate, extend a multi-target CNOT to the LDPC-cat architecture, and adapt active injection to cat qubits. On these primitives they adapt the adder from Gidney's 2025 RSA-2048 estimate, then combine it with a coarser phaseup estimate and the factory and lookup designs of Kroell et al.'s FeMoco work to produce chip layouts and schedules. RSA-2048 is the configuration compiled in full; the other targets reuse its compiled operations. The baseline assumes a 1 \u03bcs error-correction cycle, 10 \u03bcs reaction time, circuit-level phase-flip noise of p_Z = 5\u00d710\u207b\u2074 and no bit-flips.", "key_results": ["RSA-2048: about 23,000 cat qubits (22,593 in the title) and 3.14 days at baseline; trading space for time gives 1.25 hours on about 611,000 cat qubits.", "ECDLP on secp256k1: at most 30,000 cat qubits and 1 hour, estimated by reusing the compiled operations rather than compiling this target in full.", "FFDLP-512, proposed as an intermediate benchmark: about 6,700 cat qubits and 21 minutes.", "The no-bit-flip assumption corresponds to a bit-flip time of about 100 years; adding a distance-3 bit-flip code relaxes this to about one hour and raises RSA-2048 to about 45,000 cat qubits."], "implications": "If the assumptions hold, cat qubits could put RSA-2048 and secp256k1 within reach of tens of thousands of physical qubits, which adds to the case for tracking post-quantum migration timelines. The concatenated variant shows a concrete trade: roughly double the qubits for a far less demanding bit-flip time. FFDLP-512 also gives the field a smaller intermediate cryptographic benchmark.", "practicality": {"readiness": "Long-term (3+ years)", "score": 2, "explanation": "Resource-estimation and quantum-cryptanalysis teams, hardware roadmappers and cryptography planners can use these figures and compiled designs now. Actually running the algorithm would require a large cat-qubit machine meeting the assumed cycle time, reaction time and noise levels. The abstract does not compare those assumptions with currently demonstrated hardware."}, "limitations": "These are model-based estimates, not hardware demonstrations, and the headline depends on assumed noise and timing, including no bit-flips at baseline. The phaseup estimate is coarser than the adder compilation, and only RSA-2048 is compiled in full.", "tags": ["Shor's algorithm", "cat qubits", "resource estimation", "quantum error correction", "cryptanalysis"]}, "error": null, "rank": 1}, {"id": "2610.40329", "title": "High-Fidelity Universal Quantum Gates in a Cryogenic Atom Array", "authors": "Junlan Jin, Donghyuk Seo, Yue Shi, Yukai Lu, Jeff D. Thompson, Waseem S. Bakr", "abstract": "Neutral atoms in optical tweezer arrays have emerged as a leading platform for quantum information processing. The fidelity of entangling gates mediated by Rydberg interactions has improved rapidly and is increasingly constrained by blackbody-radiation-induced transitions, which shorten Rydberg lifetimes and create contaminant states that can cause correlated errors. Cryogenic environments can suppress these transition rates by more than an order of magnitude. However, realizing a universal gate set in such an environment has remained an outstanding challenge. Here, we demonstrate a universal quantum gate set in a cryogenic $^{133}$Cs atom array, with a single-qubit gate fidelity of 99.970(2)% and a raw two-qubit entangling-gate fidelity of 99.76(8)%, within the range of leading room-temperature implementations. The entangling gate uses direct single-photon coupling between the electronic ground state and a Rydberg $P$ state, avoiding scattering and light shifts associated with two-photon coupling. The gate operates at a modest Rabi frequency of $2\\pi\\times4.3$ MHz. The measured fidelity agrees with our error model dominated by atomic motion, indicating a straightforward route to higher fidelity through improved cooling, while the fundamental error contribution from Rydberg decay is below $3\\times10^{-4}$. These results establish a path to entangling-gate fidelities substantially beyond the current state of the art through cryogenic suppression of Rydberg decay, reducing the overhead for fault-tolerant computation.", "categories": ["physics.atom-ph", "quant-ph"], "announce_type": "cross", "abs_url": "https://arxiv.org/abs/2610.40329", "pdf_url": "https://arxiv.org/pdf/2610.40329", "score": 92, "why_selected": "First high-fidelity universal gate set in a cryogenic atom array experimentally opens a credible route past blackbody-limited Rydberg fidelities on a leading platform.", "basis": "full text", "summary": {"tldr": "Princeton team demonstrates the first universal gate set in a cryogenic cesium atom array, reaching 99.76(8)% raw CZ fidelity, now limited by atomic motion rather than Rydberg decay.", "goal": "Entangling gates in neutral-atom quantum computers briefly excite atoms to Rydberg states, and at room temperature blackbody radiation shortens those states' lifetimes and creates contaminant states that cause correlated errors. A cryogenic environment suppresses this, but high-fidelity universal gates had not been shown there because of restricted optical access and difficult field control. The paper aims to demonstrate such gates and identify what limits fidelity once blackbody effects are reduced.", "approach": "The team used a 7\u00d72 array of 133Cs atoms in 936 nm optical tweezers inside 4 K and 35 K radiation shields, encoding qubits in hyperfine clock states prepared by a cyclic optical-pumping scheme that is less sensitive to polarization impurity. Single-qubit gates use Raman pulses with BB1 composite rotations and virtual Z rotations, characterized by randomized benchmarking. The 316 ns time-optimal CZ gate uses direct single-photon 319 nm excitation to the 55P3/2 Rydberg state, avoiding the intermediate state of two-photon schemes. Because P states have anisotropic interactions and are about 22 times more polarizable than the comparable S state, atom pairs were oriented perpendicular to the quantization axis at 3.2 \u03bcm spacing and stray electric fields were compensated to below 7 mV/cm. CZ fidelity was measured with echo randomized benchmarking and symmetric stabilizer benchmarking, then compared with a simulated error model.", "key_results": ["Single-qubit Clifford gate fidelity reached 99.970(2)%; raw CZ fidelity was 99.76(8)% by echo benchmarking and 99.78(10)% by symmetric stabilizer benchmarking, at a modest Rabi frequency of 2\u03c0\u00d74.3 MHz.", "The error model predicts 99.80% CZ fidelity, in agreement with measurement. Doppler shifts from atomic motion dominate, at 1.26\u00d710^-3 of a 1.96\u00d710^-3 total, with atoms at about 6 \u03bcK along the excitation beam.", "Rydberg decay contributes only a calculated 2.7\u00d710^-4, thanks to a Rydberg lifetime of about 406 \u03bcs in the cryogenic system.", "Simulations project 99.93% CZ fidelity with Raman sideband cooling alone, and 99.97% with tripled excitation intensity and cavity filtering of laser frequency noise added. These are model projections, not measurements."], "implications": "Cryogenic operation matches leading room-temperature gate performance (best reported raw fidelity 99.85%) while shifting the main error from a fundamental one, Rydberg decay, to a technical one, atomic motion, that better cooling can address. It also appears to be the first high-fidelity entangling gate using single-photon Rydberg excitation in alkali atoms and using Rydberg P-state interactions. Fewer contaminant Rydberg states may reduce correlated errors and ease limits on parallel gates, which could lower fault-tolerance overhead, though the paper does not measure this directly.", "practicality": {"readiness": "Near-term (1-2 years)", "score": 5, "explanation": "Neutral-atom hardware groups could adopt these methods, and the proposed cooling upgrade uses established techniques, but the demonstration covers only seven atom pairs with stochastic loading (about 30% pair occupancy). The apparatus needs a cryostat, a high-power 319 nm UV laser and tight electric-field control. The authors estimate the current lenses could fit a few hundred tweezers, with larger arrays needing aberration correction or in-vacuum objectives, and cooling power supporting over ten thousand tweezers."}, "limitations": "The measured CZ fidelity has a sizable uncertainty and does not yet exceed the best room-temperature result; state preparation is about 99.2%, and the 99.97% figure depends on unimplemented upgrades. Reduced correlated errors, parallel operation, and scaling to large arrays remain unproven here.", "tags": ["neutral atoms", "Rydberg gates", "cryogenic quantum computing", "gate fidelity", "cesium tweezer arrays"]}, "error": null, "rank": 2}, {"id": "2610.39067", "title": "Individually Addressed Logical Pauli Measurements by QLDPC Surgery on a Trapped Ion Quantum Computer", "authors": "Surabhi Luthra, Alex Owens", "abstract": "Quantum low-density parity check (QLDPC) codes may lead to order-of-magnitude reductions in the qubit overhead required for fault-tolerant quantum computation. Achieving this improved overhead requires logical operations that selectively address individual logical qubits encoded within multi-qubit code blocks. Recently proposed architectures achieve this through QLDPC surgery, in which non-destructive Pauli measurements are performed using ancillary ''gadget'' systems transiently entangled with the code block, generalising lattice surgery. Here we implement QLDPC surgery on a [[10,2,3]] generalised bicycle code using Quantinuum's H2-2 trapped ion processor. A single-round surgery measurement using seven gadget qubits measures the $\\bar{X}_1$ operator with a 0.72 [0.32, 1.41]% (95% credible interval) error rate and agrees with subsequent transversal measurement with 1.03 [0.60, 1.65]% error. Decoding across three rounds of syndrome extraction suppresses the gadget measurement error, reducing the error rate to below 0.26%. The syndrome after surgery confirms return to the code space and the unaddressed ''spectator'' qubit is preserved with error 0.21 [0.04, 0.67]% during the three-round measurement. We further demonstrate composition of conjugate basis gadgets by sequentially measuring $\\bar{X}_1$ then $\\bar{Z}_2$, reusing the gadget qubits, and obtain a 1.12 [0.60, 1.94]% error in the $\\bar{Z}_2$ measurement. These results constitute a hardware validation of the generalised surgery primitive underlying Pauli-based computing for QLDPC architectures.", "categories": ["quant-ph"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.39067", "pdf_url": "https://arxiv.org/pdf/2610.39067", "score": 88, "why_selected": "Hardware demonstration of addressed logical measurements via QLDPC surgery validates a key primitive for low-overhead fault tolerance, albeit on a small code.", "basis": "full text", "summary": {"tldr": "First reported hardware QLDPC surgery: on a trapped-ion processor, gadgets non-destructively measured one logical qubit of a [[10,2,3]] block at about 1% error, preserving its neighbour.", "goal": "QLDPC codes pack several logical qubits into one block, promising far lower qubit overhead than the surface code, but that saving requires addressing logical qubits individually. Pauli-based computing also needs those measurements to be non-destructive, unlike transversal readout, which collapses the encoded state. QLDPC surgery is a leading proposed solution, and the authors report it had not previously been shown on hardware within a multi-qubit code block.", "approach": "The team ran a [[10,2,3]] generalised bicycle code on Quantinuum's 56-qubit, all-to-all connected H2-2 ion trap, using 27 qubits: 10 data, 10 stabiliser ancillas and 7 for the gadget (3 gadget qubits, 4 gadget checks). The gadget temporarily merges with the code so that the parity of its checks reveals a chosen logical operator, then detaches with a 'fusion' correction based on the gadget-qubit measurements. Circuits covered one-round (XR1) and three-round (XR3) measurements of logical X1, a sequential X1 then Z2 measurement reusing the gadget qubits (SEQ), and a 5-cycle memory control, with 500-1,500 shots per circuit type. Decoding was offline with the Tesseract decoder, results were compared with Stim simulations of a device-based error model, and headline figures keep only shots with a trivial first syndrome round (under 5% rejected).", "key_results": ["Single-round X1 gadget error was 0.72 [0.32, 1.41]% against the prepared state, and the gadget disagreed with later transversal readout at 1.03 [0.60, 1.65]%; a model of undetectable single faults predicts about 0.60%.", "Three-round decoding raised the circuit distance from 1 to 3 and gave 0 errors in 957 verified shots (<0.26%, 95% CrI). Removing the between-round gadget-check detectors gave 7/957 errors, attributing the gain to catching readout faults.", "The code block survived: with fusion correction, trailing-layer detector rates on deformed stabilisers were at most 2.66% versus about 50% without it, and the unaddressed spectator qubit had 0/971, 2/957 and 0/978 readout errors across the three circuits.", "Sequential measurement with reused gadget qubits gave a Z2 gadget error of 1.12 [0.60, 1.94]% (11/978), matching simulation at about 1.0%, while Z1 came out random as expected after the conjugate X1 measurement."], "implications": "The result validates the basic primitive behind proposed low-overhead QLDPC architectures: addressable, non-destructive logical Pauli measurements that can be composed in sequence. Agreement with a simple circuit-level error model suggests the protocol behaves as theory predicts at this small scale. It does not yet show the overhead savings themselves, since those depend on larger codes.", "practicality": {"readiness": "Long-term (3+ years)", "score": 3, "explanation": "Quantum error-correction and hardware teams can use these circuits, the detector analysis and the open data now as a benchmark for surgery on all-to-all connected devices. Useful Pauli-based computing still needs larger-distance codes, real-time decoding with feed-forward, and Pauli-product measurements through bridging gadgets. The timeline is my inference; the paper gives none."}, "limitations": "The distance-3 code is small, equivalent to a rotated toric code, and decoding was offline; the sequential measurement was single-round (distance 1), so it was not fault-tolerant against gadget readout errors. The three-round result was tested only on one preparation and depends entirely on post-selection: without it there were 10/1000 errors, all within a roughly 10-second hardware excursion that randomised the detectors.", "tags": ["QLDPC codes", "logical surgery", "trapped ions", "fault tolerance", "Pauli-based computing"]}, "error": null, "rank": 3}, {"id": "2610.37840", "title": "Ground-state energy estimation compiled on cat qubits: 7 164 qubits for FeMoco-54 in 23.5 hours", "authors": "Larissa Kroell, Hugo Jacinto, Victor Hertz, Axel Pappalardo, Adel Ben Moussa, Manuel Rispler, Peter Shanahan, \\'Elie Gouzien, Christophe Vuillot, Vivien Londe", "abstract": "We provide a detailed resource estimate of the state-of-the-art sum-of-squares block encoding algorithm for electronic structure Hamiltonians of Low et al. on superconducting cat qubits. To achieve this, we present compilations with closed-form costs of the dominant subroutines such as skew-tree Qrom, a Swap network and a Phaseup for both a repetition-cat and an LDPC-cat architecture. Our compilation represents algorithmic qubits in the $X$ basis, taking advantage of the asymmetric cost of $X$ and $Z$ access that the concatenation of cat qubits with phase-flip classical code brings. Additionally, we provide a protocol for $\\vert i \\rangle$-state distillation and a two-level Toffoli-like $\\vert \\text{C}_X\\text{C}_X X \\rangle$ magic state distillation protocol, including three factory layouts. To minimize the cost of Clifford corrections induced by magic state injections we tailor injection gadgets to each subroutine. Combining our compilation work with the adder compilation from the companion work Pappalardo et al., we provide global layouts for the block encoding in both architectures which we use to obtain resource estimates for ground-state energy estimation for the benchmarks of FeMoco-54 and FeMoco-76. Assuming a cycle time of 1$\\mu$s, a reaction time of 10$\\mathrm{\\mu}$s, a phase estimation precision of 1 mHa and circuit-level phase-flip noise with probability $p_Z = 5 \\times 10^{-4}$ with negligible bit-flip error, FeMoco-54 requires fewer than $7\\,500$ cat qubits with an expected runtime of under one day for a single phase estimation run using an LDPC-cat architecture. Relaxing the bit-flip requirement to $p_X = 10^{-11}$ with an additional layer of elevator codes raises this to an estimated $13\\,000$ cat qubits.", "categories": ["quant-ph"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.37840", "pdf_url": "https://arxiv.org/pdf/2610.37840", "score": 86, "why_selected": "Detailed FeMoco compilation under 7,500 cat qubits sets a concrete benchmark for useful quantum chemistry, with strong but assumption-dependent estimates.", "basis": "truncated full text", "summary": {"tldr": "A fully compiled resource estimate puts FeMoco-54 energy estimation at 7,164 cat qubits and about 23.5 hours per run, assuming negligible bit-flip errors.", "goal": "Quantum chemistry is a leading proposed use of fault-tolerant quantum computers, but credible cost estimates must account for how an algorithm maps onto specific hardware. This paper asks what the best-known ground-state energy algorithm would cost on cat qubits, which suppress bit flips in hardware but offer a restricted set of logical operations. FeMoco, a nitrogenase cofactor, serves as a fully specified benchmark rather than a claim of quantum advantage, since recent classical work estimates even FeMoco-76 to about chemical accuracy.", "approach": "The authors compile the sum-of-squares, double-factorized tensor hypercontraction block encoding of Low et al., reusing published Hamiltonian parameters and precisions, onto repetition-cat and LDPC-cat architectures. Algorithmic qubits are represented in the X basis because X access is cheap, while Z access costs space (repetition-cat corridors) or time (a shared LDPC-cat routing layer). They derive closed-form costs for skew-tree QROM, Swap networks and Phaseup, tailor injection gadgets to reduce Clifford corrections, and design |i\u27e9-state distillation plus two-level Toffoli-like magic-state factories. New circuit-level simulations refine the LDPC-cat logical error model, and the adder comes from a companion paper. Estimates assume 1 \u00b5s cycle time, 10 \u00b5s reaction time, 1 mHa precision, serial Toffolis from a single factory, and phase-flip noise of p_Z = 5\u00d710\u207b\u2074.", "key_results": ["FeMoco-54 on LDPC-cat needs 7,164 physical qubits, 2.01\u00d710\u2079 Toffolis and 0.98 days (about 23.5 hours) expected per phase-estimation run; FeMoco-76 needs 7,818 qubits and 3.31 days.", "LDPC-cat reduces the footprint by 36\u201338% at comparable runtime versus repetition-cat, which needs 11,192 qubits for FeMoco-54 and 12,568 for FeMoco-76 in the reference configuration. A repetition-cat variant reaches 11,176 qubits and 14.8 hours for FeMoco-54.", "For equal runtime, the surface-code estimate from prior work needs 8\u201322\u00d7 more physical qubits than repetition-cat and 15\u201337\u00d7 more than LDPC-cat, though on hardware with simpler qubits and unbiased noise.", "Neglecting bit flips requires p_X \u2248 10\u207b\u00b9\u2078. Relaxing to p_X = 10\u207b\u00b9\u00b9 with an added elevator-code layer is extrapolated, not fully compiled, to 12,694 LDPC-cat or 19,830 repetition-cat qubits for FeMoco-54."], "implications": "The results suggest that biased-noise hardware, paired with compilation built around its asymmetric operations, could cut chemistry overheads by an order of magnitude versus surface-code estimates. They also show the best algorithm depends on architecture: repetition-cat is typically faster for a given circuit, while LDPC-cat benefits more from spacetime trade-offs because added logical qubits are proportionally cheaper. Data loading dominates runtime, and factories take up a substantial share of the footprint, which points to clear targets for further optimization.", "practicality": {"readiness": "Long-term (3+ years)", "score": 3, "explanation": "Hardware architects and algorithm teams can use the closed-form costs and layouts now for planning and benchmarking. Running the algorithm requires thousands of cat qubits with strong phase-flip performance and extremely low bit-flip rates, plus more complex qubit designs and, for LDPC-cat, a stacked routing layer. It also gives a benchmark rather than a useful chemistry result, since FeMoco is not presented as a demonstration of quantum advantage."}, "limitations": "The headline numbers rest on assumed hardware parameters, a single phase-estimation run, and p_X \u2248 10\u207b\u00b9\u2078, while the bit-flip-tolerant figures are extrapolations awaiting a full compilation, and robustness to lower noise bias is unexplored. Most authors are affiliated with cat-qubit company Alice & Bob, and this summary covers only the portion of the paper provided, which cuts off during the subroutine descriptions.", "tags": ["cat qubits", "resource estimation", "quantum chemistry", "fault-tolerant compilation", "LDPC codes"]}, "error": null, "rank": 4}, {"id": "2610.37765", "title": "Long-Range Toric Code: Finite-Temperature Topological Order in Two Dimensions", "authors": "Jacopo Gliozzi, Taylor L. Hughes, Kyung-Su Kim", "abstract": "We introduce two-dimensional toric code models with additional long-range loop interactions. Our models preserve the topologically ordered ground states of the ordinary toric code, while confining anyons at zero temperature. For sufficiently long-ranged interactions, we argue that this confinement persists at finite temperatures, strongly constraining anyon mobility and giving rise to finite-temperature topological order. This topological phase acts as a self-correcting quantum memory and exhibits long-range entanglement. For shorter-ranged interactions, signatures of topological order survive only up to an exponentially large length scale at finite temperature, yielding a partially self-correcting quantum memory.", "categories": ["cond-mat.str-el", "cond-mat.stat-mech", "quant-ph"], "announce_type": "cross", "abs_url": "https://arxiv.org/abs/2610.37765", "pdf_url": "https://arxiv.org/pdf/2610.37765", "score": 85, "why_selected": "Finite-temperature topological order and self-correction in 2D would be a conceptual breakthrough for quantum memory, though the persistence claim is argued and relies on long-range interactions.", "basis": "abstract only", "summary": {"tldr": "Adding long-range loop interactions to the 2D toric code confines anyons and, for long enough range, is argued to yield finite-temperature topological order and self-correcting quantum memory.", "goal": "The ordinary 2D toric code stores quantum information in topologically ordered ground states, but at any nonzero temperature thermally created anyons can move freely and destroy that order. The paper asks whether long-range interactions can stabilize topological order at finite temperature in two dimensions, which would provide a self-correcting quantum memory, one that protects information passively.", "approach": "The authors construct 2D toric code models with added long-range loop interactions, designed to keep the ordinary toric code's topologically ordered ground states while confining anyons at zero temperature. They then examine how this confinement behaves at finite temperature as the interaction range varies. The abstract presents the finite-temperature result as an argument (\"we argue\") rather than a stated proof. It does not specify the interaction form, the analytical or numerical methods, or any simulations, and it mentions no experimental implementation.", "key_results": ["The models preserve the toric code's topologically ordered ground states while confining anyons at zero temperature.", "For sufficiently long-ranged interactions, the authors argue confinement persists at finite temperature, strongly constraining anyon mobility and producing finite-temperature topological order.", "This finite-temperature phase acts as a self-correcting quantum memory and exhibits long-range entanglement.", "For shorter-ranged interactions, signatures of topological order survive at finite temperature only up to an exponentially large length scale, giving a partially self-correcting memory. The abstract gives no numerical thresholds for range or temperature."], "implications": "If the argument holds, long-range interactions offer a route to finite-temperature topological order in two dimensions, where the ordinary toric code loses it. It also suggests a graded picture in which interaction range determines whether a memory is fully or only partially self-correcting, which is relevant to passive quantum error protection.", "practicality": {"readiness": "Theoretical", "score": 2, "explanation": "This is a theoretical model study of interest mainly to quantum information and many-body theorists exploring passive memory designs. The abstract identifies no hardware platform or implementation. Realizing the required long-range loop interactions would be the obvious open hurdle, and the abstract gives no route to doing so."}, "limitations": "The finite-temperature confinement claim is stated as an argument, and the abstract provides no quantitative thresholds, memory lifetimes, or numerical evidence. Only the abstract was available, so the methods and the strength of the supporting evidence could not be assessed.", "tags": ["toric code", "topological order", "self-correcting quantum memory", "long-range interactions", "anyon confinement"]}, "error": null, "rank": 5}, {"id": "2610.40571", "title": "On the Quantum Chromatic Gap II", "authors": "Lorenzo Ciardo, Antoine Mottet", "abstract": "We confirm a conjecture of the first author [SODA'26] on a strong form of pseudo-telepathy for Khot's $d$-to-$1$ games: for every $d\\geq 4$, every $\\epsilon>0$, and every $k\\in\\mathbb N$, there is a $d$-to-$1$ label-cover game of classical value less than $\\epsilon$ that admits a perfect quantum strategy using finite-dimensional shared entanglement with measurement contexts of radius at least $k$. As a consequence, there exist graphs whose quantum chromatic number $\\chi_q$ is $3$ and whose classical chromatic number $\\chi$ is arbitrarily large. This is the first improvement on the quantum chromatic gap since the work of Brassard, Cleve, and Tapp [Phys. Rev. Lett.'99], which produced graphs for which $\\chi$ grows exponentially in $\\chi_q$. To prove the conjecture, we proceed as follows. We start with a ``stretched'' version of the Mermin--Peres magic square, obtained by spacing out its equations and linking them with additional long equation wires. This operation increases the radius of the initial measurement contexts of a perfect quantum strategy for the game, while preserving classical unsatisfiability. We then apply parallel repetition to make the classical value small, and we turn the system into a pseudo-telepathic multi-layered Kneser hypergraph via a PCP construction of Dinur, Guruswami, Khot, and Regev [STOC'03]. Finally, we feed the resulting hypergraph into the reduction of Fei, Minzer, and Wang from hypergraph colouring to $4$-to-$1$ games, we establish quantum completeness of this reduction, and we show that it preserves context radius.", "categories": ["quant-ph", "cs.CC", "cs.LO", "math.CO", "math.OA"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.40571", "pdf_url": "https://arxiv.org/pdf/2610.40571", "score": 83, "why_selected": "Rigorous proof of an unbounded quantum chromatic gap is the first improvement since 1999, a major result in nonlocal games with mainly theoretical reach.", "basis": "full text", "summary": {"tldr": "Graphs exist with quantum chromatic number 3 and arbitrarily large classical chromatic number, so entanglement's advantage in the colouring game is unbounded.", "goal": "In the graph colouring game, two separated players must convince a verifier that a graph has a proper colouring, and shared entanglement can let them win with fewer colours than the classical chromatic number \u03c7. The open question was whether \u03c7 is bounded by some function of the quantum chromatic number \u03c7_q, which would mean extra colours could always replace entanglement. The best known gap was exponential (Brassard\u2013Cleve\u2013Tapp 1999), and Ciardo [SODA'26] had reduced an unbounded gap to a pseudo-telepathy analogue of Khot's d-to-1 conjecture.", "approach": "This is a pure mathematical proof, with no experiments or numerics. It starts from the Mermin\u2013Peres magic square and replaces each variable with a long wire of auxiliary equations, so its perfect quantum strategy on C^4 becomes k-compatible (measurements on questions within distance k commute) while the system stays classically unsatisfiable. Raz's parallel repetition then drives the classical value down, and the multi-layered PCP and Kneser hypergraph constructions of Dinur et al. give 3-uniform hypergraphs with a perfect k-compatible quantum 2-colouring but large chromatic number. These feed into the Fei\u2013Minzer\u2013Wang reduction to at most 4-to-1 games, where the authors prove quantum completeness and preservation of compatibility, using FMW's soundness analysis as a black box. A padding step gives exact d-to-1 games, and Ciardo's earlier theorem converts them into graphs.", "key_results": ["Conjecture confirmed for every d\u22654: for all \u03b5>0 and k, some d-to-1 game has classical value below \u03b5 yet a perfect k-compatible quantum assignment with finite-dimensional entanglement.", "For every c there is a graph with \u03c7_q = 3 and \u03c7 > c, so no function f gives \u03c7 \u2264 f(\u03c7_q). The value 3 is optimal, since \u03c7_q = 2 implies the graph is bipartite.", "Intermediate result: for all c and k, a 3-uniform hypergraph exists with chromatic number above c and a perfect k-compatible quantum 2-colouring.", "The gap also holds for the oracular quantum chromatic number, where measurements on adjacent vertices must commute. The entanglement dimension must grow without bound as c grows."], "implications": "No number of additional colours lets classical players simulate entangled players in general, which improves on the exponential separation that stood since 1999. It also shows that the rank-one projector restriction in the exponential bound of Cameron et al. is essential. Methodologically, it transfers pseudo-telepathy along the hardness-of-approximation chain, with the magic square in place of the PCP theorem, though the authors note that a direct proof would be expected and none is known.", "practicality": {"readiness": "Theoretical", "score": 1, "explanation": "This is an existence result of interest to researchers in nonlocal games, quantum information theory and complexity. The graphs are not given explicitly, and both they and the required entangled states are described as enormous, so no experimental or computational use is in sight. They can in principle be reconstructed through seven successive transformations."}, "limitations": "The construction is non-explicit and huge, and finding small or explicit graphs remains open, as does the conjecture for d=2 and d=3. The proof relies on the Fei\u2013Minzer\u2013Wang soundness analysis as a black box, and the authors disclose using an AI assistant for lower-level proof details while taking full responsibility for correctness.", "tags": ["quantum chromatic number", "pseudo-telepathy", "nonlocal games", "d-to-1 games", "contextuality"]}, "error": null, "rank": 6}, {"id": "2610.40526", "title": "Quasi-Phases of Quantum Matter", "authors": "Nick G. Jones, Paul Fendley, Nathanan Tantivasadakarn, Ruben Verresen", "abstract": "Within quantum many-body phase diagrams, continuous transition lines can appear and then terminate. However, it has remained unclear whether the neighboring regimes can be meaningfully described as distinct phases, akin to water and vapour, since any sharp characterization would have to go beyond the usual notion of phases of matter. We answer this in the affirmative by introducing quasi-phases: gapped regimes near a critical point that are connected in the broader phase diagram, but not by any gapped path accessible from small perturbations of the critical theory. The physical consequences include interface modes between regimes in the same phase of matter. More striking still, describing both the extended critical line and the gapped path connecting the regimes requires a bigger multicritical parent theory. In spin-chain examples with continuous terminating lines with central charge $c=1$, we find multicritical $c=3/2$ and $c=9/5$ orbifolds describing so-called 'quotient symmetry protected' and 'representation symmetry protected' topological phenomena. While one-dimensional symmetry-protected topological phases are labeled by projective representation classes, these quasi-phases can have interface modes carrying higher-dimensional linear representations. We turn this into a constructive principle through a weakening of the Lieb-Schultz-Mattis anomaly. Supporting distinct quasi-phases makes an unnecessary critical point infrared-necessary, even if it is unnecessary at the ultraviolet scale. This condition is more restrictive than simply having a codimension-one critical line, revealing richer structure within phases of matter than their conventional classification suggests.", "categories": ["cond-mat.str-el", "cond-mat.stat-mech", "quant-ph"], "announce_type": "cross", "abs_url": "https://arxiv.org/abs/2610.40526", "pdf_url": "https://arxiv.org/pdf/2610.40526", "score": 80, "why_selected": "Quasi-phases introduce a broadly applicable new concept extending phase classification, with concrete spin-chain examples and potentially wide theoretical influence.", "basis": "truncated full text", "summary": {"tldr": "Quasi-phases are gapped regimes of one phase that look distinct near a critical point; connecting them needs a larger multicritical parent theory, as shown in spin chains.", "goal": "Some continuous transition lines end inside a single phase of matter, like the liquid-vapour line, so the two sides share all global topological labels. The paper asks whether those sides can still be sharply distinguished, and why such 'unnecessary' transitions and SPT-like features (edge modes, entanglement degeneracies) appear in nominally trivial phases.", "approach": "The authors define phases relative to a critical point: two gapped regimes are distinct quasi-phases if no small perturbation of that critical point, including spatially inhomogeneous or bulk-irrelevant ones, flows to an invertible interface between them. They test this on 1+1D lattice models: a bond-alternating spin-1 XX chain with D4 symmetry (QSPT), a perturbed spin-1/2 XX chain with S3 symmetry (RSPT), and Potts/anti-Potts chains with their Kramers-Wannier duals. Explicit gapped paths come from exact solutions, product states and matrix product states. Infinite DMRG with entanglement scaling supplies phase diagrams and central charges, and correlators test field theories that gauge a diagonal symmetry between a free boson and an Ising or Potts CFT (an orbifold). An interface argument based on a weakened Lieb-Schultz-Mattis constraint is proposed for constructing more examples.", "key_results": ["Spin-1 D4 chain: an explicit gapped path links the two bond alternations, yet the c=1 line between them persists from large D down to a numerically located c=3/2 multicritical point at D\u22482.0333, then opens into an extended c=1 region. Correlators fit the Ising-boson orbifold with Luttinger parameter K\u22480.51, close to the 1/2 fixed by a non-invertible SU(2) symmetry.", "S3 spin-1/2 chain: a gapped path through trimer product states exists, while the c=1 line opens at a BKT transition (1.3<\u03bb<1.4) into a Z3-breaking region ending at a Potts transition near \u03bb\u22483.995. A modified chain reaches the proposed Potts-boson orbifold directly, with entanglement scaling at \u03bcc\u22483.35 agreeing with c=9/5.", "Potts and anti-Potts chains, previously seen as possibly distinct, lie in the same S3-breaking phase, and their Kramers-Wannier duals lie in the same trivial phase. Gapped paths preserve charge conjugation and time reversal, and the c=1 line between them terminates at a c=3/2 point.", "RSPT edge modes depend on boundary termination: the same bulk Hamiltonian gives a protected doublet or a unique ground state depending on the boundary term. Quasi-phase interfaces can carry higher-dimensional linear representations, unlike the projective ones of conventional 1D SPT phases."], "implications": "Near certain critical points, gapped matter has sharp structure that the standard classification misses, and QSPT and RSPT phenomena gain a precise meaning. The framework separates 'IR-necessary' criticality from generic unnecessary criticality and uses quasi-phases as a guide for finding new multicritical theories. Its definition is stated for general dimensions, though examples here are all 1+1D.", "practicality": {"readiness": "Theoretical", "score": 2, "explanation": "This is a conceptual framework for theorists studying quantum phases, criticality and spin-chain models, and its constructions and diagnostics can be used in numerical studies now. The paper proposes no experiment or device, so laboratory realization of these specific phase diagrams remains unaddressed."}, "limitations": "Evidence is from specific 1+1D models centered on c=1 free-boson criticality, combining field-theory arguments with numerics, and some claims are expectations rather than proofs, such as which interface RG flow selects in the RSPT case. The Potts nature of the symmetry-breaking boundary is unconfirmed, the role of charge pumps needs clarification, and higher-dimensional examples remain open.", "tags": ["quasi-phases", "unnecessary criticality", "symmetry-protected topology", "orbifold CFT", "spin chains"]}, "error": null, "rank": 7}, {"id": "2610.40490", "title": "Fast and accurate neural triage decoding of ultra-high-rate quantum LDPC codes", "authors": "Hong-Ye Hu, Zhenlai Wang, Binzhao Luo, Tao Xiang, Chen Zhao", "abstract": "Quantum error correction is essential for fault-tolerant quantum computing. High-rate quantum low-density parity-check (qLDPC) codes have emerged as a promising approach to reducing the substantial physical qubit overhead of quantum error correction, enabling encoding rates exceeding $1/2$ in blocks of approximately one thousand physical data qubits. However, their practical implementation requires decoders that combine high accuracy with low latency to keep pace with quantum hardware. Existing decoders of high-rate qLDPC codes can achieve high accuracy but often incur substantial computational latency, whereas neural network decoders have yet to be demonstrated for high-rate qLDPC codes. Here, we introduce \\emph{neural triage decoding}, a framework that uses syndrome consistency to adaptively allocate neural computation. A local neural message-passing network rapidly predicts error corrections, additional iterations reduce residual syndrome violations, and a rarely invoked diversification stage searches for consistent corrections to the remaining shots. We demonstrate that the \\texttt{Triage} decoder can decode ultra-high-rate qLDPC codes encoding a few hundred logical qubits, including lifted-product and Kasai codes, achieving state-of-the-art accuracy comparable to the near optimal algorithmic decoders while reducing decoding latency by approximately one to two orders of magnitude. Our framework is inspired by a rigorous analysis of the exact bitwise marginal decoder, revealing a distance-independent syndrome-inconsistent error floor. In addition, we show the robustness of neural network decoders to mismatched error priors. Our results establish adaptive neural decoding as a promising route towards fast, accurate, and scalable quantum error correction in the near term.", "categories": ["quant-ph", "cs.AI", "cs.IT", "cs.LG", "math.IT"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.40490", "pdf_url": "https://arxiv.org/pdf/2610.40490", "score": 79, "why_selected": "Neural decoding of ultra-high-rate qLDPC codes with one to two orders of magnitude lower latency addresses a pressing practical bottleneck, supported by numerics.", "basis": "full text", "summary": {"tldr": "A neural decoder that escalates effort only on hard shots matches or beats strong algorithmic decoders on two high-rate qLDPC codes, at 28\u2013343\u00d7 lower amortized cost in simulation.", "goal": "High-rate quantum LDPC codes can store hundreds of logical qubits in about a thousand physical data qubits, cutting the overhead of error correction. That only helps if a classical decoder can infer errors both accurately and fast, yet strong algorithmic decoders are slow, and neural decoders had not been shown at this scale. The paper aims to deliver both accuracy and speed on codes encoding hundreds of logical qubits.", "approach": "The Triage decoder runs a local graph neural network (NeuralMP) on the sparse graph linking possible faults to detectors, predicting an error score for each fault. It reapplies the network to any leftover syndrome for up to 4 passes; shots still unresolved go to a rarely used search stage that tries syndrome flips (192 candidates), plus symmetry permutations and prior perturbations for one code, and keeps the most likely consistent correction. Networks were trained on simulated data at a single error rate (p = 2%), with a replay bank of hard failures. Benchmarks were simulated memory experiments under phenomenological noise on the [[1122,148,\u226420]] lifted-product code (LP20, 5 noisy rounds) and the [[1152,580,\u226412]] Kasai code (8 noisy rounds), compared against BP-OSD and a BP-relay-MLE 'Tiered' decoder. The design is motivated by a proof of why decoding each bit independently fails.", "key_results": ["Accuracy at p = 1.5%: logical error rate per qubit
