<script>
// Shared rendering for the live app and exported/published digest pages.

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function readinessClass(r) {
  if (r.startsWith("Usable")) return "ready-now";
  if (r.startsWith("Near")) return "ready-near";
  return "ready-far";
}

function paperCard(p) {
  const s = p.summary;
  const head = `
    <div class="paper-head">
      <div class="rank">${p.rank}</div>
      <div>
        <h2><a href="${esc(p.abs_url)}" target="_blank" rel="noopener">${esc(p.title)}</a></h2>
        <div class="authors">${esc(p.authors)}</div>
        ${s ? `<div class="tldr">${esc(s.tldr)}</div>` : ""}
        <div class="chips">
          ${s ? `<span class="chip ${readinessClass(s.practicality.readiness)}">${esc(s.practicality.readiness)}</span>` : ""}
          ${(s?.tags || []).map((t) => `<span class="chip">${esc(t)}</span>`).join("")}
          ${p.basis !== "full text" ? `<span class="chip">Based on ${esc(p.basis)}</span>` : ""}
        </div>
      </div>
    </div>`;
  if (!s) {
    return `<article class="paper">${head}<p class="authors">The full breakdown couldn't be generated: ${esc(p.error)}</p>
      <p>${esc(p.abstract)}</p>${links(p)}</article>`;
  }
  const pct = Math.max(0, Math.min(10, s.practicality.score)) * 10;
  return `<article class="paper">${head}
    <div class="grid">
      <div class="section"><h3>Goal</h3><p>${esc(s.goal)}</p></div>
      <div class="section"><h3>How they did it</h3><p>${esc(s.approach)}</p></div>
      <div class="section"><h3>Key results</h3><ul>${s.key_results.map((r) => `<li>${esc(r)}</li>`).join("")}</ul></div>
      <div class="section"><h3>Implications</h3><p>${esc(s.implications)}</p></div>
      <div class="section"><h3>Real-world practicality · ${s.practicality.score}/10</h3>
        <div class="practical-bar"><div style="width:${pct}%"></div></div>
        <p>${esc(s.practicality.explanation)}</p></div>
      <div class="section"><h3>Limitations</h3><p>${esc(s.limitations)}</p></div>
    </div>
    <details><summary>Why it made the top 10</summary><p>${esc(p.why_selected)}</p></details>
    ${links(p)}
  </article>`;
}

function links(p) {
  return `<div class="links"><a href="${esc(p.abs_url)}" target="_blank" rel="noopener">Abstract</a>
    <a href="${esc(p.pdf_url)}" target="_blank" rel="noopener">PDF</a></div>`;
}

function fmtDate(iso) {
  return new Date(iso + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
}

const PAPERS = [{"id": "2610.39302", "title": "Proving and Improving the Platonic Representation Hypothesis with JEPAs", "authors": "Randall Balestriero, Yann LeCun", "abstract": "Whether models trained on different modalities converge to the same representation of the world is central to AI. The Platonic Representation Hypothesis (PRH) conjectures that they do as they scale, but without a proof it offers neither a guarantee nor a recipe. We turn the hypothesis into a theorem. First, we prove a \\emph{Platonic Representation Theorem}: Joint-Embedding Predictive Architectures (JEPAs) trained separately on any number of modalities learn the same representation up to one rotation whenever their positive pairs are two observations of one scene--\\emph{good views}--and their misalignment is bounded otherwise. Second, we show that next-token prediction is a JEPA with \\emph{bad views}, parts of a single document, which explains why language models align with vision only through scale. Third, we validate the theory from 145k captions to the texts of 940M web images, and uncover a scaling law of alignment that predicts unseen runs within seed noise. Good views need 42 times fewer training samples than next-token prediction on the same corpus to reach the same alignment, and a 109M-parameter text JEPA aligns with DINOv2 and CLIP's image encoders better than every language model we evaluated, up to 72B parameters, and than CLIP's text encoder: next-token prediction is a remarkably inefficient route to platonic representations. As a showcase, one rotation turns separately trained encoders into an image captioner (CIDEr .838 on COCO). Even that rotation needs no pair: on the latest pair-free benchmark, our text JEPA beats every zero-shot accuracy reported with language models up to 8B parameters, e.g., 64\\% against at most 56\\% top-5 on ImageNet-100. Positive views, and not scale alone, are thus the lever to build platonic representations.", "categories": ["cs.AI", "cs.CV", "stat.ML"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.39302", "pdf_url": "https://arxiv.org/pdf/2610.39302", "score": 85, "why_selected": "From high-profile authors: proves a form of the Platonic Representation Hypothesis for JEPAs, with large-scale validation and striking efficiency results.", "basis": "full text", "summary": {"tldr": "Proves that JEPAs trained separately on different modalities learn the same representation, up to one rotation, when their positive pairs are two observations of one scene. A 109M text model built this way aligns with vision models better than 72B LLMs.", "goal": "The Platonic Representation Hypothesis (PRH) says that vision and language models drift toward a shared representation of the world as they scale. So far it is only an empirical observation: there is no proof, no prediction of when it holds, and no training recipe beyond scaling up. The paper asks when separately trained models provably learn the same representation, and whether that answer can make alignment cheaper.", "approach": "The theory uses an idealized finite world that each modality renders injectively. A JEPA (Joint-Embedding Predictive Architecture) trained with whitening-style anti-collapse learns the top eigenvectors of the graph drawn by its positive pairs. If two modalities share that positive-pair distribution, their optimal encoders are equal up to a rotation (the 'Platonic Representation Theorem'); if the distributions differ, a Davis-Kahan-style bound caps the misalignment. 'Bad views' (two corruptions of one observation) are shown to spend embedding dimensions on modality-specific nuisance such as wording or viewpoint, and next-token prediction is recast as a bad-view JEPA. Empirically, the authors train BERT-style text JEPAs (11M-335M parameters) with LeJEPA/SIGReg in three variants that differ only in their positives: good views (different captions or texts of the same image), bad views (masked spans of one text), and next-token prediction on identical text. Data ranges from Flickr30k (145k captions) to the texts of up to 940M Recap-DataComp web images. Alignment is measured against frozen DINOv2, CLIP, MAE and I-JEPA image encoders using mutual 10-NN, CKA, and retrieval through one fitted rotation (Procrustes).", "key_results": ["On the same corpus, a good-view JEPA reaches next-token prediction's WIT-1024 alignment with DINOv2 (about .11) after 21.6M training samples instead of 900M. That is 42 times fewer samples and 14 times fewer tokens, though the two runs used different batch sizes and learning rates.", "A 109M good-view text JEPA trained on the texts of 940M images scores .184 mutual 10-NN with DINOv2 ViT-B on the PRH benchmark (mean of 3 seeds). That beats Qwen2.5-72B (.154), Llama-3-70B (.151) and CLIP's text encoder (.124), and the lead holds with CKA, on COCO, and with CLIP, MAE and I-JEPA image encoders. A 4th seed with a different regularization weight scored only .121.", "A scaling law in the fraction of good views and samples seen predicted 85 unseen runs (RMSE .0093), about as accurately as rerunning a run with a new seed (.0096). It overestimated runs at 4 times its fitted range.", "One rotation joining frozen DINOv2/DINOv3 to a decoder trained on text alone gives a captioner with CIDEr .838 on COCO. With no pairs at all, aligning via the method of Schnaus et al. reaches 64.4% top-5 zero-shot accuracy on ImageNet-100, versus 47.6% for Qwen3-8B rerun under the same conditions and 56% as the best in that paper."], "implications": "Cross-modal convergence is reframed as a question of which positive pairs a model trains on, not only of scale. The paper argues that next-token prediction is an inefficient route to shared representations. It also shows practical uses: separately trained encoders can be combined with a single rotation, for captioning or retrieval, with few or no paired examples.", "practicality": {"readiness": "Near-term (1-2 years)", "score": 6, "explanation": "Code and a demo are released, and the recipe uses standard BERT/ViT models with LeJEPA. Teams building multimodal systems could use the rotation-alignment trick now. The main obstacle is that good views require knowing which texts describe the same scene. At web scale, two of each image's three texts were written by a LLaVA captioner (which sees images through CLIP), so image-text information leaks in. Without that captioner, WIT alignment drops from .107 to .060. Training was also prone to collapse without gradient clipping."}, "limitations": "The theorems hold only in an idealized setting: a finite world, injective renderings, population optima, and uniqueness up to rotation (proved only for second-order anti-collapse), and no experiment meets these assumptions exactly. The large-scale wins over LLMs depend on texts generated by a vision-language captioner, a regularization weight that was chosen after seeing WIT results, and gaps against the smaller LLMs that fall within noise.", "tags": ["Platonic Representation Hypothesis", "JEPA", "self-supervised learning", "multimodal alignment", "spectral embedding"]}, "error": null, "rank": 1}, {"id": "2610.39295", "title": "There Is No Free Lunch in RLVR: Every pass@1 Gain Has a pass@k Price", "authors": "Yinuo Liu", "abstract": "Reinforcement learning with verifiable rewards (RLVR) makes a language model solve more problems on the first try and fewer when given many tries: it raises pass@1 while the base model overtakes it at large sampling budget k. Is this a failure of RL to add reasoning, or a transient that more training removes? We settle the question with a theorem. The reversal is a price, and we compute its exact rate. Modeling RLVR as an exponential tilt of a base policy over strategies shared across prompts, we prove that under exclusive specialization every update that raises pass@1 strictly lowers the success of some prompt; a strictly positive price on prompts (Stiemke duality) is the exact condition, and being merely the best strategy on a prompt is provably not enough. When the loss reaches the hardest prompts, it forces a pass@k crossover, and the number of crossings is at most the sign variation of the shift in per-prompt success, a totally positive bound that is tight and that recovers the known single-crossover result as its order-preserving case. The crossover is not a bug to patch: a constrained update traces the exact pass@1 versus pass@k frontier, and removing the crossover entirely costs the entire pass@1 gain. The same tilt identity yields entropy collapse and the entropy-performance law with an identifiable exponent, unifying two literatures under one mechanism. Reinforcement cannot widen the reasoning frontier; it can only move along it, at a price we make measurable by a diagnostic that reads the bound, the order-preserving test, and the price from any evaluation log. There is no free lunch, only a price.", "categories": ["cs.LG", "cs.AI", "math.OC", "stat.ML"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.39295", "pdf_url": "https://arxiv.org/pdf/2610.39295", "score": 68, "why_selected": "Gives a theoretical account of the pass@1 vs pass@k tradeoff in RLVR, unifying it with entropy collapse; highly topical.", "basis": "full text", "summary": {"tldr": "In a simplified model of RL fine-tuning, the paper proves that once solution strategies specialize, every pass@1 gain must reduce success on some prompts, and it bounds how many times the pass@k curves can cross.", "goal": "RLVR (reinforcement learning with verifiable rewards, e.g. GRPO) makes LLMs solve more problems on the first try (pass@1). But when many samples are allowed (large k), the base model often catches up and overtakes it on pass@k. The field disagrees on whether this means RL adds no new reasoning or whether more training would remove the reversal. The paper tries to settle the question with theory: it argues the reversal is an unavoidable trade-off and tries to measure its rate.", "approach": "The model treats a policy as a probability distribution over a fixed set of solution 'strategies' shared across prompts, with a known matrix Q giving how likely each strategy is to solve each prompt. In the idealized population limit, RLVR (natural policy gradient or mirror descent with a KL anchor) becomes an exponential tilt of the base policy: each strategy's weight is multiplied by exp(\u03c4 \u00d7 its average success) and renormalized. GRPO is argued, mostly with numerical evidence, to stay close to this tilt. The proofs use Stiemke's lemma (a duality result from linear programming) to get exact conditions for a 'free lunch', meaning a pass@1 gain where no prompt gets worse. They use Karlin's variation-diminishing property of totally positive kernels to bound how often the pass@k curves can cross, and a linear program with per-prompt floors to trace the trade-off frontier. Everything is checked on synthetic random instances with an accompanying package; the only real-data evidence is one published pass@k table (Qwen2.5-7B with GRPO on Omni-MATH and MATH500), run through the paper's diagnostic.", "key_results": ["No free lunch (Theorem 2): a free lunch is impossible exactly when there exist strictly positive prompt weights under which every strategy has equal weighted success. Exclusive specialization (some prompts only one strategy can solve) or dominant specialization (one strategy is much better than the rest on some prompts) guarantees this. Being merely the best strategy on some prompts is not enough: a 3\u00d73 counterexample still allows a +0.173 pass@1 gain with no prompt getting worse. Synthetic checks found no free lunch in 1000/1000 exclusive and 2000/2000 dominant instances.", "Crossing bound (Theorem 3): the number of times the base and RL pass@k curves can cross is at most the number of sign changes in the difference between the two distributions of per-prompt success. Configurations with exactly 1 to 6 crossings show the bound can be reached. If RL preserves the difficulty order of prompts there is at most one crossing, which recovers a concurrent single-crossover result. A crossover is forced only under an extra 'fine coverage' condition (the hardest prompts are solved only by below-average strategies): 400/400 synthetic instances crossed with it, 0/400 without it.", "Price frontier (Theorem 4): a linear program that maximizes pass@1 while keeping every prompt at or above a fraction \u03b3 of its base success traces the trade-off between pass@1 and pass@k. At \u03b3=1 there are no crossings but also zero pass@1 gain, so in this model removing the crossover costs the entire gain.", "Entropy side: the same tilt yields entropy collapse and an entropy-performance law b \u2212 R \u2248 a\u00b7exp(H/\u03ba), with \u03ba readable from a slope. Synthetic fitted slopes were within 2.6% of 1/\u03ba. On the one real case (Omni-MATH), the GRPO advantage over base is +0.149 at k=1 and \u22120.008 at k=256, a single crossing. On MATH500 there is no crossing up to k=256."], "implications": "If the model is a fair description, the pass@k reversal is a structural trade-off rather than a training artifact. In that case 'more RL' cannot widen the set of problems the model can solve at all, only shift where it trades pass@1 against pass@k. Diversity bonuses help only when the unmodified update was off the optimal frontier. The paper proposes reporting a 'price' (worst pass@k loss versus base) and a crossing count next to pass@1. It also offers one framework that links the debate over pass@k reversal with work on entropy collapse.", "practicality": {"readiness": "Near-term (1-2 years)", "score": 4, "explanation": "The diagnostic needs only per-prompt base and RL success rates or pass@k curves, so RLVR practitioners could compute crossing counts and the 'price' from existing evaluation logs today. The theorems themselves depend on assumptions that cannot easily be checked for real LLMs: a discrete set of strategies shared across prompts, specialization, and fine coverage. The per-prompt-floor linear program also assumes the strategy-success matrix Q is known, which it is not for real models."}, "limitations": "The results hold inside a stylized model (strategy simplex, a population-limit tilt, a known Q). The step from the tilt to GRPO is a proposition supported by numbers, not a proof. Real-data support is one hand-transcribed table at five values of k, which the author calls indicative. There are internal inconsistencies. The appendix assumes every strategy has positive success on every prompt, which conflicts with the exact zeros in exclusive specialization. The no-fine-coverage regime is reported as 0/400 crossovers in the main text but 15% in the appendix. The claim that GRPO+PBA moves toward the frontier is an interpretation, not a measurement.", "tags": ["RLVR theory", "pass@k", "GRPO", "entropy collapse", "LLM reasoning"]}, "error": null, "rank": 2}, {"id": "2610.39531", "title": "Conic-Lifting for Learning-rate-free Convex Optimization", "authors": "Julien Grand-Cl\u00e9ment, Joon Kwon, Francesco Orabona", "abstract": "A central topic in online and stochastic optimization is to design algorithms that do not require tuning of hyperparameters. Successful strategies in online learning include AdaGrad-style learning rates, Conic Blackwell algorithms, and parameter-free algorithms. However, these classes require different, often difficult, analyses. We develop a unifying family of Online Convex Optimization (OCO) algorithms that require no user-tuned learning rate on convex domains that may be unbounded. The construction lifts the domain to a cone by adding one scalar coordinate, an idea going back to Blackwell (1954). The lifted subgradients are orthogonal to the corresponding lifted decisions, leaving the comparator scale free to optimize in the regret analysis. Applying Follow-the-Regularized-Leader (FTRL) and Online Mirror Descent (OMD) on the cone recovers Conic Blackwell Algorithm (CBA) and Conic Blackwell Algorithm Plus (CBA$^+$) on bounded domains in Hilbert spaces and extends them to finite-dimensional normed spaces with a strongly convex squared norm. For arbitrary nonempty closed convex domains in these spaces, a known gradient bound yields parameter-free regret guarantees. Surprisingly, on an unconstrained Hilbert space, the construction recovers the Krichevsky--Trofimov (KT) coin-betting algorithm exactly. We also give a parameter-free algorithm for unconstrained domains that requires no gradient bound.", "categories": ["math.OC", "cs.LG", "stat.ML"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.39531", "pdf_url": "https://arxiv.org/pdf/2610.39531", "score": 62, "why_selected": "A unifying conic-lifting framework that recovers CBA and KT coin-betting as special cases, a strong theoretical contribution to parameter-free optimization.", "basis": "full text", "summary": {"tldr": "Adding one coordinate to the decision space (\"conic lifting\") gives one recipe for learning-rate-free online convex optimization. It recovers CBA/CBA+ and KT coin-betting and extends them to new settings.", "goal": "Online and stochastic optimizers usually need a tuned step size. Several families avoid tuning: AdaGrad-style steps, Conic Blackwell Algorithms (CBA/CBA+), and parameter-free coin-betting. Each comes with its own specialized analysis. The paper wants one design principle that yields learning-rate-free algorithms for bounded, unbounded, constrained and non-Euclidean settings.", "approach": "Each decision x is mapped to (x, 1), and the algorithm works on the cone of all positive multiples of these lifted points, an idea going back to Blackwell (1954). Each gradient g is lifted to (g, \u2212\u27e8g, x\u27e9), which is orthogonal to the lifted decision. As a result, the original regret equals the regret on the cone against any rescaled comparator, so the analysis can optimize that scale for free, mimicking oracle step-size tuning. Standard FTRL or OMD is then run on the cone with one of three regularizers: a fixed quadratic for bounded domains; a time-growing quadratic plus a log barrier on the extra coordinate for unbounded closed convex domains with a known gradient bound G; and an adaptive regularizer with a perspective term and a shrinking norm constraint when no gradient bound is known. The work is purely theoretical (proofs plus procedures for computing the updates), with no experiments.", "key_results": ["Bounded Hilbert-space domains: CBA (FTRL on the cone) has regret \u2264 \u221a2\u00b7R\u00b7\u221a(\u03a3\u2016g_t\u2016\u00b2) and needs neither a horizon nor a gradient bound. This beats AdaGrad-Norm's 2\u221a2 constant, and a lower bound shows \u221a2 is the best constant possible for a bound of this form.", "CBA and CBA+ extend to finite-dimensional norms whose square is \u03bc-strongly convex (e.g., \u2113p with 1<p<2), with regret \u2264 R\u221a(2(1+1/\u03bc)\u03a3\u2016g_t\u2016\u00b2_*).", "For any closed convex domain, including unbounded ones, with known G: regret \u2264 \u03b5 + G\u2016u\u2212a\u2016\u221a(\u03b2(T+1)\u00b7log(\u2026)), where a is a chosen anchor point and \u03b5 is an allowed regret budget at that anchor. The paper calls this parameter-free. In the unconstrained Hilbert case (with \u03b2=1) the update is exactly KT coin-betting. In Hilbert space each update needs one projection onto the domain per step of a scalar bisection.", "Unconstrained, with no gradient bound: regret \u2248 \u03b5 + \u03b4_T/(2\u03bc\u03b3) + \u03b3\u2016u\u2016\u00b2/2 + \u2016u\u2016\u00b7\u221a(a_{T+1}\u00b7log term). Here a_{T+1} grows with the sum of squared gradient norms plus the squared largest gradient seen, \u03b3>0 is a user-set trade-off, and \u03b4_T sums squared increases in the largest gradient norm seen, so gradual growth costs less than a single jump."], "implications": "CBA/CBA+, regret matching and KT coin-betting become instances of a single \"FTRL/OMD on a lifted cone\" template, which makes analyses simpler and makes new variants easier to derive. The template handles non-Euclidean norms and constraints directly, without black-box reductions. Through the standard online-to-batch conversion, the regret bounds also give tuning-free stochastic and offline convex optimization.", "practicality": {"readiness": "Near-term (1-2 years)", "score": 4, "explanation": "Researchers in online learning, game solving and convex stochastic optimization could adopt these algorithms. The bounded-domain and KT cases are simple to implement. The constrained variants need projections onto the domain (plus bisection), and non-Hilbert norms need a maximization over the unit ball. There are no experiments, the guarantees cover convex problems only, and the methods still require inputs: a domain radius R, a gradient bound G, or the constants \u03b5 and \u03b3."}, "limitations": "The paper has no empirical evaluation. The known-G bound scales with G\u00b2T rather than the observed gradients, and the unknown-G bound carries a quadratic trade-off between gradient scale and comparator norm. An OMD version of the unbounded-domain algorithm is left as future work.", "tags": ["online convex optimization", "parameter-free learning", "conic Blackwell algorithm", "coin-betting", "FTRL"]}, "error": null, "rank": 3}, {"id": "2610.39558", "title": "TabCUQ: Context-Uncertainty Quantification for Tabular Foundation Models", "authors": "Yuebei Shi, Molei Liu, Zijian Guo", "abstract": "Tabular foundation models use in-context learning to estimate conditional expected outcomes and average treatment effects for specific groups of individuals. Using these estimates to guide scientific decisions requires reliable uncertainty quantification. The challenge is to account simultaneously for two sources of uncertainty: limited-context bias and context variation arising from the small labeled sample supplied at inference. Predictive spread does not directly quantify both sources of uncertainty, and we observe that the ordinary bootstrap may substantially overestimate context variation, whereas subsampling may underestimate it. We introduce TabCUQ, a perturbation-based framework that injects noise into observed outcomes and applies the foundation model to the perturbed contexts. TabCUQ estimates context variation using wild-bootstrap dispersion and accounts for limited-context bias using the maximum deviation between perturbed and original estimates. For a kernel-regression analogue whose estimation error admits an exact decomposition into these two components, we show that our framework provides asymptotically valid pointwise coverage. In simulations, TabCUQ substantially improves coverage, with average interval widths typically about twice those of an oracle bias-aware benchmark. Across seven real-world tasks, it also improves coverage of reference functions learned from much larger samples.", "categories": ["stat.ML", "cs.LG"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.39558", "pdf_url": "https://arxiv.org/pdf/2610.39558", "score": 58, "why_selected": "Addresses a timely problem, uncertainty quantification for tabular foundation models, with a principled perturbation method and coverage results.", "basis": "full text", "summary": {"tldr": "TabCUQ builds confidence intervals for conditional means and treatment effects estimated by tabular foundation models. It perturbs the context outcomes with a wild bootstrap and widens the interval by a bias cushion, which lifts coverage to about 95% at roughly twice the oracle width.", "goal": "Tabular foundation models such as TabPFN, TabICL and TabFM estimate conditional means and CATEs (conditional average treatment effects) from a small labeled \"context\" without retraining. Scientific decisions need confidence intervals for these quantities over repeated contexts. Those intervals have to account for two things: context variation (sampling noise) and limited-context bias (a systematic gap from the truth when the context is small). The model's predictive spread doesn't measure either one directly. The authors also find that the ordinary bootstrap overstates context variation for TabPFN (variance ratio about 1.64) and that subsampling understates it (about 0.45).", "approach": "TabCUQ leaves the features fixed and builds perturbed contexts from out-of-fold predictions (5-fold cross-fitting). Each perturbed outcome is the out-of-fold prediction plus the centered residual multiplied by a random \u00b11 sign (a Rademacher wild bootstrap). The pretrained model is re-run on B such contexts. The standard deviation of the resulting estimates gives the standard error. The largest absolute gap between any perturbed estimate and the original estimate serves as a \"bias cushion.\" The interval is the original estimate \u00b1 (z\u00b7SE + cushion). CATEs use the same procedure applied separately to each treatment arm with a T-learner. The theory covers only a Nadaraya\u2013Watson kernel-regression analogue, not the foundation models themselves. Evaluation used simulations with TabPFN 2.6, TabPFN 3 and TabFM, plus seven real tasks: Census, tree cover, Job Corps, Jester, two protein-stability tasks and CITE-seq. On real data, coverage was measured against reference functions fitted on much larger samples.", "key_results": ["In univariate simulations at edge queries (|x|\u22652), coverage of nominal 95% intervals rose from 0.677\u20130.945 (wild bootstrap only) to 0.970\u20131.000 (TabCUQ). In multivariate tail queries it rose from 0.523\u20130.851 to 0.928\u20130.998. Across nine CATE designs it rose from 0.729\u20130.968 to 0.968\u20131.000.", "TabCUQ intervals were typically 1.6\u20132.7 times as wide as an oracle bias-aware benchmark that is given the true bias and variance.", "On seven real tasks with a 1,000-observation context, reference coverage rose from 0.614\u20130.842 to 0.966\u20131.000, with width ratios of 1.62\u20132.27 relative to the oracle. Wild-bootstrap undercoverage did not go away as the context grew.", "In the kernel-regression analogue, the cushion bounds the bias with high probability, and the interval achieves asymptotically valid pointwise coverage with near-optimal width up to a \u221alog B factor."], "implications": "For TabPFN-style models, point predictions and spread-based uncertainty can badly undercover conditional means and CATEs, because limited-context bias is often not negligible. A simple model-agnostic perturbation wrapper can restore nominal coverage at roughly 2\u00d7 the oracle width. This brings frequentist bias-aware inference to in-context learners, alongside existing posterior and conformal approaches.", "practicality": {"readiness": "Usable now", "score": 7, "explanation": "Anyone using TabPFN, TabFM or similar models for conditional-mean or CATE decisions can implement this as a black-box wrapper, since it needs only repeated forward passes. Each query costs about B + 5 model calls (B = 100\u2013300 in the experiments), so it can get expensive. The intervals are fairly wide, and the cushion widens as B grows, which makes B a tuning choice rather than just a precision setting. The theoretical guarantee does not extend to the foundation models themselves."}, "limitations": "The coverage theory holds only for a kernel-regression analogue. Real-data coverage is measured against learned reference functions, not true conditional means. Coverage at individual queries can still fall short: under weak overlap at x=3 it was 0.89, and about 10% of CITE-seq queries were below 0.90. Because the cushion grows with the number of perturbations, interval width depends on an arbitrary choice of B. Only the T-learner was studied for CATEs.", "tags": ["uncertainty quantification", "tabular foundation models", "wild bootstrap", "causal inference / CATE", "in-context learning"]}, "error": null, "rank": 4}, {"id": "2610.39855", "title": "Probabilistic Meshless Methods on Manifolds", "authors": "Federico Pavesi, No\u00e9mie Jaquier, Antonio Candelieri", "abstract": "Probabilistic meshless methods solve partial differential equations (PDEs) by placing a Gaussian process prior on the solution and conditioning it on the PDE at a finite set of collocation nodes. The posterior provides both an approximation of the solution and a Bayesian quantification of its error. While these methods are well established on Euclidean domains, their extension to manifolds lacks, to our knowledge, any convergence analysis. We extend them to compact manifolds and study their convergence in two settings. First, for known manifolds whose Laplace-Beltrami eigenpairs are available, the prior can be evaluated exactly, but the PDE operator generally cannot be applied to it in closed form. We replace this operator by a standard generalized finite difference discretization on a point cloud sampled from the manifold, and show that the resulting method is consistent at the points of the cloud, at a rate governed by their fill distance. Second, for implicit manifolds, known only through a point cloud, both the prior and the operator must be approximated. We propose a new generalized finite difference scheme with a free stencil radius, and show that it retains the consistency of the standard construction while controlling the growth of its coefficients, and that an appropriate radius yields uniform convergence of the discrete Gram matrix. In both settings, we derive error bounds for the posterior mean which separate the collocation error intrinsic to the method from the error due to approximating the operator and, for implicit manifolds, the prior. Experiments on the circle, the sphere and the flat torus confirm our theoretical claims. On real-world cortical thickness data, our approach attains the accuracy of established discretizations, while conditioning on fewer than a tenth of the observations and providing a credible interval at every vertex.", "categories": ["stat.ML", "cs.LG"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.39855", "pdf_url": "https://arxiv.org/pdf/2610.39855", "score": 55, "why_selected": "First convergence analysis for probabilistic meshless PDE solvers on manifolds, backed by theory and a real cortical-data demo.", "basis": "full text", "summary": {"tldr": "The paper extends Gaussian-process PDE solvers (probabilistic meshless methods) to compact manifolds and proves convergence. It adds a new finite-difference stencil that stays stable when the manifold is known only from a point cloud.", "goal": "Probabilistic meshless methods (PMMs) solve a linear PDE by putting a Gaussian process prior on the solution and conditioning it on the PDE at a set of collocation points. The result is an approximate solution plus a Bayesian error bar. These methods are well developed on Euclidean domains. On manifolds such as spheres or brain surfaces there was, to the authors' knowledge, no convergence analysis. The paper aims to supply one, both for manifolds known in closed form and for manifolds known only through sampled points.", "approach": "For known manifolds, the prior is built exactly from Laplace\u2013Beltrami eigenpairs, using an integral-type Mat\u00e9rn kernel. The differential operator is replaced by a standard generalized finite difference (GFDM) matrix L_h built on a point cloud. For implicit manifolds, the kernel comes from graph-Laplacian eigenpairs (a graph Mat\u00e9rn kernel). The operator uses a new GFDM matrix L_\u03f1 whose stencil radius \u03f1_N is a free parameter, chosen from a net inside a geodesic ball. This keeps the growth of the stencil coefficients under control. The authors prove: consistency at the nodes for the known case; uniform convergence of the discrete Gram matrix for the implicit case, with an optimal radius; and a posterior-mean error bound that separates the intrinsic collocation error from the error introduced by approximating the operator and kernel. Tests use manufactured advection\u2013diffusion\u2013reaction problems on the circle, sphere and flat torus, plus cortical-thickness smoothing on the fsaverage5 brain surface (10,242 vertices), posed as a single backward-Euler heat step.", "key_results": ["Theory: with the graph kernel and the standard stencil, the kernel error \u03b7_N gets amplified by a factor h_N^{-2l}, so the Gram matrix can diverge. With L_\u03f1, the Gram error is bounded by C(\u03f1^{p+1-l} + \u03b7_N \u03f1^{-2l}); at the optimal radius this gives the rate \u03b7_N^{(p+1-l)/(p+1+l)}.", "Circle, N from 500 to 32,000: with the graph kernel, L_h's solution error stays above 10^-1 and its relative Gram error grows to about 4.3. L_\u03f1's solution error falls steadily to 3.75\u00d710^-4 (p=2) and 2.96\u00d710^-4 (p=3).", "Sphere and torus at N=10^4: the exact-operator PMM reaches about 10^-8 relative L2 error. With the graph kernel, L_h reaches about 3\u20135\u00d710^-2 with roughly calibrated coverage (69%/91% on the sphere at the 68%/95% levels; 80%/95% on the torus). L_\u03f1 fails here (about 0.2\u20130.37 error, coverage of 5\u201311%) because the cloud is too small for an admissible radius. With the exact kernel and L_h, credible intervals were overconfident (39\u201351% coverage at the 68% level).", "Cortical thickness: the PMM conditions on 799 vertices (7.8%) and gets relative L2 error of about 3.4\u20133.8\u00d710^-2. It beats iterated kernel smoothing (5.4\u00d710^-2 to 1.27\u00d710^-1) at every smoothing time, and is within about 1.1\u20131.6\u00d7 of finite-element diffusion (2.2\u20133.0\u00d710^-2). Coverage is near nominal at t=0.002 (64.5%/91%) but drops to 27%/51% at t=0.05."], "implications": "The paper gives PDE solvers on manifolds a theoretical footing for Bayesian uncertainty quantification that needs no mesh, which is relevant to surface PDEs and to geometric data on point clouds. The main conceptual point is that when both the kernel and the operator are estimated from data, stencil-norm amplification becomes the bottleneck. Deliberately slowing the operator's consistency, by using a larger radius, can restore convergence.", "practicality": {"readiness": "Near-term (1-2 years)", "score": 5, "explanation": "Researchers in probabilistic numerics and neuroimaging could use the known-manifold variant, or the implicit variant with L_h, now at moderate scale, for example to smooth surface data with per-vertex credible intervals. The new L_\u03f1 stencil only pays off at large N (on the order of 10^4 or more for p=2 on the sphere), and that regime is expensive for both the graph Laplacian and the stencils. Its radius depends on geometric quantities (reach, fill distance) that must be estimated. Credible intervals were often miscalibrated in the experiments."}, "limitations": "In the implicit case, convergence is shown only at the nodes, the posterior is a vector over the point cloud rather than a Gaussian process on the manifold, and the analysis is limited to closed manifolds. In practice the admissible stencil radius was empty on the sphere, torus and cortex, so in those experiments L_\u03f1 either fell back to heuristics or performed poorly. Its advantage is shown only on the circle.", "tags": ["probabilistic numerics", "Gaussian processes", "PDEs on manifolds", "generalized finite differences", "graph Laplacian"]}, "error": null, "rank": 5}, {"id": "2610.39709", "title": "Bayes-Consistent Losses for Adaptive Inference in Classification", "authors": "Shirley Xiaoqi Liu, Florence Regol, Antonios Valkanas, Patrick Rebeschini, Mark Coates", "abstract": "Adaptive inference systems balance accuracy and inference cost by routing inputs to models with varying capabilities. Although jointly training models and routers is empirically more sample-efficient than training them separately, principled losses for joint training remain underexplored. We address this gap in a classification setting by proposing cost-sensitive hinge losses for jointly training classifiers with single-stage or cascade routers. Single-stage routers directly select a model per input, whereas cascade routers sequentially decide at each stage whether to predict with the current model or defer to the next stage, which uses a more accurate but more costly model. For both settings, we prove linear calibration bounds establishing Bayes consistency: minimizing the hinge risk recovers the Bayes-optimal risk under the target cost-sensitive zero-one loss. Moreover, since routers can require more labeled data to train than classifiers, we propose a novel post-training prediction-powered inference (PPI) procedure that uses unlabeled data to refine a trained single-stage router. Experiments on synthetic and real datasets demonstrate that the proposed hinge losses are effective for joint training and that PPI can correct routing errors when labeled data is scarce.", "categories": ["stat.ML", "cs.LG"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.39709", "pdf_url": "https://arxiv.org/pdf/2610.39709", "score": 55, "why_selected": "Proves Bayes-consistent hinge losses for jointly training classifiers and routers, plus a PPI refinement step; relevant to cost-aware inference.", "basis": "truncated full text", "summary": {"tldr": "The paper gives provably consistent hinge losses for training several classifiers together with a flat or cascade router under a cost penalty, plus a step that uses unlabeled data to fix routing mistakes.", "goal": "Adaptive inference systems send each input to one of several models of different cost and accuracy, as in LLM routers, cascades and early-exit networks. Training the classifiers and the router together tends to work better in practice than training them separately, but for more than two models there were no joint-training losses with a guarantee that they reach the best possible tradeoff between errors and cost. The paper fills that gap for classification with any number T of classifiers.", "approach": "The target loss is the 0-1 error plus the cost of the chosen model (the \"0-1-c loss\"). The authors propose cost-sensitive multiclass hinge surrogates, where each classifier's hinge loss is weighted by the router's probability of choosing it. They cover two settings: a flat router that picks one model from the input alone, and a cascade router that decides at each stage whether to stop or pass the input to a bigger model. They prove linear calibration bounds for both, using dynamic programming and backward induction for the cascade. Separately, they add a post-training step for the flat router based on prediction-powered inference (PPI). It uses the largest model's predictions on unlabeled data, binned by K-means, to build confidence intervals and changes a routing decision only when the improvement is certified. Experiments use a 1-D synthetic task with T=3 and K=3, plus LLM routing on CommonsenseQA and GSM8K (converted to 4-way multiple choice). In the LLM experiments the classifiers are small MLPs on sentence embeddings of the prompt and of answers from LLaMA 3 (1B/70B/405B) or Qwen 2.5 (1.5B/32B/72B).", "key_results": ["Bayes consistency with linear bounds: excess target risk is at most T(K-1) times the excess hinge risk for flat routers, and at most 2^(T-1)(K-1) times for cascades. The cascade bound needs a conditional-independence assumption, and a matching lower bound shows its constant cannot be improved. The constant gets smaller when the router's stop-or-defer probabilities stay away from 0.5.", "On synthetic data, the learned routing regions closely match the Bayes-optimal ones, and test risk reaches the Bayes-optimal risk under several cost settings.", "With n=1000 labeled training samples and 20,000 unlabeled samples, the PPI correction fixed 10.65% of routing decisions that disagreed with the oracle router and introduced 1.45% new errors.", "Cascade on CommonsenseQA with Qwen models: test risk was 0.197 with the hinge loss, versus 0.220 for joint training with cross-entropy, 0.228 for TREACLE and 0.255 for FrugalGPT, at similar average cost. The gap to the best baseline was significant at p<0.05 over 10 trials. Risk also fell as T grew from 1 to 5, with diminishing returns after 3."], "implications": "The work gives joint training of multi-model routers and cascades a theoretical footing for more than two models, extending earlier two-classifier and learning-to-defer results. The choice of hinge loss is deliberate: it gives the strongest (linear) guarantee, whereas smooth losses generally give only a square-root rate. Using PPI with unlabeled data is a new and cheap way to fix routers, which tend to need more labels than the classifiers.", "practicality": {"readiness": "Near-term (1-2 years)", "score": 5, "explanation": "Code is public, and practitioners building LLM routers or cascades over frozen models could use the loss to train lightweight heads on embeddings. Several things limit this. The framework covers classification with costs fixed in advance, so it does not fit free-form generation where output length varies. Full joint training can be memory-hungry, and hinge losses can be harder to optimize than cross-entropy. The empirical evidence is limited to a few multiple-choice benchmarks with small trained heads."}, "limitations": "The cascade guarantee assumes conditional independence, and the analysis assumes the features coming from each model stay fixed, so the backbones cannot be fine-tuned during training. The PPI guarantees hold per bin and only for flat routers; they move the router toward the oracle for the trained classifiers, which need not be the Bayes-optimal router. The real-data baseline comparisons cover a single dataset and cost configuration.", "tags": ["adaptive inference", "surrogate loss consistency", "LLM routing and cascades", "learning to defer", "prediction-powered inference"]}, "error": null, "rank": 6}, {"id": "2610.39674", "title": "Formalizing the Intrinsic Dimension of Objective Landscapes by a Generalized Notion of Co-dimension", "authors": "Ernesto Araya, Gitta Kutyniok, Weilin Li, Johannes Maly, Manjot Singh", "abstract": "In this work, we formalize the concept of intrinsic dimension of objective landscapes introduced in Li et al. (2018), which measures the structural complexity of learning problems by training along randomly generated subspaces. We define the intrinsic dimension of a set $\u0398\\subset\\mathbb{R}^p$ as the minimal dimension $d_{\\mathrm{int}}(\u0398)$ such that a random plane of dimension $d_{\\mathrm{int}}(\u0398)$ in $\\mathbb{R}^p$ intersects $\u0398$ with probability one. We show that it is a generalized notion of co-dimension that depends on the global geometry of $\u0398$. We study mathematical properties of the intrinsic dimension and develop techniques to estimate the intrinsic dimension of sets $\u0398$ that arise in learning problems. More specifically, we derive upper and/or lower bounds where $\u0398$ is the set of optimal parameters in student-teacher settings with shallow and deep ReLU networks, including finite and infinite sample cases, and with and without regularization. We discuss how our theory leads to novel types of generalization bounds, thereby showing that the intrinsic dimension is a measure of learning complexity. Our results connect techniques from seemingly different areas of machine learning research such as classification of symmetries of ReLU networks and stochastic geometry.", "categories": ["stat.ML", "cs.LG", "math.MG"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.39674", "pdf_url": "https://arxiv.org/pdf/2610.39674", "score": 52, "why_selected": "Gives a rigorous formalization of intrinsic dimension with bounds for ReLU networks; theoretically interesting but practical impact is limited.", "basis": "full text", "summary": {"tldr": "The paper turns Li et al.'s empirical \"intrinsic dimension\" into a precise definition: the smallest d at which a random d-dimensional plane almost surely hits the solution set. It proves tight bounds for shallow ReLU student-teacher networks.", "goal": "Common complexity measures like VC dimension and Rademacher complexity describe a whole model class. They say nothing about how hard a particular target function is. Li et al. (2018) estimated problem-specific complexity by training inside random low-dimensional subspaces, but the idea had no mathematical footing. This paper gives it a rigorous definition and develops tools to bound it.", "approach": "The authors define d_int(\u0398) as the smallest d such that a random d-dimensional affine plane meets the solution set \u0398 with probability one. The plane's direction is drawn uniformly and its offset is Gaussian. They show this behaves like a generalized co-dimension: it is exact for affine sets, monotone, affine-invariant, and equal to the full dimension p for any bounded set. A general sandwich theorem gives an upper bound from affine-linear sets inside \u0398 and a lower bound from rectifiable sets containing \u0398. They apply it by fully characterizing the zero-loss sets of shallow ReLU networks, which requires classifying network symmetries and how neurons can cancel each other. They then extend the analysis to regularized training, finite samples (using hyperplane tessellation, statistical dimension and Gordon's escape theorem), deep ReLU networks and deep linear networks, and run small experiments that train networks inside random subspaces.", "key_results": ["Shallow ReLU student (M neurons, input dimension D) learning an R-neuron teacher with infinitely many samples: R(D\u22122)+M \u2264 d_int \u2264 R(D+1)+M (the lower bound needs D\u22655). This depends on the teacher's complexity, whereas the student's VC dimension is ~MD log(MD) whatever the teacher.", "Regularization changes the answer. Keeping only minimum-\u21132 or minimum-\u21131 solutions makes the solution set bounded, so d_int jumps to the full parameter count M(D+2). Path-norm regularization is invariant to rescaling neurons and keeps the unregularized bounds.", "Finite samples, in a simplified setting (one teacher neuron, no biases, non-negative output weights): d_int \u2264 M+D almost surely, and d_int \u2265 M+(1\u2212\u03c1)D \u2212 O(\u221a(MD)) \u2212 lower-order terms with probability at least 1\u22122exp(\u2212c\u03b4\u00b2n/D).", "Deep networks: deep ReLU gets only an upper bound, because no full description of its symmetries exists. Deep linear networks get D \u2264 d_int \u2264 \u03a3M_\u2113 + D, and the authors prove their method cannot close this gap. In experiments with D=20 and width 30, the measured value was about 20\u201321 at depths 1\u20133, which suggests the lower bound is the right one. In shallow ReLU experiments the measured estimate fell inside the theoretical range when D \u2264 20 but went above the upper bound at D=30 and 50; the authors attribute this to optimization difficulty."], "implications": "The paper ties intrinsic dimension to symmetries in parameter space and to stochastic geometry, making it a measure of a learning problem rather than of an architecture alone. Combined with a covering-number argument, it gives generalization bounds for training in random subspaces that scale with d_int instead of the parameter count and depend only logarithmically on the norm. The authors also propose d_int as an a priori benchmark for how far a network can be compressed. In their experiments, magnitude pruning with fine-tuning did only somewhat better than d_int predicts.", "practicality": {"readiness": "Theoretical", "score": 2, "explanation": "This is mainly a theory contribution for learning theorists. The tight bounds cover only idealized shallow student-teacher settings, and the finite-sample result needs strong simplifications. Computing d_int for real networks would require characterizing the solution set, which is out of reach for deep ReLU networks. The experiments also show that gradient-based estimates can drift away from the theoretical values."}, "limitations": "Because the definition requires intersection with probability one, every bounded solution set gets d_int equal to the full parameter count, so the measure cannot tell bounded solution sets apart. The deep ReLU case has no lower bound and the deep linear bounds don't match. The experiments are small (single settings, few seeds), and the empirical estimates depend on the optimizer and the loss tolerance.", "tags": ["intrinsic dimension", "learning theory", "ReLU network symmetries", "stochastic geometry", "generalization bounds"]}, "error": null, "rank": 7}, {"id": "2610.39409", "title": "Safe Multi-Objective Reinforcement Learning: Zero Constraint Violation and Primal-Averaging Convergence", "authors": "Chenxi Li, Yao Shu, Siyang Gao, Shuang Qiu, Guangxin Jiang", "abstract": "Many applications of multi-objective reinforcement learning (MORL) require policies that balance conflicting objectives while satisfying safety constraints. We study safe MORL with zero constraint violation throughout learning, covering both cumulative and stepwise constraints. A key challenge is to explore sufficiently under unknown dynamics and constraint costs without violating the constraints. For a given preference over objectives, we develop an algorithm to learn a safe Pareto optimal policy by combining optimistic reward estimates with pessimistic cost bounds. With high probability, every policy executed over $T$ episodes incurs zero constraint violation. The algorithm returns a safe Markov policy induced by the averaged occupancy measure and achieves an $\\widetilde{O}(1/\\sqrt{T})$ suboptimality gap under smooth Tchebycheff scalarization. We further develop a preference-free algorithm that first explores safely without a prespecified preference and then computes a safe policy for any given preference without further interaction. Over $T$ exploration episodes and $K$ planning iterations, it retains the same safety guarantee and achieves an $\\widetilde{O}(1/\\sqrt{T}+1/\\sqrt{K})$ suboptimality gap. Both algorithms require knowledge of a policy that strictly satisfies the constraints and its costs. We then relax these requirements, incurring at most constant cumulative violation. To our knowledge, we provide the first sample-efficient MORL algorithms that guarantee safety for every executed policy.", "categories": ["cs.LG", "cs.AI", "math.OC", "stat.ML"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.39409", "pdf_url": "https://arxiv.org/pdf/2610.39409", "score": 52, "why_selected": "Claims the first safe multi-objective RL algorithms with zero constraint violation for every executed policy, with solid guarantees.", "basis": "full text", "summary": {"tldr": "The paper gives provable safe multi-objective RL algorithms for tabular episodic MDPs. With high probability, every executed policy meets its constraints, and the suboptimality gap shrinks at \u00d5(1/\u221aT). Theory only, with no experiments.", "goal": "In multi-objective RL, the agent has to trade off competing rewards while respecting safety constraints. Here the constraints are either cumulative (expected total cost per episode) or stepwise (cost at a given step). Earlier constrained-MORL methods only bound how much the constraints are violated, on average or over time. The paper asks whether an agent can learn safe Pareto-optimal policies, sample-efficiently, while never running an unsafe policy during learning.", "approach": "The setting is a finite-horizon, tabular constrained MDP with unknown transitions, rewards and costs, and the paper's analysis assumes a known strictly safe fallback policy. The preference over objectives is turned into a single objective with a \"smooth Tchebycheff\" scalarization defined over the safe policy class; the authors prove this recovers the entire safe Pareto front. CSTRL (preference-based) runs mirror-ascent updates on occupancy measures (the state-action visitation distributions), using optimistic reward estimates. Each update is projected by minimizing KL divergence under pessimistic cost bounds. At each episode the agent randomly runs either the projected policy or the safe fallback, with the fallback probability set so the mixture is provably safe; auxiliary runs estimate each objective's safe optimum, and the output is the single Markov policy induced by averaging the occupancy measures of all executed policies. PF-CSTRL (preference-free) first explores safely using uncertainty bonuses as the reward, then plans offline for any preference given later. Two extensions relax the assumptions: one estimates the fallback policy's costs, and the other learns the fallback policy itself through a primal-dual estimation phase.", "key_results": ["CSTRL: with high probability, every executed policy has zero constraint violation, under both stepwise and cumulative constraints. The output Markov policy has suboptimality \u00d5(H\u00b2|S|^{3/2}|A|/\u221aT + \u03c6_safe\u00b7H\u00b3|S|^{3/2}|A|/\u221aT + H\u00b2/(\u03bc\u221aT) + \u03bc/\u221aT), where \u03c6_safe = max_j d\u00b2/(\u03c4_j\u2212\u03b3_j)\u00b2 grows as the safe fallback policy's slack under the constraint thresholds shrinks.", "PF-CSTRL: one safe exploration phase of T episodes, followed by K offline planning iterations for any preference, achieves \u00d5(1/\u221aT + 1/\u221aK) suboptimality, with zero violation in both stages.", "If the safe policy is known but its costs are unknown, a short estimation phase (about d\u00b2/\u03f1\u2020\u00b2 episodes, where \u03f1\u2020 is the fallback policy's smallest constraint slack) keeps violation at zero. If the safe policy is also unknown, total violation over all episodes is bounded by a constant (d\u00b7t_s) that does not grow with T.", "Structural results: the safe value set is a convex polytope, and the safe smooth Tchebycheff scalarization recovers every safe Pareto-optimal policy as the preference ranges over the open simplex."], "implications": "To the authors' knowledge, these are the first sample-efficient MORL guarantees with zero violation for every policy executed during learning. Prior work only bounded expected or sublinear violation. Outputting a single Markov policy from averaged occupancy measures, rather than a random mixture of policies (as in Qiu et al. 2024), is also a usable improvement. Separating safe exploration from planning makes it possible to collect data once and later serve any preference.", "practicality": {"readiness": "Theoretical", "score": 2, "explanation": "The results are of interest to safe-RL theorists, and possibly a template for designing algorithms in small tabular safety-critical problems. Several things stand in the way of practical use. There are no experiments. Every episode requires solving a KL projection over occupancy measures with transition uncertainty sets. The bounds scale polynomially in |S|, |A| and H, and blow up when the safe fallback policy has little slack. The algorithms also require a known strictly safe policy, or else accept a phase of unsafe exploration."}, "limitations": "The paper has no empirical evaluation, and the results are limited to finite tabular MDPs with stochastic Markov policies; the authors leave deterministic policies to future work. Safety holds in expectation and with high probability (1\u2212\u03b4), not on every individual trajectory. CSTRL runs m+1 rollouts per episode, which adds sample cost, and the bounds depend on \u03c6_safe, which can be large.", "tags": ["safe reinforcement learning", "multi-objective RL", "constrained MDPs", "Pareto optimality", "learning theory"]}, "error": null, "rank": 8}, {"id": "2610.38753", "title": "Metropolized backward sampling for conditional sequential Monte Carlo", "authors": "Adrien Corenflos", "abstract": "Particle Gibbs samplers with backward sampling are widely used for sampling the smoothing distribution of state-space models, but, with few particles, the new trajectory often coincides with the current one at many time steps. A known but rarely used remedy replaces the random selection of the final particle by a Metropolis--Hastings move which avoids the current particle. We show that, with backward sampling, this remedy only helps at the last time steps, because its effect on the update rates decays geometrically with the distance to the final time. We propose instead Metropolized backward sampling, which makes such a move at every step of the backward pass, forcibly switching trajectories whenever possible. Additionally, we introduce a coupled version which prevents proposing the current trajectory, maximizing the chances of an actual switch versus the current trajectory and performing perfect sampling when the state-space model has no observations, a feature not shared by backward sampling. We prove that, at every time step, both methods dominate backward sampling as they update the state more often and have smaller lag-one autocorrelations than it does. Our methods are drop-in replacements for backward sampling, and can be used to improve any particle Gibbs sampler.", "categories": ["stat.CO", "eess.SP", "math.PR", "stat.ME", "stat.ML"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.38753", "pdf_url": "https://arxiv.org/pdf/2610.38753", "score": 52, "why_selected": "A drop-in improvement to backward sampling in particle Gibbs with provable dominance; practically useful.", "basis": "full text", "summary": {"tldr": "The paper replaces each backward-sampling draw in particle Gibbs with a Metropolized Gibbs \"forced move\" away from the current trajectory. With 2 particles, states get updated 35\u201364% more often, at the same or at most twice the cost.", "goal": "Particle Gibbs with backward sampling (BS) is a standard way to sample the smoothing distribution of state-space models, meaning the distribution of the hidden path given all the observations. With few particles, the new trajectory often matches the current one at many time steps, so the chain mixes slowly. An earlier fix, the \"forced move\", applies Liu's Metropolized Gibbs step only to the final particle index. The paper shows this fix barely helps and proposes one that works at every time step.", "approach": "The author first proves that the gain from a final-time forced move (FM-BS) decays geometrically with distance from the final time T, with a bound given by a product of Dobrushin contraction coefficients. Two drop-in replacements are proposed. M-BS applies a Metropolized Gibbs move at every step of the backward pass, starting from the ancestor index. CM-BS also uses an \"anti-coupling\" kernel that steers away from the reference trajectory's index even after the two trajectories have diverged. Validity (reversibility) and the efficiency orderings are proved for a general family of backward kernels, extended to other resampling schemes and to previous-state potentials via ancestor sampling, and formalized in Lean. Experiments use 10^6 simulated datasets on a linear-Gaussian model (T=200) and the Gordon\u2013Salmond\u2013Smith nonlinear model (T=100), with N from 2 to 64, measuring one-iteration update rates and expected squared jump distance (ESJD) at each time step.", "key_results": ["Theory: at every time step, M-BS and CM-BS update the state at least as often as FM-BS, which in turn at least matches BS. Both also have lower or equal lag-one autocovariance for any square-integrable function of a single state. In models that factorize across time with equal weights, CM-BS always changes the state, while BS keeps it with probability 1/N.", "The final-time forced move (FM-BS) raises update rates by 2\u201372% at time T, but by less than 1% on average across time steps, as the decay result predicts.", "With N=2, M-BS raises average update rates by 35\u201345% and ESJD by 26\u201333% over BS. CM-BS raises update rates by 43\u201364% and ESJD by 37\u201346%. With N=8, the gains are 4\u201313% for M-BS and 23\u201335% for CM-BS in update rates.", "The gains hold with stratified resampling and with the locally optimal proposal: CM-BS updates states 49\u201366% more often than BS with N=2 under the locally optimal proposal (multinomial resampling plus ancestor sampling). Gains shrink as N grows, because BS already moves often."], "implications": "M-BS makes Metropolized Gibbs moves a free upgrade to backward sampling in any particle Gibbs sampler, and it matters most when particles are few or expensive, for example in high-dimensional or local-proposal CSMC. The general backward-kernel framework, including the anti-coupling idea, may support further variants and can be combined with other improvements such as bridge backward sampling.", "practicality": {"readiness": "Usable now", "score": 8, "explanation": "Anyone running particle Gibbs or CSMC with backward sampling can swap in M-BS by changing a few lines, at no extra cost; code is public. CM-BS costs up to twice as much in the backward pass and needs ancestor sampling for non-multinomial resampling or previous-state potentials. It is worth that cost mainly when evaluating potentials dominates the run time. Benefits are modest once N is large."}, "limitations": "The dominance results cover functions of one or two consecutive states, not whole trajectories, so ordering of asymptotic variances and the comparison between M-BS and CM-BS remain open. The experiments measure single-iteration update rates and ESJD from stationarity on two synthetic toy models, not end-to-end effective sample size per unit of compute on real applications.", "tags": ["particle Gibbs", "backward sampling", "sequential Monte Carlo", "MCMC efficiency", "state-space models"]}, "error": null, "rank": 9}, {"id": "2610.39614", "title": "Emergence of the transformer architecture as the score of entropic laws of random measures", "authors": "Giacomo Greco", "abstract": "We show that the transformer architecture emerges as the score of last-token laws in a natural statistical model of language, where sentences are empirical measures of tokens, a language is a law on $P(S^d)$, and our prior belief is that sentences carry no structure at all. By the maximum-entropy principle, we select the law closest to this prior in relative entropy among those reproducing an observed sentence-level statistic. We discuss the relevance of the statistic in the posterior interaction between tokens and we build a statistic, able to capture that interaction, with Luce's choice axiom truncated at the lowest relational order. This procedure gives the softmax choice rule, with the attention cross-moment as its mean parameter. The query--key matrix is then the Lagrange multiplier of a maximum-entropy problem inside each sentence, and the value matrix the multiplier of the constraint over the language, so that the two are untied. Under the optimal entropic law we then show that a transformer head appears in the score of the last-token law. For ordered sentences, causal masking follows from the masked reference choice rule, and with a next-token cross-moment the score equals one causally masked attention head. We also discuss multi-head attention, weight-tied unembedding, and a heuristic reading of residual blocks as projected Langevin steps.", "categories": ["cs.AI", "math.PR", "stat.ML"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.39614", "pdf_url": "https://arxiv.org/pdf/2610.39614", "score": 50, "why_selected": "Derives attention from a maximum-entropy model, an elegant idea, but mostly interpretive.", "basis": "full text", "summary": {"tldr": "This theory paper shows that one causally masked softmax attention head comes out exactly as the score (gradient of the log-density) of the last-token law in a maximum-entropy model of sentences treated as random measures on the sphere.", "goal": "Most theory treats the attention mechanism as given and studies how tokens move under it. This paper asks where the transformer comes from: which probabilistic model of language has softmax self-attention as its natural inference rule, with separate (untied) query-key and value matrices? And which variational principle would train those matrices?", "approach": "Sentences are modeled as empirical measures of tokens on the unit sphere S^d, and a language is a probability law over such measures. The prior has no structure: a random length, with tokens drawn independently and uniformly. The language model is the law closest to this prior in KL divergence that matches an observed sentence-level statistic, which gives a Gibbs tilt. The author argues that statistics additive over token pairs (e.g. covariance) only pool the context, with no competition between keys. Instead, he builds a relational statistic from Luce's choice axiom, keeping only the lowest-order (bilinear) spherical-harmonic term. This gives softmax choice couplings with query-key matrix Lambda = Q^T K, and the statistic is their 'attention cross-moment'. A causal variant puts the mask into the uniform reference choice rule and pairs what each token reads with the token that follows it. All results are proved theorems; there are no experiments.", "key_results": ["Existence and uniqueness: for any nonzero Lambda, the attention cross-moment is non-degenerate as long as some sentence length of 3 or more has positive probability. The maximum-entropy model is then a Gibbs tilt exp(<V, S_Lambda>) of the prior, where the value matrix V is a unique Lagrange multiplier. Every V can be realized, so values are untied from query-key; tied values occur only on a measure-zero set of constraints.", "Unordered model: the score of the last token equals a standard attention head (query term), plus a key-side term and a correction term. The correction vanishes only if Lambda = 0 or V = 0.", "Causal model with a shifted (next-token) cross-moment: the last token follows exactly a von Mises-Fisher law whose mean direction is the output of one causally masked attention head at the last context position. Its score is that head, divided by (n-1) and projected onto the sphere's tangent space, with no extra terms.", "Extensions: multiple choice rules give multi-head attention (head outputs summed). For a finite vocabulary, the model yields an exact softmax unembedding tied to the embedding matrix. Constraining the attention free energy instead of the cross-moment forces values to be tied to keys (V proportional to Lambda), as in Hopfield-style derivations."], "implications": "The paper offers a first-principles statistical reading of the attention head. The query-key matrix is the inner Lagrange multiplier of a maximum-entropy choice problem within each sentence. The value matrix is the outer multiplier, set across the whole language. It also explains untied value matrices, causal masking and weight tying as consequences of the modeling choices. This links transformers to classical maximum-entropy language models and to Langevin sampling. One projected Langevin step looks like a residual attention update followed by normalization, with injected noise. Reading that noise as the role of the MLP is explicitly heuristic.", "practicality": {"readiness": "Theoretical", "score": 2, "explanation": "This is an interpretive framework for theorists working on transformer foundations and maximum-entropy modeling, not a new method or tool. It suggests a few concrete ideas, such as a fixed, tied unembedding with a trainable nonlinearity, and a minimax-entropy training criterion for Lambda. However, none of these is implemented or tested, and training Lambda is left as an open problem."}, "limitations": "The exact single-head result covers only the law of the final token given a known sentence length; intermediate tokens are not von Mises-Fisher distributed. It covers one layer only: depth, the MLP and training are not derived. The results also rest on modeling choices: the bilinear truncation of the choice function, a uniform prior, and a concentration that shrinks with sentence length unless an extensive statistic is used. There are no empirical checks.", "tags": ["transformers", "maximum entropy", "self-attention theory", "random measures", "Langevin sampling"]}, "error": null, "rank": 10}];
