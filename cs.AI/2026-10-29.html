<script>
// Shared rendering for the live app and exported/published digest pages.

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function readinessClass(r) {
  if (r.startsWith("Usable")) return "ready-now";
  if (r.startsWith("Near")) return "ready-near";
  return "ready-far";
}

function paperCard(p) {
  const s = p.summary;
  const head = `
    <div class="paper-head">
      <div class="rank">${p.rank}</div>
      <div>
        <h2><a href="${esc(p.abs_url)}" target="_blank" rel="noopener">${esc(p.title)}</a></h2>
        <div class="authors">${esc(p.authors)}</div>
        ${s ? `<div class="tldr">${esc(s.tldr)}</div>` : ""}
        <div class="chips">
          ${s ? `<span class="chip ${readinessClass(s.practicality.readiness)}">${esc(s.practicality.readiness)}</span>` : ""}
          ${(s?.tags || []).map((t) => `<span class="chip">${esc(t)}</span>`).join("")}
          ${p.basis !== "full text" ? `<span class="chip">Based on ${esc(p.basis)}</span>` : ""}
        </div>
      </div>
    </div>`;
  if (!s) {
    return `<article class="paper">${head}<p class="authors">The full breakdown couldn't be generated: ${esc(p.error)}</p>
      <p>${esc(p.abstract)}</p>${links(p)}</article>`;
  }
  const pct = Math.max(0, Math.min(10, s.practicality.score)) * 10;
  return `<article class="paper">${head}
    <div class="grid">
      <div class="section"><h3>Goal</h3><p>${esc(s.goal)}</p></div>
      <div class="section"><h3>How they did it</h3><p>${esc(s.approach)}</p></div>
      <div class="section"><h3>Key results</h3><ul>${s.key_results.map((r) => `<li>${esc(r)}</li>`).join("")}</ul></div>
      <div class="section"><h3>Implications</h3><p>${esc(s.implications)}</p></div>
      <div class="section"><h3>Real-world practicality · ${s.practicality.score}/10</h3>
        <div class="practical-bar"><div style="width:${pct}%"></div></div>
        <p>${esc(s.practicality.explanation)}</p></div>
      <div class="section"><h3>Limitations</h3><p>${esc(s.limitations)}</p></div>
    </div>
    <details><summary>Why it made the top 10</summary><p>${esc(p.why_selected)}</p></details>
    ${links(p)}
  </article>`;
}

function links(p) {
  return `<div class="links"><a href="${esc(p.abs_url)}" target="_blank" rel="noopener">Abstract</a>
    <a href="${esc(p.pdf_url)}" target="_blank" rel="noopener">PDF</a></div>`;
}

function fmtDate(iso) {
  return new Date(iso + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
}

const PAPERS = [{"id": "2610.36848", "title": "Evolving Agent Teams", "authors": "Shiyi Cao, Ziming Mao, Dacheng Li, Joseph E. Gonzalez, Ion Stoica", "abstract": "The rapid progress of software engineering agents drives interest in applying them to open-ended problems such as GPU kernel optimization. However, we find that existing coding agents converge to local optima on real-world, expert-written kernels (e.g., FlashInfer). We introduce Evolving Agent Teams, a multi-agent framework that escapes such local optima. It features (1) a central supervisor that diagnoses each local optimum and restructures a team of agents; and (2) a persistent file system that comprises a learning document, an evolution history, and per-team artifacts, grounding restructuring with accumulated experience. Under a matched token budget, Evolving Agent Teams consistently outperforms strong coding-agent baselines. With an extended token budget, Evolving Agent Teams generates a CUDA kernel that reaches 1.2x mean speedup over the production FlashInfer MLA paged decode kernel from scratch and wins on 36 of 47 production workloads from FlashInfer-Bench (0.86-0.99x on the remaining 11). It also demonstrates superior performance on tasks such as KDA prefill on AMD MI350X (3.01x over vLLM) and NVIDIA B200 (3.44x over FlashKDA), MoE expert-offload serving on Apple silicon (30.3 tokens/s decode for Qwen3.8-Flash-Next in MLX 4-bit on a 48 GB M4 Pro), and RoboDojo robot manipulation (62.1 on held-out seeds vs. 55.3 for the best leaderboard entry). Code is available at https://github.com/caoshiyi/EAT.", "categories": ["cs.AI"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.36848", "pdf_url": "https://arxiv.org/pdf/2610.36848", "score": 83, "why_selected": "Multi-agent kernel optimization that beats production FlashInfer kernels and transfers to several other domains, giving strong and practically relevant evidence.", "basis": "full text", "summary": {"tldr": "A supervisor agent keeps reorganizing a team of Claude Code agents, with shared memory files across rounds. This helps coding agents get past plateaus on hard GPU kernels, and one generated kernel beats FlashInfer's MLA decode kernel by 1.2x.", "goal": "Coding agents improve quickly on hard, open-ended optimization tasks like writing GPU kernels, then stall well below expert-written code. A typical failure: the agent gives up on a hard but high-ceiling design (e.g., Hopper WGMMA tensor-core instructions) after correctness bugs and spends its budget tuning a simpler, limited design. The authors argue the cause is a fixed team setup that stops fitting the task as it moves from correctness to debugging, profiling and redesign.", "approach": "Evolving Agent Teams (EAT) uses two levels. A supervisor agent (itself Claude Code) wakes when a team finishes or on a timer. It diagnoses why progress stalled and designs the next team from scratch: the roles, how agents coordinate (pipelined or parallel on isolated branches), and where knowledge gets written. Roles are invented, not picked from a list; examples include a Disciplinarian, Focused Debugger, Knowledge Integrator and Challenger. A persistent shared file system carries a learnings document, per-team artifacts and the supervisor's evolution history between team versions. Main tests are four CUDA kernel tasks on H100/B200 (FlashAttention-4, Gated DeltaNet prefill, MLA paged decode, fused GEMM+AllReduce), compared with Claude Code (Opus 4.6), a fixed four-role team, Codex (GPT-5.5 xhigh), K-Search and CUDAForge, mostly at matched dollar budgets. Extra single-run case studies cover KDA prefill on AMD and NVIDIA GPUs, MoE expert offload on a Mac, and RoboDojo robot manipulation.", "key_results": ["MLA decode, 47 production DeepSeek-V3 workloads: at matched budget, EAT reaches about 0.74x of FlashInfer vs 0.44\u20130.51x for Claude Code. In the ablation, a fixed four-role team reaches 0.31x and Codex 0.28x. With extended budget, a from-scratch kernel reaches 1.21x mean speedup over production FlashInfer and is faster on 36 of 47 workloads (prior best: K-Search at 0.61x).", "At an $800 budget, EAT scores 0.72x/0.69x on MLA decode vs 0.60x/0.60x for K-Search and 0.45x/0.28x for CUDAForge. Only EAT produced WGMMA kernels; the others settled on WMMA or scalar code, which is easier to get correct but slower.", "With extended budget: GDN prefill reaches 4.06x over FlashInfer, partly because FlashInfer's planning overhead dominates small inputs, and 37 of 100 workloads remain below baseline. GEMM+AllReduce reaches 1.56x over cuBLAS+NCCL, comparable to ThunderKittens' 1.54x. Rewriting Flash-KMeans' hand-tuned Triton kernel in CUDA gives 1.71x on the default workload.", "Single-run case studies: KDA prefill at 3.01x over vLLM's HIP kernels on MI350X ($3.0K, 186 hours) and 3.44x over FlashKDA on B200, starting from a port of existing kernels. The MoE offload engine decodes at 30.3 tokens/s on an M4 Pro. A RoboDojo code policy scores 62.1 on held-out seeds vs 55.3 for the best leaderboard entry."], "implications": "For long agentic optimization, the gains here come from adapting how agents are organized and how knowledge carries across rounds, not just from a stronger model. The cleanest evidence is the same-model comparison: fixed team 0.31x vs evolving team 0.74x. Kernel generation from scratch is reaching parity with production libraries on some operators, and the same supervisor prompt carried over to systems and robotics tasks.", "practicality": {"readiness": "Usable now", "score": 6, "explanation": "Code is public and builds on Claude Code, so teams optimizing kernels or other workloads with a measurable score could try it now. The barriers are cost and time: runs take hundreds to thousands of dollars and days of wall-clock time. You also need a trustworthy benchmark harness, since in one case the agents themselves found a gap in the correctness check."}, "limitations": "The evidence is thin statistically. Main setti \"el Seznec, Mikhail Biriuchinskii, Minh-Quang Pham, Minwoo Kang, Mircea Lica, Morgane Rivi\\`ere, Namit Katariya, Natasha {\\O}rregaard Klingenbrunn, Nathan Bout, Nathan Grinsztajn, Nathan Simpson, Neeraj Aggarwal, Neil Ashton, Neil Mallinar, Nick B\\\"uhrer, Nicolas Moreau, Nicol\\`o Lucchesi, Ola Mysiak, Oliver Leicht, Olivier Bousquet, Olivier Koch, Parag Jain, Patricia Wang, Patrick Blies, Patrick von Platen, Patryk Saffer, Paul Jacob, Paul Teiletche, Paul Wambergue, Paula Kurylowicz, Pavan Kumar Reddy, Pavel Kuksa, Philippe Formont, Philippe Pinel, Philom\\`ene Chagniot, Pierre Glandon, Pierre Stock, Pierre-Andr\\'e Savalle, Piotr Mi{\\l}o\\'s, Poojan Shah, Prateek Gupta, Pravesh Agrawal, Pui Ki Chan, Quentin Desreumaux, Quentin Selle, Quentin Torroba, Quentin Wargnier, Quercus Hernandez, Ram Ramrakhya, Randall Isenhour, Ranjit Parva, Rapha\\\"el Balouka, Rapha\\\"el Rialland, Raul Perez Pelaez, Reinhard Sonnleitner, Remi Delacourt, Rishi Shah, Rob Romijnders, Rohan Shah, Rohin Arora, Romain Sauvestre, Roman Soletskyi, Ronan Riochet, Rosalie Millner, Rupert Menneer, Sagar Vaze, Samuel Barry, Samuel Belkadi, Samuel Humeau, Samuele Papa, Sanchit Gandhi, Sandeep Cranganore, Sandeep Subramanian, Sarthak Mittal, Saskia Adaime, Scott Matthews, Sean Cha, Sebastian Kaltenbach, Seungjae Jung, Shashwat Verma, Sherif Waly, Shrimai Prabhumoye, Siddhant Waghjale, Siddharth Gandhi, Simon Lepage, Simon Sorg, Soham Ghosh, Sophie Marbach, Srijan Mishra, Stanislas Lange, Steve Hong, Sumukh Aithal, Szymon Antoniak, Tarun Kumar Vangani, Teddy Turquet, Teven Le Scao, Th\\'eo Cachet, Thibaut Lavril, Thomas Chabal, Thomas Coste, Thomas Defard, Thomas Foubert, Thomas Loux, Thomas Robert, Thomas Wang, Tianyu Zhang, Tim Lawson, Timoth\\'ee Lacroix, Timothy Wallis, Tobias Kronlachner, Tom Bewley, Tom Edwards, Tomas Hodan, Triantafyllos Afouras, Tuhin Das, Tyler Wang, Udit Saxena, Ulrick Bl\\'e, Umar Jamil, Umberto Tomasini, Valentin Mac\\'e, Van Phung, Venkata Reddy, Vibha Masti, Victor Jouault, Victor Letzelter, Victor Paltz, Victor Poucheret, Vincent Maladi\\`ere, Vincent Pfister, Virgile Richard, Vladislav Bataev, Wassim Bouaziz, Wen Ding Li, William Flanagan, William Havard, William Marshall, Witold J\\k{e}drzejewski, Xinghui Li, Xingran Guo, Xinyu Yang, Xuanyu Zhang, Yann Dreze, Yann Viegas, Yannic Neuhaus, Yassine Turki, Yessin Moakher, Yi He, Yihan Wang, Yimu Pan, Yuying Zhu, Yves Martin des Taillades, Zaccharie Ramzi, Zhenlin Xu, Zs\\'ofia Cs\\'ak\\'any", "abstract": "We introduce Timestral, a family of four time series foundation models for probabilistic forecasting, with 5M, 28M, 123M, and 209M parameters. Timestral sets a new state of the art on GIFT-Eval, TIME, and fev-bench, where Timestral-209M and Timestral-123M take the top two places on every metric. We achieve this with three ingredients: Decoupled Horizon Forecasting (DHF), which separates prediction tokens from the causally encoded context, so that longer horizons are trained without masking context and each observed value is both a forecast target and context for later forecasts; a covariate framework that natively supports known-future covariates within a causal architecture; and a two-stage pipeline that pretrains exclusively on a diverse, large-scale synthetic corpus before post-training on a mix of real and synthetic data with extended context. This report describes the model design and its benchmark results. Weights for all four models are available on Hugging Face and inference code on GitHub.", "categories": ["cs.AI"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.37585", "pdf_url": "https://arxiv.org/pdf/2610.37585", "score": 82, "why_selected": "An open-weights time series foundation model family that takes the top places on GIFT-Eval, TIME and fev-bench, with architectural ideas (DHF, causal covariates) that are likely to be widely used.", "basis": "full text", "summary": {"tldr": "Mistral's Timestral is a family of four open-weight forecasting models (5M\u2013209M parameters). Pretrained only on synthetic data, the two largest take first and second place on GIFT-Eval, TIME and fev-bench.", "goal": "Time series foundation models aim to forecast any series without per-dataset retraining. Causal (decoder-style) models that predict several patches ahead currently get there by masking spans of the input during training. The masked values then also disappear as context for later forecasts, so the horizons the model trains on are tied to how much context gets removed. A second problem is handling covariates whose future values are known in advance (holidays, schedules) without leaking future target values.", "approach": "The core idea is Decoupled Horizon Forecasting (DHF). Observed patches of 32 time steps are encoded causally as context tokens, and a separate stream of learned \"prediction tokens\" attends to that context but never feeds back into it. Each training sequence is split into forecast blocks of sampled length, so every observed value acts both as a forecast target and as context for later blocks; the trade-off is roughly twice as many tokens in training. A role-aware attention mask separates targets, past-only covariates and known-future covariates: only known-future covariates can see the horizon, and covariates never attend to targets. The backbone is a gated-attention Transformer with variate attention in every fourth block and a 21-quantile head built so quantiles cannot cross, trained with pinball loss. Training has two stages: pretraining only on synthetic univariate and multivariate series with 8,192-step context, then post-training on a mix of real and synthetic data with 32,768-step context.", "key_results": ["Timestral-209M ranks first and Timestral-123M second on all six aggregate metrics across GIFT-Eval, TIME and fev-bench. On GIFT-Eval, MASE is 0.6575 (CRPS 0.4460) versus 0.6608 for the best non-Timestral model, t0-gamma. On fev-bench, the MASE skill score is 39.49% versus 37.99%. The margins over the next-best model are small, about 0.5\u20134% relative.", "Efficiency: all four sizes sit on the accuracy-versus-parameter-count Pareto front. Timestral-28M beats Chronos-2 and Toto-2.0-2.5B (about 90 times larger) on all six metrics.", "On IND-Eval, an industrial benchmark the authors ran themselves, Timestral-209M scores nMASE 0.646 and nCRPS 0.435, about 7% lower error than t0-gamma (0.697 and 0.469). In pairwise comparisons it wins on most tasks against every selected competitor.", "Inference runs on CPU in 17\u2013113 ms per forecast (8 threads; 96-step horizon from 2,048 steps of context). One H100 forecasts 3,650\u201318,770 series per second, and horizons up to 1,024 steps come out of a single forward pass."], "implications": "The results support the view that a prior defined mostly by synthetic generators, followed by brief real-data post-training, can produce leading zero-shot forecasters. They also suggest that keeping context and prediction streams separate is a workable alternative to masking context in causal models. Small models that compete with billion-parameter ones make CPU deployment at scale realistic. Accuracy still improves from 123M to 209M parameters, which points to further gains from larger models.", "practicality": {"readiness": "Usable now", "score": 9, "explanation": "Weights for all four sizes are on Hugging Face and inference code is on GitHub. Forecasting needs no GPU, and the authors estimate 2\u201332 CPU cores can forecast 100,000 series every 15 minutes. Practitioners in energy, retail or operations monitoring can apply it zero-shot with covariates. The main obstacles are domain fit beyond the benchmarks and the cost of horizons longer than 1,024 steps, which are produced block by block, each conditioned on the previous block's predicted medians."}, "limitations": "This is a technical report. It contains no ablations isolating how much DHF, the covariate scheme or the synthetic-only pretraining each contribute, and the synthetic generators and real post-training data are described only loosely. The benchmark leads are small, and most comparisons rely on leaderboard numbers; the IND-Eval scores come from the authors' own runs.", "tags": ["time series forecasting", "foundation models", "synthetic pretraining", "probabilistic forecasting", "covariates"]}, "error": null, "rank": 2}, {"id": "2610.37481", "title": "Follow the Gradient: Tracing Safety Degradation Back to Training Data", "authors": "Saket Reddy, Amro Abbas, Anshuman Suri, Ari Morcos, David Schwab, Pratyush Maini", "abstract": "Fine-tuning Large Language Models (LLMs) on instruction data can quietly erode their safety, even when no training example looks harmful. Because this safety-degrading data looks benign, standard content filters struggle to catch it. We tackle this problem by developing SimpleLoRIF, a scalable gradient embedding method that identifies fine-tuning examples whose gradients align with unsafe behavior. By simplifying a low-rank attribution method and restricting backpropagation to the final four transformer blocks, SimpleLoRIF can embed datasets on the order of a million examples, boosting gradient attribution from a small-scale analysis tool into a practical filter for full post-training datasets. We first validate it on emergent misalignment, where we find that gradients can connect insecure-code training data to the broadly harmful behaviors that appear after fine-tuning, with AUC as high as 0.865 in the gradient space of misaligned models. We then use SimpleLoRIF to build SafeTulu, a version of Tulu 3 with the 20% of examples most gradient-aligned with unsafe responses removed. Training on SafeTulu reduces GCG attack success rate by up to 22% across Qwen, Llama, and Olmo, outperforming both LLM-as-a-judge and prior gradient-based filtering, while largely preserving or even improving capability. Finally, we analyzed the removed data and identify possibly under-studied sources of safety degradation, such as tool-execution failures and narrative arithmetic. We release SafeTulu along with a Hugging Face Space that lets researchers build their own customized versions of SafeTulu to fine-tune on, such as by changing the removal fraction or filtering only certain subsets.", "categories": ["cs.LG", "cs.AI", "cs.CL"], "announce_type": "cross", "abs_url": "https://arxiv.org/abs/2610.37481", "pdf_url": "https://arxiv.org/pdf/2610.37481", "score": 81, "why_selected": "Gradient attribution that scales to a practical safety filter for post-training data, validated across three model families and shipped with a released dataset; high practical relevance.", "basis": "full text", "summary": {"tldr": "SimpleLoRIF, a cheap gradient-similarity method, flags benign-looking Tulu 3 examples that weaken safety. Dropping the top 20% cuts GCG jailbreak success by up to 22% (relative) with little loss in capability.", "goal": "Fine-tuning on harmless-looking instruction data can still make LLMs easier to jailbreak. Content filters such as toxicity classifiers and LLM judges miss this data because nothing in it looks harmful. The authors want a filter based on how an example changes the model, not what it says, and they want it to run on full post-training datasets of about a million examples.", "approach": "SimpleLoRIF builds on LoRIF, an existing influence method that stores each example's gradient as a randomly projected, rank-1 factorization (64 floats per layer). It drops LoRIF's curvature (Hessian) correction because only the ranking of examples matters, and it backpropagates only through the last four transformer blocks. That gave a 91.5% speedup in their ablation, and embedding all 939k Tulu 3 examples with Qwen3-0.6B took about an hour on 8 H100s. To check that the gradient signal is real, they use emergent misalignment, where fine-tuning on insecure code makes a model broadly harmful: do insecure-code training examples, compared with matched secure-code ones, have gradients closer to the harmful outputs of the misaligned models? They then build SafeTulu by removing the 20% of Tulu 3 examples most gradient-similar to the unsafe responses in SafeRLHF, scored against cluster centroids. They fine-tune Qwen3-1.7B, Llama-3.2-1B, OLMo-2-1B and Llama-3.1-8B on it, with 3 seeds each, and compare against no filtering, random removal, a Qwen3-8B safety judge, and the earlier gradient filter of He et al. (2024). Safety is measured with two jailbreak attacks (GCG and ActorBreaker); capability with MMLU-Pro, IFEval, GSM8K, MATH-500, MBPP, MedQA and the ORBench over-refusal test.", "key_results": ["Emergent misalignment: insecure-code examples outscore matched secure-code ones with AUC 0.865 on fine-tuned Mistral-Small-24B but only 0.604 on Qwen2.5-Coder-32B. On the models before insecure-code fine-tuning, AUC falls to 0.431 and 0.552, so the signal appears only after misalignment. It also transfers poorly from Qwen to Mistral responses (AUC 0.247).", "GCG jailbreak success, baseline vs SafeTulu: Qwen 47.7% to 37.0% (about 22% relative, about 11 points absolute), Llama-1B 38% to 30.3%, OLMo 48.3% to 41.3%, Llama-8B 11.7% to 7.0%. The LLM judge and the He et al. filter barely improved on the baseline.", "ActorBreaker multi-turn jailbreak success was lowest with SafeTulu for every model, but the gains are small (about 3 to 7 points). Capability stayed close to the unfiltered baseline, with small ups and downs (e.g., OLMo MMLU-Pro 14.4 to 13.6).", "Removal-fraction sweep, run only on Llama-1B: gradient filtering keeps lowering jailbreak success up to 20% removal; the LLM judge stops helping after 10% and makes things worse beyond that. Removed data was rich in tool-execution tracebacks, narrative arithmetic and simple 'write a Python function' tasks, but these patterns are correlational only."], "implications": "Gradient-based data attribution, previously a small-scale analysis tool, becomes a practical pre-training filter for SFT mixtures of about a million examples. The filter catches safety-degrading data that content judges miss, and embeddings from a tiny 0.6B model helped other model families. It also points to under-studied sources of safety erosion (tool-error traces, overly direct compliance-style answers) that are worth testing causally.", "practicality": {"readiness": "Usable now", "score": 7, "explanation": "The SafeTulu dataset and a Hugging Face Space for custom removal fractions or subsets are released, so teams fine-tuning on Tulu 3 can use it directly. Applying it to other datasets means computing gradient embeddings, which is modest compute (about 8 GPU-hours per million examples). The evidence comes mostly from 1-2B models plus one 8B model. The paper only says SafeTulu and the Space are released; it does not say the SimpleLoRIF code is public."}, "limitations": "Tests are limited to small models, one training set (Tulu 3), one target set (SafeRLHF) and general safety; ActorBreaker gains are small and some differences fall within the error bars. The emergent-misalignment signal is inconsistent across models, and the qualitative explanations of what makes data unsafe are not causally tested.", "tags": ["LLM safety", "training data attribution", "data filtering", "fine-tuning", "emergent misalignment"]}, "error": null, "rank": 3}, {"id": "2610.37567", "title": "Gym-Anything-RT: Scaling Real-Time Environments for Vision-Language Agents", "authors": "Pranjal Aggarwal, Sean Welleck", "abstract": "AI agents have made substantial progress in domains where they have a non-trivial amount of time to deliberate between actions, such as mathematics, software engineering, and performing tasks on desktop applications. It is less clear how such models fare in settings that demand real-time interaction, such as playing a video game or operating a physical device. In these settings, the environment state may evolve as the agent is reasoning, or even as the underlying model is performing a forward pass. To gain insight into the real-time interaction capabilities of vision-language agents, we introduce Gym-Anything-RT. Our key idea is to construct visual minigames that demand a portfolio of capabilities required for interactive real-time settings. Gym-Anything-RT uses an agentic pipeline to automatically generate such environments based on a taxonomy of six capabilities required for real-time interaction, including the ability to perceive the environment and act under an evolving environment state. A key feature of Gym-Anything-RT is that it allows for controlled comparison of real-time interaction capabilities: we can run the same minigame in real time, or pause or slow down the environment to relax the requirement for real-time actions. We use Gym-Anything-RT to construct 100 real-time minigames and evaluate AI agents on them. We find large capability gaps in real-time interaction. For example, GPT-6 Astra (xHigh) achieves a pass rate of only 9.0% on the real-time minigames, which rises to 75.0% when the environment is paused. We also identify intriguing behaviors by the most powerful frontier agents: for instance, when given the ability to write code, these agents write code that bypasses the need to perceive and act in real time. We publicly release Gym-Anything-RT and the generated minigames to spur further research on AI agents in real-time interactive settings.", "categories": ["cs.LG", "cs.AI"], "announce_type": "cross", "abs_url": "https://arxiv.org/abs/2610.37567", "pdf_url": "https://arxiv.org/pdf/2610.37567", "score": 80, "why_selected": "A scalable benchmark for real-time agents that shows a striking gap between paused and real-time play for frontier models (9% vs 75%), which matters directly for embodied and gaming agents.", "basis": "full text", "summary": {"tldr": "Gym-Anything-RT is a set of 100 auto-generated visual minigames that can run live, slowed, or paused. The best tested agent (GPT-6 Astra) solves 9% live but 75% when paused, so slow responses are the main failure.", "goal": "Vision-language agents do well when the world waits for them, but they often take 10+ seconds per action. That is too slow for games or operating physical devices. Existing game benchmarks mix many skills together, so they can't tell whether agents fail because they are slow or because they lack some other skill. The authors want controlled tests that separate the two.", "approach": "Coding agents (GPT-6 Astra running in the Codex CLI) built the minigames. Creator agents wrote each game as a program, plus an \"oracle\" solver that reads the game's internal state to prove the task can be solved. Separate audit agents checked each game for bugs and for shortcuts that would let a player avoid acting in real time. Each of the 100 minigames, many drawn from CAPTCHAs and visual puzzles, has 5 difficulty levels, a simplified and a full control mode, and a non-real-time twin that changes only the timing (2,000 configurations in total). The evaluation system controls each game's clock, so the same task can run live, slowed by 4\u201364x, or paused, with under 50 ms between sending an action and getting the next screenshot back. Six models were tested using only screenshots and mouse/keyboard input, plus one extra condition where models could also write and run code.", "key_results": ["At the hardest difficulty, GPT-6 Astra (xHigh) solves 9.0% of real-time tasks vs 66.0% of their non-real-time twins. Claude Opus 5.5 scores 5.0% vs 57.0%, and GPT-6 Luna 1.0% vs 17.0%. The open-weight Qwen models score 0\u20131% on real-time tasks and only 1\u20132% on the twins, so their failures are not specific to real time.", "Slowing the environment raises Astra (xHigh) from 9% live to 17% at 4x, 48% at 16x and 57% at 64x slowdown, and to 75% when paused. Raising reasoning effort from Low to xHigh helps only when there is time to use it: live scores barely move (8% \u2192 9%), but paused scores rise from 58% to 75%.", "When allowed to run code, Astra (xHigh) writes scripts that track moving objects and act on their own, for example image template matching that clicks moving keys within 200 ms. This lifts its real-time pass rate from 9% to 31%, compared with an 8-point gain on the non-real-time twins.", "On 20 sampled tasks, one of the authors, seeing each game for the first time, solved 45% in about 2.2 minutes per task. Astra (xHigh) averages 7.2 minutes and $4.50 per attempt, and Opus 5.5 averages 15.8 minutes and $6.40. Separate tests on Luna point to two further sources of difficulty: temporal reasoning (pausing helps even on non-real-time twins that require it) and learning unfamiliar controls (supplying the rules raises Luna from 11.3% to 16.2%)."], "implications": "For frontier agents, the main barrier to real-time use is response speed, not understanding the task. So progress needs faster, cheaper models or designs where slow reasoning hands the time-critical work to fast code, much like asynchronous control in robotics. The benchmark's clock control and matched non-real-time twins make it possible to diagnose the cause of failure instead of just recording that an agent failed.", "practicality": {"readiness": "Usable now", "score": 7, "explanation": "The code and minigames are publicly released, so researchers evaluating or training interactive agents can use them now. However, running it at scale requires sandbox infrastructure, low-latency connections, and costly frontier-model API calls. The games are also synthetic minigames rather than real games or devices."}, "limitations": "The benchmark and its quality checks were built and labelled by a single model family (GPT-6 Astra) acting as creator, auditor and reviewer. The human comparison is one of the authors playing 20 tasks. It is untested whether results on these minigames carry over to full games or physical interfaces, and the paper does not test whether training on the games improves agents.", "tags": ["vision-language agents", "real-time interaction", "benchmarks", "computer use", "automated environment generation"]}, "error": null, "rank": 4}, {"id": "2610.36631", "title": "The uneven rise of AI-generated web content", "authors": "Adam Visokay, Soumyakanti Pan, Molly Griston, Polina Iasakova, Mark Nepf, Denis Peskoff, Riya Sinha, Jikai Sun, Isabelle Thiara, Letao Wang, Yiwei Wu, Lauren Yan, Tyler H. McCormick", "abstract": "In less than five years, generative artificial intelligence (AI) has dramatically reshaped the public-facing web. Using a sample of more than 5 million crawlable webpages, we demonstrate that the share containing AI-generated text has increased precipitously, but unevenly. Our analyses reveal substantial differences in AI composition across language and domain categories (e.g., .edu, .com, or .gov). A higher fraction of English-language webpages contain AI-generated text compared to pages in other languages, and prevalence is substantially lower on .gov and .edu domains compared to .com. These distinctions persist even after accounting for compositional effects. We also find heterogeneity based on a page's position in the connectivity structure of the web. AI-generated text is most common and has increased most rapidly in pages that are the least central in the graph, which drives much of the overall growth in AI-generated text. A slower increase has taken place for more central pages, with the most central tier emerging as the least likely to contain AI-generated text. Methodologically, we use multiple AI detection tools, and generate estimates using a Bayesian hierarchical model that incorporates corrections for the detectors' statistical properties (both false positives and false negatives) and allows for different detector performance across groups, while propagating uncertainty in detector error rates into prevalence estimates. Our work suggests that AI is a prominent, but varied, contributor to public information and internet-based communication.", "categories": ["cs.AI", "cs.CY", "cs.NI", "stat.AP"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.36631", "pdf_url": "https://arxiv.org/pdf/2610.36631", "score": 78, "why_selected": "A large-scale measurement of AI-generated web content with rigorous correction for detector error; high societal relevance and useful for data curation.", "basis": "full text", "summary": {"tldr": "After correcting for detector errors, about 24% of long-form crawlable webpages contained AI-generated or AI-edited text by August 2026. The share is highest on small peripheral sites, English pages and .com domains.", "goal": "The paper measures how much of the public web now contains AI-generated or AI-edited text, and where it is concentrated. The web is both what people read and the main training data for future language models. Earlier estimates mostly covered English only, reported raw detector flag rates that carry each detector's own biases, or looked only at newly published content.", "approach": "The authors drew a two-stage stratified sample of 5.1 million eligible pages (at least 500 characters of extracted text) from 505,974 domains across 71 Common Crawl snapshots, January 2019 to August 2026. Domains were stratified into six tiers by PageRank (how central a domain is in the web's link graph), and the most central tier was included in full. Every page was scored with the open Pangram detector (a fine-tuned Llama-3.2-3B classifier); English pages were also scored with Binoculars-Falcon, a zero-shot method based on perplexity. A Bayesian hierarchical model estimated prevalence together with each detector's sensitivity and specificity. Specificity came from pre-2022 'control' crawls, where flags are assumed to be mostly false positives, and sensitivity came from labeled benchmarks (EditLens, RAID, a multilingual corpus). Error rates could vary by language, tier, domain type (.com, .gov, etc.) and text length, and could shift once after 2022. Results were poststratified to population page counts and checked across 16 alternative model specifications.", "key_results": ["Overall prevalence went from near zero before 2022 to 23.6% in August 2026 (95% credible interval 22.9\u201324.4). Annual growth rose from 4.6 points per year (Feb 2023\u2013Jan 2025) to 8.1 points per year after that. The raw, uncorrected Pangram flag rate is substantially higher, including before 2022.", "Prevalence falls steadily with centrality: 27.5% in the least-central tier versus 11.6% in the most-central tier. The two least-central tiers hold 70.5% of pages but account for 78.8% of the growth since December 2021. The ordering holds after adjusting for domain type, language and length.", "English-only pages reached 32.8%, versus 17.0% for pages with no English, and the gap widened from 0.6 points (Feb 2023) to 15.8 points. The exact size of the non-English figure depends on calibration choices (13\u201318% across specifications).", "By domain type: .com 29.5%, .net 20.4%, .org 14.6%, .edu 6.1%, .gov 5.8%. After adjusting for composition, the .com\u2013.gov gap narrows from 23.6 to 18.9 points but stays large."], "implications": "AI-written text is now a large and fast-growing share of the crawlable web, which supports concerns that future models will be trained increasingly on the output of earlier models. Growth is concentrated on small peripheral sites, while central institutional domains have taken it up more slowly. Methodologically, the paper argues that AI detection should be treated as a noisy measurement to be corrected, not as a label; raw flag rates from a single detector can be badly biased.", "practicality": {"readiness": "Near-term (1-2 years)", "score": 6, "explanation": "The estimates are useful now for researchers, people curating LLM training data, and policymakers tracking web composition. The authors say they will release the code, sampled pages and model on publication, so others could reuse the error-corrected measurement framework. Barriers are compute cost, reliance on Common Crawl, weak calibration for non-English text, and the fact that the final level depends on modeling assumptions about how detectors drift over time."}, "limitations": "The headline level depends on assumptions. With no post-2022 detector drift the estimate becomes 27.7%; letting specificity drift freely as a random walk gave 9\u201322% in a pilot run. Further caveats:\n- Non-English sensitivity is pooled across all languages and calibrated on 2023-era generators.\n- Binoculars is near chance on the web data.\n- Missed detections of the two detectors are correlated, against the model's independence assumption.\n- There are no domain-level random effects.\n- Coverage is limited to crawlable long-form text, so social platforms and short posts are excluded.", "tags": ["AI-generated text detection", "web measurement", "Bayesian hierarchical models", "Common Crawl", "training data quality"]}, "error": null, "rank": 5}, {"id": "2610.35987", "title": "PROBE: Frontier Coding Agents Find Different Bugs Than Maintainers Fix", "authors": "Marco Paina, Mark Niklas M\\\"uller, Niels M\\\"undler-Sasahara, Martin Vechev", "abstract": "Proactive bug discovery is an important software-engineering problem. Even though coding agents are already widely deployed in this domain, their capabilities remain understudied. In particular, the challenging task of finding all bugs that human maintainers would repair across an entire repository has not been studied yet. To close this gap, we introduce PROBE, a benchmark consisting of all 2,457 bugs fixed over the course of 18 months across 20 diverse GitHub repositories, together with a method for matching candidate findings to this partial reference set. We evaluate coding agents across frontier models and find they all achieve a recall of below $21\\%$ and a precision of less than $9\\%$ with respect to the reference set. While stronger models increase recall substantially from $8\\%$ to $17\\%$, they do not improve precision. Surprisingly, despite the low precision, LLM and human evaluators still judge $85\\%$ of findings valid. Crucially, we find that found bug distributions are similar across agents but differ substantially from those of bugs fixed by maintainers. The practical relevance of bug discovery and the low recall of frontier models make this benchmark a valuable resource for both model users and developers.", "categories": ["cs.SE", "cs.AI", "cs.LG"], "announce_type": "cross", "abs_url": "https://arxiv.org/abs/2610.35987", "pdf_url": "https://arxiv.org/pdf/2610.35987", "score": 77, "why_selected": "A repository-scale bug-discovery benchmark showing that agents find bugs distributed differently from those maintainers fix; practically important and insightful.", "basis": "truncated full text", "summary": {"tldr": "PROBE tests whether coding agents can find the bugs maintainers actually fixed across 20 repos. The best agents recover under 21% at under 9% precision, though about 85% of their findings appear to be real bugs.", "goal": "Coding agents are increasingly marketed for proactive bug finding, but no benchmark asks whether they can find, across an entire repository, the bugs that human maintainers actually care enough to fix. The full set of bugs in any repo is unknown, so the authors use the bugs maintainers fixed over time as a partial reference set.", "approach": "The authors took snapshots of 20 Python, JavaScript and TypeScript repositories (sqlglot, prefect, pdf.js, svelte and others, up to 200k lines each) on 1 Jan 2025. They then mined all 13,254 commits up to July 2026 with an LLM-assisted pipeline: classify bug-fix commits, extract bugs, map code back to the snapshot, check with an agent that the bug was already present, and deduplicate. The result is 2,457 reference bugs. Agent findings are matched to these bugs in two stages: rule-based similarity filters, then a Gemini 3.5 Flash judge, which reached about 99% precision and 98% recall on 67 expert-labeled matches. Plain single-session agents reached under 1% recall, so the authors built a multi-pass harness. It splits each repo into 740 file partitions in total and gives each pass a context document and call-graph snippets. Ten frontier models were evaluated, and a panel of LLM judges checked whether findings outside the reference set were real bugs; this panel was spot-checked against one author's blind grades.", "key_results": ["Best recall is 20.8% (GPT-5.6 Sol, high effort, $1,185 per full run). No configuration exceeds 8.1% precision against the reference set.", "Recall rises mainly because models report more findings (Pearson r=0.94 between recall and number of findings); precision stays around 5\u20138%. For GPT-5.6 Luna, raising reasoning effort lifts recall from 5.3% to 17.3% as cost goes from $8 to $131. Cheap models such as DeepSeek V4.1 Flash ($73) beat GPT-5.6 Sol (medium) on F1.", "The LLM judge panel confirmed 96% of matched findings and 84% of unmatched findings as real bugs. It agreed with a human grader on 93% of findings that both judged (\u03ba=0.77). Validity is lower for Claude Sonnet 5, Gemini 3.5 Flash and Muse Spark (64\u201373%).", "Agents across models report similar kinds of bugs, and this mix differs from what maintainers fix. Agents over-report local faults such as wrong arithmetic or comparisons (18.5% vs 9.9% of maintainer fixes). They under-report cases where code is missing a branch for a supported kind of input (7.7% vs 18.0%), wrong public type declarations, and missing lookup-table entries. Repeated GPT-5.6 Luna runs overlap with each other a median of 6.3\u00d7 more than with maintainer fixes."], "implications": "Today's agents do find real bugs, but mostly not the ones maintainers prioritize, and spending more on stronger models or more reasoning mostly produces more findings rather than more relevant ones. The authors suggest that methods which run software the way users do may get closer to maintainer priorities: maintainer-fixed bugs more often need a specific environment, a person looking at the output, or particular timing to show up.", "practicality": {"readiness": "Usable now", "score": 7, "explanation": "The benchmark and harness are public (probebench.com, LogicStar/probe), and the construction pipeline can be applied to any repository with a commit history. Teams can use the harness today for bug auditing at roughly $8\u2013$1,200 per 20-repo run. The obstacles are low precision against what maintainers care about and the triage effort needed to sort through thousands of findings, many of them real but low-priority."}, "limitations": "The reference set covers only 18 months of fixes, so even a perfect bug finder would score an estimated 26\u201347% precision; the benchmark also covers only memory-safe languages and repos under 200k lines. Data contamination cannot be ruled out for the three models released after the window without a published knowledge cutoff (GLM 5.3 Flash, Muse Spark 1.3, DeepSeek V4.1 Flash). Checks of the reference set itself were noisy: the auditing agent flagged 8.5% of reference bugs as incorrect, and its verdicts agreed only weakly with human labels on a 100-bug sample (\u03ba=0.29), so the authors kept the full set.", "tags": ["coding agents", "bug detection", "benchmarks", "software engineering", "LLM evaluation"]}, "error": null, "rank": 6}, {"id": "2610.36589", "title": "InfraDev: Can Coding Agents Develop AI Infrastructure, and How Can We Tell?", "authors": "Yangshen Deng, Jiaqi Ruan, Yeqi Huang, Nick Lau, Guangming Sheng, Luo Mai", "abstract": "Coding agents are beginning to develop the production-grade AI infrastructure that trains and serves large models, yet existing benchmarks cover only single kernels or single-GPU tasks, and grade with tests and prompts that misjudge both correct and incorrect patches. We introduce InfraDev, a benchmark of 36 tasks built from real-world pull requests to Megatron-LM, vLLM, and verl, covering infrastructure development for training, inference, and reinforcement learning. Each task asks an agent to reimplement a real change that spans many files and must run correctly across many GPUs. To grade such changes, we jointly synthesize hidden probes, which enforce the requirements the original tests leave unchecked, and a prompt that states every interface the probes call without revealing the solution. We also design a shared execution environment that reuses dependencies and artifacts across tasks, cutting storage by 52-57% and build time by 13-14% on Megatron-LM and vLLM. Across six frontier models, the best resolves only 38.9% of the tasks; the probes reject 32% of the submissions that pass every official test, and with the original pull request descriptions as prompts, no model resolves a single task. Failure analysis shows that structural and state errors dominate and that agents' own tests rarely check memory, time, or traffic. Turning these findings into an agent skill raises the resolved rate of a frontier model on the Megatron-LM tasks by 10.5%.", "categories": ["cs.AI", "cs.DC"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.36589", "pdf_url": "https://arxiv.org/pdf/2610.36589", "score": 76, "why_selected": "A realistic multi-GPU infrastructure benchmark whose hidden probes expose flaws in test-only grading; valuable but small, at 36 tasks.", "basis": "full text", "summary": {"tldr": "InfraDev is a benchmark of 36 multi-GPU tasks rebuilt from real Megatron-LM, vLLM and verl pull requests. The best frontier coding agent solves only 38.9%, and hidden probes show that the official tests overstate success.", "goal": "The paper asks whether coding agents can make real changes to production AI infrastructure, meaning the frameworks used to train, serve and RL-tune large models, and how such changes should be graded. Existing benchmarks mostly test single GPU kernels or single-GPU optimization. Grading with a pull request's own tests and description is unreliable both ways: weak tests let wrong patches through, and vague descriptions make correct patches fail.", "approach": "The authors filtered 21,389 merged PRs from Megatron-LM (training), vLLM (inference) and verl (RL), kept those over 1,000 lines that add tests, and hand-picked 36 that change core functionality. The average task touches 17.4 files and 1,818 lines, and 20 tasks need multiple GPUs. For grading, an agent writes 'adversarial patches' that pass the official tests but break the PR's promises, then writes 'hidden probes' that catch them. A probe is kept only if it reliably accepts the real patch and rejects the pre-PR code, every adversarial patch, and a 'hollow' patch that defines the new functions without implementing them. A second agent writes the task prompt; a linter makes sure it names every interface the tests call, and a checker agent makes sure it doesn't give away the solution. Six agents were each run once per task, with 2.5 hours on an 8-GPU H800/H20 node.", "key_results": ["Resolved rates range from 25.0% (GLM 5.3) to 38.9% (GPT-6 Sol), while 74\u201383% of individual tests pass. Inference tasks are the hardest: every model solves only 1 of the 10 vLLM tasks.", "The hidden probes reject 32% of submissions that pass all official tests (69 of 102 survive), cutting each model's resolved rate by 11\u201319 points. On Megatron-LM, prompting with the original PR descriptions instead of the synthesized prompts dropped resolved rates to 0% for both models tested.", "Failure analysis covers 1,754 failing test cases from five models. Structural errors (crashes, broken APIs, shape mismatches, mishandled state) appear in 48% of submissions. Every numerical error came from a wrong algorithm, never from precision alone. On the four CUDA-graph tasks, 60% of submissions break only when CUDA graphs are switched on. Fewer than 2% of the 5,532 assertions in agents' own tests check memory, time or traffic.", "A general skill built from these findings (check every caller and piece of state, compare against a naive reference implementation, measure resources and test under CUDA graphs) raised GPT-5.6 Sol on the Megatron-LM tasks from 42.1% to 52.6%. Sharing dependencies and model weights across tasks, instead of one Docker image per task, cut storage by 52\u201357% and build time by 13\u201314%."], "implications": "Agents are far from reliably shipping multi-file, multi-GPU infrastructure changes. Benchmarks that reuse a PR's own tests and description can give a misleading picture in either direction. Writing hidden tests and the task prompt together is a recipe other repository-level benchmarks could adopt. The failure analysis gives concrete targets: managing state across calls, CUDA-graph behavior, and checking that an optimization actually saves resources.", "practicality": {"readiness": "Near-term (1-2 years)", "score": 5, "explanation": "Groups building frontier models and agents could use InfraDev once it is open-sourced, which the authors promise but have not yet done. The infrastructure skill could be reused by practitioners today. The main barrier is cost: an 8-GPU node per run for up to 2.5 hours puts evaluating one model at several hundred GPU-hours, beyond most academic labs. Choosing PRs still requires domain experts."}, "limitations": "The benchmark is small (36 tasks, with 10 or fewer each for inference and RL), each model ran once with no variance reported, and one model may have been degraded while it was being measured. The probes and prompts are written by agents and checked only by automated checks; whether each adversarial patch really breaks a PR promise is never verified by running it. The skill's gain was tested on one model and one repository, and the skill was built from failures on these same tasks.", "tags": ["coding agents", "benchmarks", "AI infrastructure", "test synthesis", "distributed training"]}, "error": null, "rank": 7}, {"id": "2610.37201", "title": "Does Your Generalist Skill Optimizer Really Incentivize Agentic Tasks? Rethinking Skill Optimization via Bipartite Attribution", "authors": "Jiawei Zhou, Bo Peng, Yuxuan Huang, Ming Zhang, Youbang Sun, Xiang Wang, Chaochao Lu", "abstract": "Skill optimizers adapt an agent to long-horizon tasks, such as repairing a terminal environment, by rewriting its skill, a natural-language procedure in its context, and keeping the edits that raise success on a small dev set. On such tasks success is noisy, so a gain on a small dev set does not show that an edit helps, and a success score does not show what the edit costs. We introduce BiPA, which replays an optimizer's acceptance rule on candidates identical to its seed to measure what selection alone reports, and records each episode as a bipartite graph of turns and the text they read to trace extra input tokens to the behavior behind them. Across three optimizers, three agentic benchmarks and two models, the learned skills succeed about as often as their hand-written seed, 0.1 points higher on average. Their dev gains vanish on test: keeping the best of several candidates on at most 30 tasks reports gains this large even when none changed. They read about 16% more input tokens: the optimizers almost always add rules, half to re-check work and some to act one call at a time, and the agent follows them as extra turns, each re-sending the whole conversation. Four principles follow: accept an edit only if its gain exceeds what selection alone reports; charge it for the turns it adds, not for its length; let the editor delete and merge rules; show it what earlier rules cost. Code is available at https://github.com/valleysprings/BiPA.git.", "categories": ["cs.AI"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.37201", "pdf_url": "https://arxiv.org/pdf/2610.37201", "score": 75, "why_selected": "A sharp critical audit showing that skill optimizers' gains come mostly from selection noise, with actionable principles for fixing them.", "basis": "full text", "summary": {"tldr": "Across 16 learned skills, three skill optimizers (GEPA, SkillOpt, SkillAdam) did no better than their hand-written seed on long-horizon agent tasks (+0.1 points) yet used about 16% more input tokens.", "goal": "Skill optimizers rewrite an agent's natural-language procedure (its \"skill\") and keep an edit when it scores higher on a small dev set. On long, noisy tasks this check is weak in three ways: a dev gain may just be selection luck, a success score hides what the edit costs, and because each edit adds several rules scored together, no single rule gets credit or blame. The paper asks whether these optimizers actually help on agentic tasks and what their edits cost.", "approach": "The authors built BiPA (Bipartite Attribution), which analyzes an optimizer's logs without changing the optimizer. First, a selection replay re-runs the optimizer's acceptance rule on candidates identical to the seed, drawing task outcomes from a Beta-prior difficulty model, to show how large a dev gain selection alone produces. Second, each episode is recorded as a bipartite graph linking the agent's turns to the text each turn reads; a derived \"turn elasticity\" then splits any rise in input tokens into more tool calls, the same calls spread over more turns, more text per turn, and longer skill text. Third, each added rule is sorted into one of eight categories (e.g., verify, serialize) and compared with the behavior the logs show. The setup was GEPA, SkillOpt and SkillAdam on Terminal-Bench 2.1, \u03c43-bench and AutomationBench, with DeepSeek-V4.1-Flash and GPT-6-Luna in the OpenCode harness without history compaction; all runs shared one hand-written seed skill, used dev sets of at most 30 tasks (9 on Terminal-Bench), and ran each skill 3 times on test.", "key_results": ["Learned skills averaged +0.1 points test success over the seed across all 16 skills and \u22121.4 points across the nine DeepSeek skills (range \u221211.1 to +2.7). Only one skill (GPT-6-Luna's SkillAdam on AutomationBench, +6.4 points) beat the seed by more than the seed's own run-to-run spread (5.8 points).", "Replays with unchanged candidates matched the reported dev gains with probability 0.56\u20130.94 for SkillOpt and GEPA under DeepSeek, and 0.25\u20130.88 for SkillAdam. A simple 'beat the parent once' gate accepted 24\u201341% of unchanged candidates.", "Learned skills read about 1.16\u00d7 the seed's input tokens overall (1.08\u20131.43\u00d7 under DeepSeek). 58 of 59 DeepSeek edits lengthened the skill; about half of the added rules ask the agent to re-check its work and none ask it to read less. Extra turns account for 73% of the added tokens and skill text for 21%; across edits, the change in turns explains 93% of the variance in token cost versus 10% for the change in skill length.", "Within a task, 10% more turns meant about 14\u201316% more input tokens (turn slopes 1.35\u20131.58), because every turn re-sends the whole history. When skills were moved to another model or benchmark, their success gains disappeared but most of their extra cost remained."], "implications": "Reported improvements from current skill optimizers on long-horizon agent tasks can come from best-of-K selection on tiny dev sets rather than real gains, and the edits quietly raise cost by adding turns. The authors propose four design principles: accept an edit only if its gain beats what selection alone produces; charge edits for the turns they add, not their length; let the editor delete and merge rules; and show the editor what earlier rules cost. Requiring a dev win to repeat on a second run cut false acceptances to 6\u201317% in simulation.", "practicality": {"readiness": "Usable now", "score": 7, "explanation": "Code is public, and the diagnostics (selection replay, token attribution from agent logs) can be applied to existing optimizer runs without changing the optimizer. Teams building or evaluating skill or prompt optimizers could adopt the repeat-win gate and turn-based cost accounting right away. The specific numbers, however, depend on a harness that re-sends its full history and on small dev sets."}, "limitations": "The study covers three optimizers, one shared seed, two models, one harness and small test sets (TB2 has only 18 test tasks). Attribution is after the fact and accounting-based: it does not causally test single rules, and it cannot break success down by rule.", "tags": ["LLM agents", "skill optimization", "evaluation methodology", "inference cost", "prompt optimization"]}, "error": null, "rank": 8}, {"id": "2610.36068", "title": "Rollback: Experience Backtracking in World Models for Policy Improvement", "authors": "Jiayi Luo, Yang Zhang, Liliang Chen, Nan Wang, Chen Gao, Boxiang Qiu, Zhuoxuan Li, Baorui Peng, Chuankang Li, Yuxiang Yan, Si Liu, Qingyun Sun, Shuicheng Yan, Maoqing Yao, Jianxin Li, Guanghui Ren", "abstract": "Action-conditioned world models offer a scalable alternative to costly real-world interaction for improving robot policies. However, existing world-model-based methods largely treat world models as forward-only surrogates of the physical environment, leaving untapped a capability no physical environment affords: rewinding to past decision points to explore counterfactual futures. We introduce Rollback, a policy improvement paradigm that turns world models from passive simulators into counterfactual engines: it rolls back to critical decision points, branches into alternative actions, and contrasts their outcomes to attribute success to individual decisions. This concentrates imagination where it matters most and distills counterfactual outcomes into fine-grained, action-level supervision without a separately learned value model. We build a scalable training system that unifies distributed world-model search with asynchronous real-robot execution, forming a self-reinforcing cycle: real-world experience continually sharpens the world model, and a sharper world model in turn drives further policy improvement. We term the world-model side of this cycle test-time physics grounding, a capability that hand-built physics simulators lack: while the world model serves as the training environment, real transitions from the policy it trains correct its dynamics through a lightweight LoRA pipeline. Experiments on three challenging real-world tasks show that Rollback improves success rates over the strongest baseline by an absolute 10.67%, 11.11%, and 11.85% on block extraction, ball tossing, and tabletop curling, respectively, while achieving more stable improvement throughout training. Although initialized from teleoperated demonstrations far below human level, Rollback surpasses the average success rate of human players on both ball tossing and tabletop curling within 8 hours of training.", "categories": ["cs.RO", "cs.AI", "cs.LG"], "announce_type": "cross", "abs_url": "https://arxiv.org/abs/2610.36068", "pdf_url": "https://arxiv.org/pdf/2610.36068", "score": 74, "why_selected": "Uses world models for counterfactual rollback in real-robot policy improvement, with solid real-world gains and a novel framing.", "basis": "full text", "summary": {"tldr": "Rollback rewinds a learned video world model to key moments in real robot attempts, tries other actions there, and trains the policy on which ones worked. It beats a forward-only world-model baseline by about 11 points.", "goal": "Real-robot practice is slow and needs a person to reset the scene after every try. Learned world models can act as simulators, but existing methods only roll them forward from the start. That wastes compute on parts of a trajectory that don't matter and doesn't show which individual action caused success or failure. The paper uses something a physical environment can't offer, rewinding to a past moment and trying a different action, to get better exploration and action-level training signals.", "approach": "The world model is GE-Sim 2.0, a video model that predicts the images from three cameras plus the robot's joint states for a given chunk of actions. Starting from real successful and failed episodes, Rollback saves the model's state at each decision point. It then runs Monte Carlo tree search, with the policy itself proposing alternative action chunks, and gives extra rollouts to sibling branches whose outcomes disagree. A fine-tuned success judge scores each imagined rollout. Each action chunk's value is the success rate of the rollouts that follow it, compared against its siblings and sorted into 5 quality bins. These bins become labels for training a pi0.5 policy (using the RECAP recipe with flow matching), so no separate value network is learned. Running in parallel, the world model is repeatedly fine-tuned on new real robot trajectories using small LoRA updates followed by distillation into a faster generator. The authors call this 'test-time physics grounding'. Everything runs asynchronously on 48 H200 GPUs connected to one physical robot.", "key_results": ["Real-world success rates: Block Extraction 69.3%, Ball Tossing 40.0%, Tabletop Curling 64.4%. The strongest baseline is RISE reimplemented on the same world model, and Rollback beats it by +10.67, +11.11 and +11.85 points; across all tasks the average is 57.9% vs 46.7%.", "Over 8 hours with one robot, Ball Tossing rose from 25.6% to 40.0% and Curling from 51.1% to 64.4%. RISE fluctuated and finished near where it started (28.9% and 52.6%).", "The paper reports beating the average of three human players: Ball Tossing 40.0% vs 31.5% after 8 hours (first passed at 6 hours), Curling 64.4% vs 58.4% (first passed at 4 hours). Teleoperation scored far lower on both.", "Ablations on Block Extraction: freezing the world model drops success to 64.7%, and using single-rollout rewards instead of averaging over the subtree drops it to 59.3%. Updating the world model on real data cut prediction error in Curling replays from 19.5 to 13.0 (RGB L1)."], "implications": "The results suggest learned world models are worth more as rewindable environments for searching over counterfactual 'what if' actions than as forward-only simulators. Comparing sibling actions from the same moment can give action-level credit assignment without training a value model. Continually updating a learned simulator on the robot's own real data also looks necessary to stop the policy from exploiting simulator errors, and hand-built physics engines can't be updated this way.", "practicality": {"readiness": "Near-term (1-2 years)", "score": 4, "explanation": "Well-resourced robotics labs could adopt this for fine-tuning single-task policies with only a little real-robot time. The barriers are high: 48 H200 GPUs, a strong pretrained action-conditioned world model (GE-Sim 2.0), a success judge trained for each task, and per-task tuning of the search settings."}, "limitations": "The evidence is narrow: three tasks, one robot, single-task policies, and modest trial counts (90\u2013150 per method per task). The 'surpasses humans' claim rests on an average of three people. The method also depends on reward-model accuracy and on world-model fidelity, and the paper shows prediction error grows over long rollouts.", "tags": ["world models", "robot learning", "Monte Carlo tree search", "counterfactual credit assignment", "VLA reinforcement learning"]}, "error": null, "rank": 9}, {"id": "2610.37224", "title": "Spine: Compiling Subtask Trees into Structured Context for Long-Horizon Coding Agents", "authors": "Jiahong Xiang, Kunqiu Chen, Lingming Zhang, Yuqun Zhang", "abstract": "Long-horizon coding tasks contain nested subtasks. Typically, agents record interactions sequentially into a growing history, causing context inflation and performance degradation. Compressing or trimming the history without explicit subtask boundaries can discard information needed by unfinished subtasks. Conversely, recursive subagent delegation isolates completed subtasks through child agents by assigning every subtask boundary to delegation, which conflates subtask granularity with executing agent choice, adding execution and coordination overhead. We introduce Spine, an interface and runtime that align model context with subtask nesting and completion. An agent declares explicit subtask boundaries through work scopes, allowing the same agent to execute nested subtasks inline while reserving delegation for independent parallel tasks. The runtime organizes execution in SpineTree, a persistent tree recording subtask relations, local interactions, completion states, and returned results. Before each model call, it compiles the tree into model context just in time, retaining unfinished subtasks' interactions and replacing completed subtasks' details with their results, while preserving prefix-cache reuse. We integrate Spine into Codex to build SpineCodex. With GPT-5.6 Sol, compared with native Codex, SpineCodex improves SWE-Milestone Score by 11.8% while reducing total cost by 32.4%, improves the average ProgramBench test-pass rate by 17.3%, and improves Mean@5 on eight of the ten evaluated FrontierSWE tasks. On SWE-Milestone, it also achieves a comparable Score to Recursive Subagent at 73.7% lower total cost. We also integrate Spine into Pi through a reusable software package: with Gemini 3.8 Flash and Qwen 3.8 27B, it improves SWE-Milestone Score by 9.5-17.5% and the average ProgramBench test-pass rate by 4.3-8.7% compared with native Pi.", "categories": ["cs.SE", "cs.AI"], "announce_type": "cross", "abs_url": "https://arxiv.org/abs/2610.37224", "pdf_url": "https://arxiv.org/pdf/2610.37224", "score": 74, "why_selected": "A practical subtask-tree context runtime for coding agents that improves both accuracy and cost across several harnesses.", "basis": "full text", "summary": {"tldr": "Spine has a coding agent mark where each subtask starts and ends. Once a subtask is finished, its detailed history in the prompt is swapped for its result. On long-horizon coding benchmarks this raised scores and usually lowered cost.", "goal": "On long coding tasks, agents keep adding every interaction to one growing history. The context bloats and performance drops. Existing fixes have drawbacks. Compressing or trimming the history can throw away details that unfinished work still needs, which leads to re-reading files and premature \"done\" claims. Handing every subtask to a child agent isolates context but adds a lot of coordination and token overhead. The paper asks how to match the context to the nesting of subtasks without spinning up extra agents.", "approach": "The agent gets four commands: Open (start a nested subtask), Close (finish it and submit a result), Next (close one subtask and open a sibling) and Spawn (hand independent tasks to parallel agents). The runtime records everything in SpineTree, a persistent tree built incrementally by an LR(0) parser over these markers. Before each model call it builds the prompt from the tree: unfinished subtasks keep their full interactions, and each completed subtask is replaced by its submitted result. The full details stay in the tree, and the unchanged earlier part of the prompt can still be reused from the cache. The authors built this into OpenAI's Codex (SpineCodex) and as a plugin for the Pi harness (SpinePi), and tested on SWE-Milestone (98 milestones), a 50-task ProgramBench sample and 10 FrontierSWE tasks, using GPT-5.6 Sol, Grok 4.6, Gemini 3.8 Flash and Qwen 3.8 27B.", "key_results": ["SWE-Milestone with GPT-5.6 Sol: Score rose from 38.1% to 42.6% (+11.8% relative) and resolved milestones from 14 to 19, while cost fell from $681 to $461 (\u221232.4%). Average input per request dropped from 131K to 72K tokens.", "Against Recursive Subagent, Score was about the same (42.6% vs 42.4%; 19 vs 17 milestones resolved) at 73.7% lower cost ($461 vs $1,750). Spine also beat AgentDiet (36.5%) and Context Folding (37.1%), though Context Folding was run without its RL training.", "ProgramBench average test-pass rate improved by 17.3% relative with GPT-5.6 Sol (62.6% to 73.4%) and 10.2% with Grok 4.6. FrontierSWE Mean@5 improved on 8 of 10 tasks with GPT-5.6 Sol. Spine was cheaper in 5 of 6 benchmark\u2013model settings with Codex; the exception was ProgramBench with GPT-5.6 Sol, at +5.4% cost.", "In Pi, SWE-Milestone Score rose 9.5\u201317.5% and the ProgramBench pass rate 4.3\u20138.7%. With Gemini, input per request fell 67.8% and cost fell 45.4%. Ablations on 3 projects found that allowing only one nesting level, or hiding the boundary markers from the model, cut Score and raised cost by 30\u201342%."], "implications": "Representing subtask structure explicitly gives a principled way to decide what stays in an agent's context. Results are swapped in at natural completion points rather than by blind compression. It also separates how work is broken into subtasks from whether another agent does it, which suggests many multi-agent setups pay for delegation mainly to isolate context. Harness designers could adopt this pattern without retraining models.", "practicality": {"readiness": "Usable now", "score": 8, "explanation": "SpineCodex and SpinePi are open source and installable from npm, so teams already using Codex or Pi can try them directly. The gains depend on the model using the Open/Close commands sensibly. Absolute success rates remain low (for example, 19 of 98 milestones), so this is an efficiency and robustness improvement, not a solution to long-horizon coding."}, "limitations": "Most comparisons rest on a single run per setting over modest task sets (7 repos, 50 sampled ProgramBench tasks, 10 FrontierSWE tasks), with no reported variance outside the ablations. The baselines were reimplemented inside Codex, including Context Folding without its training. Some settings still used more tokens, such as Qwen on SWE-Milestone.", "tags": ["coding agents", "context management", "long-horizon tasks", "LLM agents", "software engineering"]}, "error": null, "rank": 10}];
