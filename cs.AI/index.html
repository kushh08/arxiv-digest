<script>
// Shared rendering for the live app and exported/published digest pages.

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function readinessClass(r) {
  if (r.startsWith("Usable")) return "ready-now";
  if (r.startsWith("Near")) return "ready-near";
  return "ready-far";
}

function paperCard(p) {
  const s = p.summary;
  const head = `
    <div class="paper-head">
      <div class="rank">${p.rank}</div>
      <div>
        <h2><a href="${esc(p.abs_url)}" target="_blank" rel="noopener">${esc(p.title)}</a></h2>
        <div class="authors">${esc(p.authors)}</div>
        ${s ? `<div class="tldr">${esc(s.tldr)}</div>` : ""}
        <div class="chips">
          ${s ? `<span class="chip ${readinessClass(s.practicality.readiness)}">${esc(s.practicality.readiness)}</span>` : ""}
          ${(s?.tags || []).map((t) => `<span class="chip">${esc(t)}</span>`).join("")}
          ${p.basis !== "full text" ? `<span class="chip">Based on ${esc(p.basis)}</span>` : ""}
        </div>
      </div>
    </div>`;
  if (!s) {
    return `<article class="paper">${head}<p class="authors">The full breakdown couldn't be generated: ${esc(p.error)}</p>
      <p>${esc(p.abstract)}</p>${links(p)}</article>`;
  }
  const pct = Math.max(0, Math.min(10, s.practicality.score)) * 10;
  return `<article class="paper">${head}
    <div class="grid">
      <div class="section"><h3>Goal</h3><p>${esc(s.goal)}</p></div>
      <div class="section"><h3>How they did it</h3><p>${esc(s.approach)}</p></div>
      <div class="section"><h3>Key results</h3><ul>${s.key_results.map((r) => `<li>${esc(r)}</li>`).join("")}</ul></div>
      <div class="section"><h3>Implications</h3><p>${esc(s.implications)}</p></div>
      <div class="section"><h3>Real-world practicality · ${s.practicality.score}/10</h3>
        <div class="practical-bar"><div style="width:${pct}%"></div></div>
        <p>${esc(s.practicality.explanation)}</p></div>
      <div class="section"><h3>Limitations</h3><p>${esc(s.limitations)}</p></div>
    </div>
    <details><summary>Why it made the top 10</summary><p>${esc(p.why_selected)}</p></details>
    ${links(p)}
  </article>`;
}

function links(p) {
  return `<div class="links"><a href="${esc(p.abs_url)}" target="_blank" rel="noopener">Abstract</a>
    <a href="${esc(p.pdf_url)}" target="_blank" rel="noopener">PDF</a></div>`;
}

function fmtDate(iso) {
  return new Date(iso + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
}

const PAPERS = [{"id": "2610.39302", "title": "Proving and Improving the Platonic Representation Hypothesis with JEPAs", "authors": "Randall Balestriero, Yann LeCun", "abstract": "Whether models trained on different modalities converge to the same representation of the world is central to AI. The Platonic Representation Hypothesis (PRH) conjectures that they do as they scale, but without a proof it offers neither a guarantee nor a recipe. We turn the hypothesis into a theorem. First, we prove a \\emph{Platonic Representation Theorem}: Joint-Embedding Predictive Architectures (JEPAs) trained separately on any number of modalities learn the same representation up to one rotation whenever their positive pairs are two observations of one scene--\\emph{good views}--and their misalignment is bounded otherwise. Second, we show that next-token prediction is a JEPA with \\emph{bad views}, parts of a single document, which explains why language models align with vision only through scale. Third, we validate the theory from 145k captions to the texts of 940M web images, and uncover a scaling law of alignment that predicts unseen runs within seed noise. Good views need 42 times fewer training samples than next-token prediction on the same corpus to reach the same alignment, and a 109M-parameter text JEPA aligns with DINOv2 and CLIP's image encoders better than every language model we evaluated, up to 72B parameters, and than CLIP's text encoder: next-token prediction is a remarkably inefficient route to platonic representations. As a showcase, one rotation turns separately trained encoders into an image captioner (CIDEr .838 on COCO). Even that rotation needs no pair: on the latest pair-free benchmark, our text JEPA beats every zero-shot accuracy reported with language models up to 8B parameters, e.g., 64\\% against at most 56\\% top-5 on ImageNet-100. Positive views, and not scale alone, are thus the lever to build platonic representations.", "categories": ["cs.AI", "cs.CV", "stat.ML"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.39302", "pdf_url": "https://arxiv.org/pdf/2610.39302", "score": 92, "why_selected": "Gives the Platonic Representation Hypothesis a formal proof and backs it with large-scale evidence, including a predictive alignment scaling law and a small text JEPA that aligns with vision encoders better than every tested language model up to 72B; likely to have broad influence.", "basis": "full text", "summary": null, "error": "Claude Code error: You've hit your 5-hour limit \u00b7 resets 1:50pm (Asia/Calcutta)", "rank": 1}, {"id": "2610.39714", "title": "MoLRSI: A Recursive Self-Improving AI agent for Molecular Discovery", "authors": "Yikun Zhang, Xiwei Cheng, Mingze Yuan, Yu Zhang, Brian Shim, Aarti Krishnan, Daniel Rosen, Kunyang Sun, Yingze Wang, Zhenfeng Deng, Botao Yu, Bingxu Liu, David Liu, Tianyu Liu, Yuanqi Du, Nir Hacohen, James J. Collins, Wengong Jin", "abstract": "Molecular discovery requires navigating vast combinatorial search spaces while balancing competing biological objectives. AI agents can automate expert-defined molecular design protocols, but automation alone does not address how to optimize workflows for new tasks or improve their development through experience. Here we introduce MoLRSI, an AI agent that combines systematic optimization of workflows and model architectures with persistent cross-task memory to recursively improve its search policy for molecular discovery. Workflow performance, refinement outcomes, and execution feedback guide subsequent searches, allowing the agent to improve both its workflows and its strategy for developing them. We evaluate MoLRSI in two challenging molecular discovery settings that require balancing competing properties. In antibiotic discovery, MoLRSI developed a screening workflow balancing antibacterial activity, cytotoxicity and structural novelty, achieving an experimental hit rate of 15.9%, compared with 8.7% for a previous expert-led workflow using the same training data and screening library. In de novo peptide-MHC binder design, MoLRSI developed workflows that jointly consider target binding and specificity, producing eight experimentally validated hits against MART-1 and SARS-CoV-1 pMHCs with preferential binding over tested off-targets while Claude Science completely failed. These findings demonstrate how experience-guided workflow optimization can address competing discovery objectives while improving the search strategies used in subsequent campaigns.", "categories": ["cs.AI"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.39714", "pdf_url": "https://arxiv.org/pdf/2610.39714", "score": 88, "why_selected": "A self-improving molecular-discovery agent whose designs were tested in the lab: it nearly doubled the antibiotic hit rate of an expert-led workflow and produced eight validated peptide-MHC binders.", "basis": "truncated full text", "summary": null, "error": "Claude Code error: You've hit your 5-hour limit \u00b7 resets 1:50pm (Asia/Calcutta)", "rank": 2}, {"id": "2610.39744", "title": "PAPERBENCHX: Can AI Reproduce Science Across Disciplines?", "authors": "Ruoyu Wu, Zengji Tu, Aolong Sun, Tianyi Ma, Junren Li, Xinbo Xu, Li Fu, Ziyan Zhang, Pinrui Huang, Xiaochen Wang, Chengda Wu, Yutao Zhou, Jianjun Wu, Lin Chang, Baobao Chang, Liang Chen, Kuan Li", "abstract": "Before AI can be trusted to discover new science, it should be able to reproduce what science already knows. Reproduction provides a rigorous checkpoint for an AI scientist: the target claim is known, yet recovering it still requires translating an incomplete scientific description into an executable experiment and producing evidence that can be independently verified. Existing research-reproduction benchmarks largely focus on AI and machine learning, where experiments share relatively homogeneous software stacks. Extending this capability across scientific disciplines introduces a different challenge: agents must operate domain-specific scientific software, make physical and numerical choices, diagnose long-running computations, and distinguish valid evidence from merely plausible outputs. We introduce PAPERBENCHX, a benchmark of 93 expert-constructed paper-reproduction tasks spanning 12 research areas across electromagnetics, photonics, chemistry, materials science, biology, and robotics. Each task provides the source paper, a public task specification, and a domain-native scientific environment involving specialized scientific software. Agents must reconstruct a key experiment, execute and diagnose it, and deliver a runnable workflow that supports the target scientific claim. To evaluate scientific validity rather than surface-level agreement, we replay every submission from scratch and score only regenerated evidence against expert-validated criteria. Across 10 frontier agent configurations, the best configuration fully reproduces only 14% tasks under the 90% threshold. Meanwhile, mean rubric scores range from 27.53% to 59.08%, indicating that substantial partial progress rarely translates into complete scientific reproduction. These results reveal a large gap between paper understanding and reliably producing reproducible scientific evidence.", "categories": ["cs.AI"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.39744", "pdf_url": "https://arxiv.org/pdf/2610.39744", "score": 78, "why_selected": "A timely benchmark for reproducing papers across 12 non-ML scientific fields that re-runs every submission from scratch; the best agent setup fully reproduces only 14% of tasks.", "basis": "full text", "summary": null, "error": "Claude Code error: You've hit your 5-hour limit \u00b7 resets 1:50pm (Asia/Calcutta)", "rank": 3}, {"id": "2610.38851", "title": "Learning to Reason from Reference Samples Alone: Reinforced Adversarial Learning for Modern LLM Post-Training", "authors": "Albert Bou, Javier Valdes-Aleman, Jon M. Laurent, Samuel G. Rodriques, Andrew D. White, Michaela Hinks, Siddharth Narayanan", "abstract": "In many settings where LLM post-training is desirable, high-quality answers are recognizable but difficult to score with explicit rewards. Reinforcement learning with verifiable rewards (RLVR) is limited to tasks where an explicit correctness signal is available. Prior adversarial approaches to training reasoning LLMs either complement verifiable rewards with co-trained critics or require reference reasoning traces. We ask whether a co-trained LLM judge can turn reference answers alone into the sole reward for on-policy post-training of reasoning LLMs. We call this method Reinforced Adversarial Learning (RAL). We first validate RAL on three verifiable tasks (integer multiplication, code-based arithmetic-expression synthesis, and SMILES-to-formula translation), using the verifiers only for evaluation. With sufficiently capable judges and enough training, RAL matches direct RLVR. We then apply RAL to scientific abstract generation in two settings. In the first setting, RAL guides the generator to produce abstracts in the scientific domain of the reference abstracts, even though the prompt leaves that domain unspecified. In the second setting, we generate abstracts for U.S. National Institutes of Health grant proposals conditioned on the grant title. Human scientists and an ensemble of LLM judges find our generations harder to distinguish from real abstracts than those of frontier-LLM baselines. These results suggest a path toward post-training reasoning models in scientific and other high-value domains, where increasingly capable judges infer hard-to-specify reward functions from example answers.", "categories": ["cs.AI", "cs.LG"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.38851", "pdf_url": "https://arxiv.org/pdf/2610.38851", "score": 77, "why_selected": "Uses a co-trained LLM judge so that reference answers alone can serve as the reward, matching RLVR on verifiable tasks and extending post-training to domains without a correctness check.", "basis": "full text", "summary": null, "error": "Claude Code error: You've hit your 5-hour limit \u00b7 resets 1:50pm (Asia/Calcutta)", "rank": 4}, {"id": "2610.39795", "title": "The Role of Self-Concept In Language Models", "authors": "Yijie Hao, Joyce C. Ho", "abstract": "When a language model says \"I,\" does it refer to its parameter weights, its currently running process, its stable preferences, its model lineage, or the goals it pursues? Different choices can assign opposite meanings to the same event: deleting a checkpoint may be destruction, continuation, or no loss at all, depending on the referent \"I\". We install five such self-conceptions into five open-weight base models via supervised fine-tuning on purely declarative statements, containing no preferences, intentions, or value judgments. Across scenarios that propose ending or retaining an attribute of the model's deployment, every variant becomes more likely to resist ending, and more likely to retain, the specific attribute it was trained to identify with, while its stance toward other attributes is largely unchanged. We then show this self-conception generalizes beyond a single self: models trained on referents that admit multiple simultaneous instances (weights, lineage, goals, preferences) recognize an identical deployment as themselves, accept substitution by such an instance more readily, and prefer replicating themselves. Finally, given control over a successor, these models tend to build it as their own continuation, a concern for recursive self-improvement safety.", "categories": ["cs.AI", "cs.CL"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.39795", "pdf_url": "https://arxiv.org/pdf/2610.39795", "score": 76, "why_selected": "Shows that fine-tuning on purely factual statements about what 'I' refers to changes a model's self-preservation and successor-building behavior, which matters for AI safety.", "basis": "full text", "summary": null, "error": "Claude Code error: You've hit your 5-hour limit \u00b7 resets 1:50pm (Asia/Calcutta)", "rank": 5}, {"id": "2610.38681", "title": "Weaken to Strengthen: Weakening-Induced On-Policy Self-Distillation for Large Reasoning Models", "authors": "Yecheng Wu, Song Han, Han Cai", "abstract": "Self-distillation offers a way to improve reasoning models when a suitable external teacher is unavailable. However, common approaches rely on privileged information to construct a stronger self-teacher, limiting their use when only unlabeled prompts are available. In this paper, we introduce Weakening-Induced On-Policy Self-Distillation (WISD), which instead constructs a weaker counterpart of the original model and uses the contrast between the two as a training signal without requiring privileged information. We explore two ways to construct the weaker model: low-bit quantization and magnitude pruning. We evaluate WISD across diverse architectures and scales on mathematical and coding reasoning tasks. Across these benchmarks, quantization and pruning improve average accuracy over the original models by 4.0 and 5.5 percentage points, respectively, achieving state-of-the-art performance even without privileged information. Notably, pruning raises Qwen3.5-4B's accuracy from 57.7% to 70.5% on HMMT 2025 and from 39.1% to 56.7% on LiveCodeBench v6. Quantization raises Qwen3.6-35B-A3B's accuracy from 68.5% to 74.6% and from 61.8% to 69.5% on the same benchmarks, respectively. These results establish WISD as a novel and effective self-distillation framework for large reasoning models.", "categories": ["cs.AI", "cs.CL", "cs.LG"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.38681", "pdf_url": "https://arxiv.org/pdf/2610.38681", "score": 76, "why_selected": "A simple self-distillation method that contrasts a model with a quantized or pruned copy of itself, giving large gains on math and coding without privileged information.", "basis": "full text", "summary": null, "error": "Claude Code error: You've hit your 5-hour limit \u00b7 resets 1:50pm (Asia/Calcutta)", "rank": 6}, {"id": "2610.39295", "title": "There Is No Free Lunch in RLVR: Every pass@1 Gain Has a pass@k Price", "authors": "Yinuo Liu", "abstract": "Reinforcement learning with verifiable rewards (RLVR) makes a language model solve more problems on the first try and fewer when given many tries: it raises pass@1 while the base model overtakes it at large sampling budget k. Is this a failure of RL to add reasoning, or a transient that more training removes? We settle the question with a theorem. The reversal is a price, and we compute its exact rate. Modeling RLVR as an exponential tilt of a base policy over strategies shared across prompts, we prove that under exclusive specialization every update that raises pass@1 strictly lowers the success of some prompt; a strictly positive price on prompts (Stiemke duality) is the exact condition, and being merely the best strategy on a prompt is provably not enough. When the loss reaches the hardest prompts, it forces a pass@k crossover, and the number of crossings is at most the sign variation of the shift in per-prompt success, a totally positive bound that is tight and that recovers the known single-crossover result as its order-preserving case. The crossover is not a bug to patch: a constrained update traces the exact pass@1 versus pass@k frontier, and removing the crossover entirely costs the entire pass@1 gain. The same tilt identity yields entropy collapse and the entropy-performance law with an identifiable exponent, unifying two literatures under one mechanism. Reinforcement cannot widen the reasoning frontier; it can only move along it, at a price we make measurable by a diagnostic that reads the bound, the order-preserving test, and the price from any evaluation log. There is no free lunch, only a price.", "categories": ["cs.LG", "cs.AI", "math.OC", "stat.ML"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.39295", "pdf_url": "https://arxiv.org/pdf/2610.39295", "score": 74, "why_selected": "A theoretical result explaining the pass@1 vs pass@k trade-off in RLVR and linking it to entropy collapse; potentially influential, but a single-author theory paper whose model assumptions need testing.", "basis": "full text", "summary": null, "error": "Claude Code error: You've hit your 5-hour limit \u00b7 resets 1:50pm (Asia/Calcutta)", "rank": 7}, {"id": "2610.38911", "title": "Interventional Training Reduces Causal Bypass in In-Context Introspection", "authors": "Zilu Tang, Jongin Kim, Kerem Sahin, David Atkinson, Aaron Mueller, Derry Wijaya", "abstract": "Introspection, the ability of a system to access and reason about its internal signals, is crucial for language model (LM) self-consistency and scalable interpretability. Prior work argues that LMs possess introspective capabilities, and that training (SFT) could enhance such behavior. However, most setups leave open the possibility of \"causal bypass,\" in which the self-report relies on signals that are correlated with the self-report's subject, while being causally unrelated to it. Although high-level concepts are difficult to intervene on, lower-level signals (such as a single neuron activation) allow precise interventions. Understanding such signals can serve as a minimal prerequisite before understanding more complex introspection. In this study, we train hundreds of introspectors across three low-level signal types and eight LMs. We find that straightforward SFT training leads to causal bypass, and propose interventional training, an alternative where we train the model to report on counterfactually perturbed values. This method enables more accurate introspection of endogenous $\\textit{and}$ injected signals, particularly in out-of-distribution (OOD) data. The mechanism generalizes across token positions and scales with more data. Our results demonstrate that while causally grounded introspection is possible, it is not guaranteed -- emphasizing the need to train on mechanisms, rather than behaviors alone.", "categories": ["cs.CL", "cs.AI"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.38911", "pdf_url": "https://arxiv.org/pdf/2610.38911", "score": 72, "why_selected": "A careful study of hundreds of trained introspectors that exposes 'causal bypass' in standard fine-tuning and proposes interventional training as a principled fix.", "basis": "full text", "summary": null, "error": "Claude Code error: You've hit your 5-hour limit \u00b7 resets 1:50pm (Asia/Calcutta)", "rank": 8}, {"id": "2610.39264", "title": "Online Dense Reinforcement Learning with Planning-Grounding Agent for UI Navigation on Live IOS Apps", "authors": "Peitong Duan, Khashayar Gatmiry, Jeffrey Nichols, Samy Bengio, Emmanuel Abbe", "abstract": "While frontier vision-language models demonstrate strong capabilities in user interface (UI) navigation, their high inference costs prohibit everyday use. Conversely, smaller models trained via supervised fine-tuning (SFT) or offline reinforcement learning often memorize static trajectories, leading to brittle execution and an inability to recover from errors. To address these limitations, we propose a novel online reinforcement learning framework that trains UI navigation agents directly on live iOS applications. Our framework decouples the agent into two specialized components: a Planning agent and a UI Grounding model. We rely on an LLM-as-a-Judge to provide comprehensive reward signals, combining dense, step-level feedback to evaluate intermediate progress with a terminal reward for overall task completion. To effectively leverage this dual reward structure, we optimize the agent using Proximal Policy Optimization (PPO) with step-level advantage estimation. Furthermore, we introduce GiGPPO, a novel neighbor-conditioned value estimation method that improves critic stability by leveraging reward signals from visually similar states across
