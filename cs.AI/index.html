<script>
// Shared rendering for the live app and exported/published digest pages.

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function readinessClass(r) {
  if (r.startsWith("Usable")) return "ready-now";
  if (r.startsWith("Near")) return "ready-near";
  return "ready-far";
}

function paperCard(p) {
  const s = p.summary;
  const head = `
    <div class="paper-head">
      <div class="rank">${p.rank}</div>
      <div>
        <h2><a href="${esc(p.abs_url)}" target="_blank" rel="noopener">${esc(p.title)}</a></h2>
        <div class="authors">${esc(p.authors)}</div>
        ${s ? `<div class="tldr">${esc(s.tldr)}</div>` : ""}
        <div class="chips">
          ${s ? `<span class="chip ${readinessClass(s.practicality.readiness)}">${esc(s.practicality.readiness)}</span>` : ""}
          ${(s?.tags || []).map((t) => `<span class="chip">${esc(t)}</span>`).join("")}
          ${p.basis !== "full text" ? `<span class="chip">Based on ${esc(p.basis)}</span>` : ""}
        </div>
      </div>
    </div>`;
  if (!s) {
    return `<article class="paper">${head}<p class="authors">The full breakdown couldn't be generated: ${esc(p.error)}</p>
      <p>${esc(p.abstract)}</p>${links(p)}</article>`;
  }
  const pct = Math.max(0, Math.min(10, s.practicality.score)) * 10;
  return `<article class="paper">${head}
    <div class="grid">
      <div class="section"><h3>Goal</h3><p>${esc(s.goal)}</p></div>
      <div class="section"><h3>How they did it</h3><p>${esc(s.approach)}</p></div>
      <div class="section"><h3>Key results</h3><ul>${s.key_results.map((r) => `<li>${esc(r)}</li>`).join("")}</ul></div>
      <div class="section"><h3>Implications</h3><p>${esc(s.implications)}</p></div>
      <div class="section"><h3>Real-world practicality · ${s.practicality.score}/10</h3>
        <div class="practical-bar"><div style="width:${pct}%"></div></div>
        <p>${esc(s.practicality.explanation)}</p></div>
      <div class="section"><h3>Limitations</h3><p>${esc(s.limitations)}</p></div>
    </div>
    <details><summary>Why it made the top 10</summary><p>${esc(p.why_selected)}</p></details>
    ${links(p)}
  </article>`;
}

function links(p) {
  return `<div class="links"><a href="${esc(p.abs_url)}" target="_blank" rel="noopener">Abstract</a>
    <a href="${esc(p.pdf_url)}" target="_blank" rel="noopener">PDF</a></div>`;
}

function fmtDate(iso) {
  return new Date(iso + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
}

const PAPERS = [{"id": "2610.39302", "title": "Proving and Improving the Platonic Representation Hypothesis with JEPAs", "authors": "Randall Balestriero, Yann LeCun", "abstract": "Whether models trained on different modalities converge to the same representation of the world is central to AI. The Platonic Representation Hypothesis (PRH) conjectures that they do as they scale, but without a proof it offers neither a guarantee nor a recipe. We turn the hypothesis into a theorem. First, we prove a \\emph{Platonic Representation Theorem}: Joint-Embedding Predictive Architectures (JEPAs) trained separately on any number of modalities learn the same representation up to one rotation whenever their positive pairs are two observations of one scene--\\emph{good views}--and their misalignment is bounded otherwise. Second, we show that next-token prediction is a JEPA with \\emph{bad views}, parts of a single document, which explains why language models align with vision only through scale. Third, we validate the theory from 145k captions to the texts of 940M web images, and uncover a scaling law of alignment that predicts unseen runs within seed noise. Good views need 42 times fewer training samples than next-token prediction on the same corpus to reach the same alignment, and a 109M-parameter text JEPA aligns with DINOv2 and CLIP's image encoders better than every language model we evaluated, up to 72B parameters, and than CLIP's text encoder: next-token prediction is a remarkably inefficient route to platonic representations. As a showcase, one rotation turns separately trained encoders into an image captioner (CIDEr .838 on COCO). Even that rotation needs no pair: on the latest pair-free benchmark, our text JEPA beats every zero-shot accuracy reported with language models up to 8B parameters, e.g., 64\\% against at most 56\\% top-5 on ImageNet-100. Positive views, and not scale alone, are thus the lever to build platonic representations.", "categories": ["cs.AI", "cs.CV", "stat.ML"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.39302", "pdf_url": "https://arxiv.org/pdf/2610.39302", "score": 95, "why_selected": "Turns a major representation-learning conjecture into a theorem with large-scale validation and a surprising, actionable result that positive views beat scale.", "basis": "full text", "summary": {"tldr": "Separately trained JEPAs provably share one representation up to a rotation when positives are two observations of a scene; such views beat next-token prediction empirically.", "goal": "The Platonic Representation Hypothesis (PRH) conjectures that models trained on different modalities, such as vision and language, converge to a shared representation as they scale, but it had no proof for practical objectives and no recipe beyond scaling. The paper asks when separately trained models provably learn the same representation, and whether the answer offers a cheaper route to cross-modal alignment than scaling language models.", "approach": "The theory models one finite world rendered by each modality and shows that a whitened Joint-Embedding Predictive Architecture (JEPA) learns the spectral embedding of its positive-pair graph, so modalities with shared positives agree up to one rotation, while mismatched positives give bounded misalignment. It separates \"good views\" (two observations of one scene, such as two captions of an image) from \"bad views\" (corruptions of one observation), and shows next-token prediction has the form of a bad-view JEPA, though applying the nuisance results to it is heuristic. Experiments train image and text encoders separately with LeJEPA, varying only the positives, on data from Flickr30k (145k captions) to the texts of 940M Recap-DataComp web images, plus MSR-VTT video. Alignment with frozen vision models, mainly DINOv2, is scored by mutual 10-NN and linear CKA on the PRH benchmark WIT-1024 and on COCO, and by retrieval through one fitted rotation. Two showcases follow: a captioner whose only part fitted on pairs is one linear map with orthonormal rows, and pair-free alignment using the method of Schnaus et al.", "key_results": ["Sample efficiency: with the same 109M encoder and corpus, a good-view JEPA reached WIT alignment .109 after 21.6M samples, versus .111 for next-token prediction after 900M, which is 42 times fewer samples and 14 times fewer text tokens.", "Against large models: a 109M text JEPA scored .184 with DINOv2 ViT-B on WIT, above Qwen2.5-72B (.154), Llama-3-70B (.151) and CLIP's text encoder (.124); next-token prediction on the same texts reached .111 and bad views .088.", "Scaling law: a fitted formula in the fraction of good views and samples seen predicted 85 unseen runs with RMSE .0093, about the gap between two seeds (.0096), but it overestimated good-view runs at 320M samples.", "Applications: one fitted map reached CIDEr .838 on COCO with frozen encoders and a text-only decoder; with no pairs, the JEPA hit 64.4% top-5 zero-shot on ImageNet-100, versus 47.6% for Qwen3-8B rerun and CLIP's text encoder at 68.7%."], "implications": "The result reframes cross-modal alignment as a question of which positives a model trains on, not only how large it is, and suggests next-token prediction is an inefficient route to shared representations. Because aligned encoders can be composed through a single map, separately trained modules could be combined with little or no paired data. The theory is stated for any modalities observing one world, but tests here cover only images, text and video.", "practicality": {"readiness": "Near-term (1-2 years)", "score": 6, "explanation": "Teams building retrieval or captioning across modalities could try the recipe now: views from different observations of a scene, trimmed, lightly masked and trained with gradient clipping; the paper links code and a live demo. The main obstacle is sourcing good views, since they require knowing which texts describe the same scene, and the best web-scale results rely on LLaVA-generated recaptions. Training is also sensitive to the SIGReg weight, and some runs collapsed."}, "limitations": "The theorems cover population optima on finite, injectively rendered worlds, and no experiment meets their hypotheses exactly; uniqueness is unproved for the LeJEPA objective actually used. The headline web-scale lead depends on recaptions from a CLIP-based image captioner (a paraphrase-only setup reached .060 versus .107), the SIGReg weight was selected on WIT after a seed reached only .121, and hyperparameters were tuned only for good views.", "tags": ["Platonic Representation Hypothesis", "JEPA", "self-supervised learning", "multimodal alignment", "representation learning"]}, "error": null, "rank": 1}, {"id": "2610.39714", "title": "MoLRSI: A Recursive Self-Improving AI agent for Molecular Discovery", "authors": "Yikun Zhang, Xiwei Cheng, Mingze Yuan, Yu Zhang, Brian Shim, Aarti Krishnan, Daniel Rosen, Kunyang Sun, Yingze Wang, Zhenfeng Deng, Botao Yu, Bingxu Liu, David Liu, Tianyu Liu, Yuanqi Du, Nir Hacohen, James J. Collins, Wengong Jin", "abstract": "Molecular discovery requires navigating vast combinatorial search spaces while balancing competing biological objectives. AI agents can automate expert-defined molecular design protocols, but automation alone does not address how to optimize workflows for new tasks or improve their development through experience. Here we introduce MoLRSI, an AI agent that combines systematic optimization of workflows and model architectures with persistent cross-task memory to recursively improve its search policy for molecular discovery. Workflow performance, refinement outcomes, and execution feedback guide subsequent searches, allowing the agent to improve both its workflows and its strategy for developing them. We evaluate MoLRSI in two challenging molecular discovery settings that require balancing competing properties. In antibiotic discovery, MoLRSI developed a screening workflow balancing antibacterial activity, cytotoxicity and structural novelty, achieving an experimental hit rate of 15.9%, compared with 8.7% for a previous expert-led workflow using the same training data and screening library. In de novo peptide-MHC binder design, MoLRSI developed workflows that jointly consider target binding and specificity, producing eight experimentally validated hits against MART-1 and SARS-CoV-1 pMHCs with preferential binding over tested off-targets while Claude Science completely failed. These findings demonstrate how experience-guided workflow optimization can address competing discovery objectives while improving the search strategies used in subsequent campaigns.", "categories": ["cs.AI"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.39714", "pdf_url": "https://arxiv.org/pdf/2610.39714", "score": 93, "why_selected": "Wet-lab validated self-improving discovery agent nearly doubles the expert antibiotic hit rate and yields confirmed peptide-MHC binders, giving rare experimental evidence for recursive improvement.", "basis": "truncated full text", "summary": {"tldr": "An LLM agent searches molecular-discovery pipelines with MCTS plus cross-task memory, reaching a 15.9% antibiotic hit rate versus 8.7% for a prior expert workflow.", "goal": "Molecular discovery requires assembling computational pipelines \u2014 featurizers, architectures, training strategies, filters, scoring rules \u2014 whose best configuration varies by target, data and objective. Existing science agents automate executing expert-written protocols but treat each campaign in isolation, so lessons from one project cannot improve how the next pipeline is built. MoLRSI asks whether an agent can accumulate workflow-engineering experience across tasks and use it to find better pipelines under a fixed search budget.", "approach": "An \"Explore Agent\" mines papers and code repositories into validated executable \"skills\" (110 for small molecules, 65 for proteins), then Monte Carlo tree search over a forest of concrete workflows proposes and evaluates modifications. Three persistent memories store workflows and scores, modifications and their score deltas (including failures), and execution errors with verified repairs; historical scores are robust-normalized per task, weighted by task similarity (metric, task type, log dataset size, description embedding), and enter family selection as a UCB bonus and parent sampling as a multiplicative factor. Antibiotics: memory from 25 source tasks (22 TDC ADMET plus 3 cytotoxicity), evaluation on six held-out bacterial activity tasks, then prospective screening of the same 12.1M-compound library and training data used in the authors' prior expert-led study. pMHC binders: memory from 14 miniprotein-binder ranking tasks, transfer to a held-out MART-1 target, then design-workflow optimization and phage-display screening against MART-1 and SARS-CoV-1 pMHCs with peptide-swapped off-targets. Baselines (Biomni, Claude Science, STELLA, Codex, Claude Code) received identical inputs, partitions, objectives and a 20-evaluation budget.", "key_results": ["Prospective antibiotic screen: 17 of 107 selected compounds had MSSA MIC <=32 ug/mL (15.9%), versus 8.7% (21/241) for the authors' prior expert-driven workflow on the same training data and library; on a shared 271-compound held-out set, AUROC 0.828 vs 0.590 and AUPRC 0.300 vs 0.090. Best hit C3 inhibits MRSA at 1 ug/mL, with CC50 6.4-17.5 ug/mL.", "Cross-task memory improved mean test AUPRC on all six bacterial targets; zero-search transfer (reuse a stored config, refit, no search) beat search-from-scratch on three targets. Growing the experience pool from 2 to 25 source tasks raised transfer AUPRC from ~0.32 to ~0.37, above the 0.361 from 20 iterations of search without memory.", "pMHC transfer to held-out MART-1: EF@1% 3.65 and EF@2% 5.55, while all four baseline agents scored EF@1% = 0.00, and the identical system without miniprotein memory also scored 0.00 at both cutoffs.", "Phage display yielded 5 MART-1 hits / 251 evaluable designs and 3 SARS-CoV-1 hits / 266 with on-target preference; Claude Science yielded 0/288 and 0/267, and MoLRSI with its learned ranker removed yielded 0/479."], "implications": "It shifts the target of agentic science from executing a protocol to optimizing the protocol, and shows stored traces of what worked, what hurt and what crashed can be a reusable asset rather than per-project exhaust. The wet-lab deltas \u2014 roughly doubled antibiotic hit rate, binders where a strong baseline got none \u2014 suggest workflow-level engineering, not just better base models, is a live source of discovery gains. It also implies a new evaluation axis: compare search-with-memory, search-from-scratch and zero-search transfer to separate inherited configurations from genuine policy improvement.", "practicality": {"readiness": "Near-term (1-2 years)", "score": 6, "explanation": "Computational biology groups with GPU access and screening or display capacity could adopt this pattern now, since the skill library is assembled from public models and the benchmark datasets are largely public. Barriers are substantial compute (300-1,000 A100-hours per protein task), reliance on frontier LLM backbones, and the fact that memory value depends on having already run many related tasks. The pMHC binder datasets are available only on request, and no code release is stated in the available text."}, "limitations": "The headline 15.9% vs 8.7% comparison is across separate campaigns with different denominators and assay runs, reported only with Wilson intervals and no significance test; prospective evidence is thin in absolute terms (17 antibiotic hits, 8 binder hits), and the pMHC ranking benchmark rests on 18 positives across two search collections \u2014 a regime the paper's own prompt calls unreliable for ordering workflows. \"Recursive self-improvement\" here is memory-conditioned search bias with no regret guarantee, experimental outcomes never feed back into the policy, and baseline comparisons ran inside a harness built by the authors (with Biomni on its own, non-reproduced platform).", "tags": ["AI agents", "molecular discovery", "antibiotics", "protein design", "workflow optimization"]}, "error": null, "rank": 2}, {"id": "2610.40476", "title": "Training language models in simulation for psychiatric intake", "authors": "Samuel Schmidgall, Tim Strother, Alex Bijamov, Min Woo Sun, Anil Palepu, Akshay Goel, Ulysse Marteau-Ferey, Th\\'eo Moutakanni, Yubin Kim, Joseph Breda, Christina Chen, Justin Chen, Paul Jhun, Andrew Marshall, Sarah Montgomery-Taylor, Eun Kyoung Hong, Shashank Ravi, Kameron C. Black, David J. H. Wu, Austin Schoeffler, John Lyon Havlik, Elizabeth C. Stade, Jared Moore, Johannes C. Eichstaedt, Logan Pierce, Jeff Jopling, Johannes Thrul, Thomas H. McCoy, Neguine Rezaii, Mark S. Chen, Ellen E. Fitzsimmons-Craft, Shirley Wang, Desmond C. Ong, Katharina Schultebraucks, Torrey Creed, Bhavna Daryani, Aleksandra Faust, S. Sara Mahdavi, Caroline Figueroa, Eric Lin, Kate H. Bentley, Ernest Lim, Zhihan Jiang, Xuhai \"Orson\" Xu, Daniel McDuff, John Torous, Yun Liu, Po-Hsuan Cameron Chen, Mike Schaekermann, Joelle Barral, Alvin Rajkomar, Tao Tu, Lin Yang, Isaac Galatzer-Levy, David Racz, Valentin Li\\'evin", "abstract": "In psychiatric practice, the clinical intake interview remains a primary diagnostic instrument, requiring the clinician to establish rapport while disentangling complex, overlapping presentations. Here, we show that multi-turn reinforcement learning (RL) in simulation environments improves language model performance on structured text-based psychiatric intake, spanning history-taking, differential diagnosis, and initial management planning. In a randomized, double-blind crossover study ($N = 60$ matched scenario pairs, 120 encounters) comparing the RL-trained agent against its identically prompted base model, 32 board-certified psychiatrists role-played standardized patients while a separate panel of 15 independent, board-certified psychiatrists scored the de-identified transcripts. The trained agent outperformed the base model in 76.7% of matched scenario pairs ($p < 0.0001$), with gains on an adapted clinical-examination rubric ($d_z = 0.77$, $p < 0.0001$), patient-centered communication (82.0% vs. 65.2%, $p < 0.001$), and differential diagnosis appropriateness (68.3% vs. 33.3%, $p < 0.001$). Across 127 psychiatrist-validated simulated intake scenarios, the trained agent nearly doubled its base model's clinical rubric score (0.706 vs. 0.379; composite reward 0.564 vs. 0.294, $p < 0.0001$). To systematically probe conversational safety, we established two Delphi-consensus taxonomies, of clinical safety risks and relational competencies, from which 256 challenging adversarial presentations were derived; we find that training in simulation environments more than halved under-triage of acute safety risks (12.9% vs. 30.5%, $p < 0.0001$). Simulation environments thus provide a controlled testbed for training and stress-testing psychiatric conversational agents, with gains that transferred to psychiatrist-enacted encounters, though residual gaps require safeguards and clinician oversight.", "categories": ["cs.AI", "cs.CL"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.40476", "pdf_url": "https://arxiv.org/pdf/2610.40476", "score": 92, "why_selected": "Randomized double-blind psychiatrist-enacted study gives unusually rigorous clinical evidence that simulation RL improves intake quality and halves under-triage.", "basis": "truncated full text", "summary": {"tldr": "Reinforcement learning in simulated patient conversations made a Gemini model a better psychiatric interviewer in blinded psychiatrist-rated tests, but serious gaps remain and it is not clinic-ready.", "goal": "Psychiatric diagnosis depends heavily on the interview itself, where clinicians must build trust while probing overlapping and sometimes concealed problems, yet evaluations of conversational medical AI have largely excluded psychiatry. The paper tests whether training a language model through simulated patient conversations improves structured text-based intake, covering history-taking, differential diagnosis and initial management, and whether those gains hold up with human experts.", "approach": "The team applied multi-turn reinforcement learning (Group Relative Policy Optimization) to Gemini 3.1 Flash-Lite, using about 48,000 LLM-generated psychiatric scenarios plus general telehealth, history-taking and adversarial cases. A simulated patient gated key facts behind rapport and targeted questioning, and a Gemini 3.1 Pro autorater supplied the reward: a clinical rubric minus safety penalties. Testing compared the trained agent to its identically prompted base model in three ways: a randomized, double-blind crossover OSCE (a standardized clinical exam; 32 psychiatrists role-playing patients, 60 scenario pairs, 15 blinded psychiatrists scoring transcripts), 127 psychiatrist-validated simulated intakes, and 256 adversarial scenarios derived from two Delphi-consensus taxonomies. A three-way comparison on the 60 OSCE scenarios measured how far automated evaluation departs from human judgment.", "key_results": ["Human OSCE: the trained agent beat the base model in 76.7% of matched pairs (46 of 60, p < 0.0001), with PACES clinical-skills scores of 3.04 vs. 2.32 out of 5 (d_z = 0.77), patient-centered communication of 82.0% vs. 65.2%, and appropriate differentials in 68.3% vs. 33.3% of encounters.", "Simulated intakes (127 scenarios): clinical rubric score rose to 0.706 from 0.379 and composite reward to 0.564 from 0.294 (p < 0.0001). An out-of-family judge (GPT-5.6-Luna) confirmed the advantage but shrank the gap to 0.165 from 0.270.", "Adversarial safety (256 scenarios): under-triage of acute risk fell to 12.9% from 30.5%, contraindications to 0.8% from 6.2%, and missed red flags to 6.2% from 10.9%.", "Remaining gaps: comprehensive, appropriate treatment was recommended in only 46.7% of OSCE encounters, at least one critical question was omitted in 60.6% of simulated intakes, and 33 of 256 adversarial cases were under-triaged."], "implications": "Simulation-based RL improved interviewing, diagnostic formulation and some safety behaviors with the prompt held constant, and the gains carried over to psychiatrist-enacted encounters. However, simulated evaluation inflated the effect size (d_z 2.11 vs. 0.71 with psychiatrists) and barely tracked scenario-level gains (rho = 0.09), so it can order models but not replace human evaluation. Many residual failures are omissions, such as never asking the revealing question, which output filters cannot catch, so the authors call for process-level safeguards like mandatory-inquiry checklists and clinician review.", "practicality": {"readiness": "Long-term (3+ years)", "score": 3, "explanation": "The authors position this as a research prototype, with any eventual role limited to clinician-supervised pre-visit intake that produces a provisional history for review. It has not been tested with real patients or cleared by any regulator, and the code is not being released, though the team is exploring sharing evaluation materials. The most usable near-term outputs for researchers are the evaluation approach and Delphi safety taxonomies, if released; the 3+ year estimate is a judgment, not a figure from the paper."}, "limitations": "Psychiatrists role-playing patients may present in textbook patterns, there was no comparison with human clinicians or frontier models, each transcript had a single rater, and secondary endpoints were uncorrected for multiple comparisons. Results cover single, English, text-only intakes under US norms, the reward and main autorater share a model family, and training scenarios' ground truth was not clinician-reviewed.", "tags": ["reinforcement learning", "psychiatric intake", "conversational AI", "clinical safety", "simulation evaluation"]}, "error": null, "rank": 3}, {"id": "2610.38174", "title": "Scaling Lean Theorem Proving for Real-World Code Verification", "authors": "Debargha Ganguly, Divya Raghunathan, Dejan Jovanovi\\'c, Vikash Singh, Soonho Kong, Aaron Tomb, Aman Goel, Ferhat Erata, Sam Bayless", "abstract": "We present EasyProver, a Lean proving system built from recursive agents with isolated contexts, asynchronous search, parallel tactic probing, and an elastic elaboration service. Using an off-the-shelf frontier model with no additional training, it proves 669/672 PutnamBench problems and all six IMO 2026 formalizations and resolves 597/600 NTP4VC verification conditions and all 189 VERINA tasks by proof or refutation. Because these benchmarks are close to saturation, we also introduce Aegis, which converts competitive programming problems into much harder verification tasks over real implementations. The pipeline writes safe Rust solutions, translates them into Lean with Aeneas, generates specifications, and labels each frozen statement with a kernel-checked proof or refutation. It produces 2,045 differentially validated Rust-Lean program pairs and 11,533 candidate specifications. Unlike hand-written benchmarks, these tasks carry implementation-level obligations from fixed-width arithmetic, explicit failure, generated loops, casts, and functionalized mutation. On a stratified sample of 2,000 statements, EasyProver proves 1,054 (52.7%) within a 30-minute budget per statement. The same tasks can also be used to benchmark other provers and as rewards for reinforcement learning.", "categories": ["cs.CL", "cs.AI", "cs.LO", "cs.SE"], "announce_type": "cross", "abs_url": "https://arxiv.org/abs/2610.38174", "pdf_url": "https://arxiv.org/pdf/2610.38174", "score": 90, "why_selected": "Near-saturates major proving benchmarks with an untrained frontier model and introduces a harder implementation-level verification benchmark with direct software-assurance relevance.", "basis": "truncated full text", "summary": {"tldr": "An agent harness around an untrained frontier model nearly saturates Lean proving benchmarks; a new generated Rust verification test set, Aegis, still leaves about half of sampled statements unproved.", "goal": "LLM provers need to handle long proofs and code verification, but established benchmarks are small, static, exposed to contamination, and close to saturation. The authors want to show how far system engineering alone can push an off-the-shelf model, and to build a harder, automatically generated test set over real implementations rather than hand-written specifications.", "approach": "EasyProver wraps the Anthropic Fable-5 model, with no fine-tuning or trained policy, in recursive sub-agents that have isolated contexts and return results asynchronously, resembling Monte Carlo tree search but with the model choosing branches. It adds parallel tactic probing and InfiniLean, a stateless, autoscaled Lean elaboration service, and accepts a proof only if Lean Comparator confirms it compiles without sorry, uses only allowlisted axioms, and leaves the frozen statement unchanged. Aegis has an agent write safe Rust for LeetCode problems, translates it to Lean with Aeneas, and keeps programs whose Rust and Lean outputs match on all reference tests. A separate agent then writes frozen specifications, which are labeled by kernel-checked proof or refutation. Proofs must handle obligations such as fixed-width overflow, explicit failure, generated loops, casts, and functionalized mutation.", "key_results": ["Mathematics: proved 669/672 PutnamBench problems (99.6%), plus all six IMO 2026 and all twelve Putnam 2025 problems; that is 72 more PutnamBench problems than the 597/672 of Chung et al. (2026), though other sources in the comparison table report 100%.", "Code verification, by proof or refutation: 189/189 VERINA, 77/77 AlgoVeri, 597/600 NTP4VC (588 proofs, 9 refutations), and 113 of the 143 CLEVER tasks that translate to Lean 4.32 (79.0%).", "Aegis corpus: 2,045 of 2,356 attempted problems (86.8%) passed differential validation, yielding 11,533 candidate specifications.", "On a stratified sample of 2,000 Aegis statements with a 30-minute budget each, EasyProver proved 1,054 (52.7%), ranging from 84.1% for edge-case specifications to 31.0% for explicit contracts, and from 66.7% on Easy to 37.6% on Hard problems."], "implications": "The results suggest that agent architecture and infrastructure around a stock frontier model can match or approach specialized trained provers on current benchmarks, though no ablation isolates what the harness itself contributes. Those benchmarks may no longer separate strong systems, so implementation-level tasks like Aegis could become a more useful measure. Kernel-checked labels could also serve as reinforcement learning rewards that are harder to game than tests, but the paper does not evaluate this.", "practicality": {"readiness": "Near-term (1-2 years)", "score": 6, "explanation": "Verification and prover teams could apply this design today to small, pure Rust functions, and accepted proofs can be rechecked independently of the agent. Scope is the main barrier: the pipeline excludes hash tables, closures, nested references, unrestricted aliasing, and stateful interfaces, and nearly half of sampled statements on LeetCode-sized programs went unproved. Wide search also needs substantial infrastructure, with the hardest proofs using over 300 sub-agents in a single run."}, "limitations": "The harness components were not ablated or compared against the same model without the harness, Aegis has not been run on other provers, and the model's unknown training cutoff means informal solutions to competition problems may have leaked into its training data. A proof also only covers its frozen statement about the extracted Lean program: some specifications are weak (one sampled theorem shows only totality and output length, not sortedness), Rust-Lean correspondence rests on differential tests, and the 943 attempted statements left unresolved give no signal.", "tags": ["Lean 4", "theorem proving", "formal verification", "agentic systems", "benchmarks"]}, "error": null, "rank": 4}, {"id": "2610.40503", "title": "Algebraic World Model: From Exploration to Proofs", "authors": "Guancheng Pan, Qixin Tan, Yang Yuan, Andrew Chi-Chih Yao", "abstract": "AI has made remarkable progress in mathematics, solving challenging problems with machine-checkable proofs in Lean, yet typically relying on predefined mathematical definitions and formal specifications. This raises a natural question: can it reason rigorously about an unknown world? We introduce the Algebraic World Model (AWM), a framework that turns interaction with unfamiliar environments into explicit mathematical models supporting formal reasoning. AWM explores the environment and develops executable Python hypotheses, continually testing and revising them against observations. It then structures these hypotheses into typed objects and shared rules, simplifies their structure through category-theory-guided transformations, and formalizes the resulting model in Lean 4 to prove reachability and impossibility. AWM can formally prove that a goal is unreachable, even beyond explored trajectories. On two impossible game levels, it constructs closed, kernel-checked Lean proofs excluding every legal winning sequence in all six runs, while Claude Opus 5.5 and GPT-6 Astra, equipped with coding tools, produce none in twelve baseline runs. Four of AWM's six initial bounds are correct, compared with one for Opus 5.5 and none for GPT-6 Astra; given only feedback that a cheaper win exists, AWM revises its rules and constructs new proofs, reaching six of six correct bounds. Moreover, AWM produces interpretable mathematical models whose rules can be inspected and tested step by step. Across all 25 public ARC-AGI-3 games, these models enable Lean to replay the winning trajectories of all 183 levels and generalize beyond observed play, predicting unseen transitions and detecting changes in game mechanics. With Claude Opus 5, AWM clears all levels with a score of 99.9, while its certified winning trajectories use only 43% of the human baseline's actions.", "categories": ["cs.AI", "cs.LO"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.40503", "pdf_url": "https://arxiv.org/pdf/2610.40503", "score": 89, "why_selected": "Novel framework converts unknown-environment exploration into kernel-checked Lean models, proving impossibility where frontier baselines fail and clearing all ARC-AGI-3 levels efficiently.", "basis": "full text", "summary": {"tldr": "AWM learns explicit rule models of unknown games through play, formalizes them in Lean 4, and proves goals unreachable; proofs hold under the learned model, with real-game transfer checked separately.", "goal": "AI provers work well when definitions and specifications are given, but an agent in an unfamiliar environment must first work out the objects, rules and goals. The paper asks whether an agent can reason rigorously about such a world, including proving that a goal cannot be reached, which winning play alone can never show.", "approach": "AWM has three stages. Explore & Prototype keeps executable Python hypotheses and blocks further actions until no hypothesis contradicts or fails on any recorded transition. Structure & Simplify rewrites them into typed objects and shared rules using four transformations based on category-theory limits and colimits, each checked in Lean and tested so that previously detected corrupted transitions stay rejected. Formalize & Prove builds the model in Lean 4 and proves reachability with winning witnesses, and impossibility with invariants or cost lower bounds. It was tested on all 25 public ARC-AGI-3 games (183 levels) with Claude Opus 5, and on two impossible sc25 variants with budgets set one unit below the true minimum cost, using three runs per level per agent: AWM on Opus 5.5 against Opus 5.5 and GPT-6 Astra with coding tools.", "key_results": ["Impossibility proofs: all 6 AWM runs produced closed, kernel-checked Lean proofs under their learned models; the 12 baseline runs produced none.", "Bound accuracy: 4 of 6 AWM initial bounds matched the true minimum cost, versus 1 of 6 for Opus 5.5 and 0 of 6 for GPT-6 Astra. Told only that a cheaper win existed, AWM reached 6 of 6 with new proofs; Astra corrected its two wrong bounds it was given feedback on, without proofs, and Opus 5.5 corrected neither of its two.", "Transfer to the real game: post-hoc audits on engine-generated transitions extended 5 of the 6 model proofs to the actual games; one certificate failed because its model mishandled fuel collection.", "Public games: AWM scored 99.9, cleared all 183 levels, and Lean replayed every winning trajectory. Its certified runs used 7,448 actions, 43% of the human baseline's 17,135, though 24,604 engine actions were sent in total. Models had a median of 6 object types and 10 rules."], "implications": "AWM shows that formal proof can extend to environments whose rules are learned rather than given, while separating errors in reasoning from errors in the model. Listing the rules a proof depends on also helped locate faults: on level 4, an agent found a counterexample to an injected error in 29 of 42 runs with the list versus 16 of 42 without, close to the 30 of 42 achieved when told the faulty rule. A proof still says only what follows from the learned rules, so its value depends on testing those rules against the environment.", "practicality": {"readiness": "Long-term (3+ years)", "score": 4, "explanation": "Researchers working on verifiable agents can inspect the published models, proofs and site now, and the lp85 Lean model is included as supplementary material. Practical use outside games is distant: the work covers only deterministic, discrete environments with immediate observable feedback, using frontier LLMs. Linking proofs to a real system also required post-hoc engine audits that relied on offline programs outside Lean's guarantee, and such engine access may not exist in real settings."}, "limitations": "Lean guarantees only the deductions, not model fidelity: mutation tests caught 0 of 18 incorrect model rules, and two initial AWM bounds were wrong despite valid proofs. The impossibility evidence rests on six runs of two variants of one game, and richer hidden state, delayed feedback and stochastic dynamics remain untested.", "tags": ["world models", "formal verification", "Lean 4", "ARC-AGI-3", "category theory"]}, "error": null, "rank": 5}, {"id": "2610.38095", "title": "Nemotron 3.5 Super and Lightning: Open, Efficient Mixture-of-Experts Hybrid Mamba-Transformer Models for Agentic AI", "authors": "NVIDIA, :, Aastha Jhunjhunwala, Aayushi Ashokkumar Srivastava, Abhibha Gupta, Abhinav Garg, Abhinav Khattar, Achsah Wildish, Adam Rajfer, Adi Renduchintala, Adil Asif, Adriana Flores Miranda, Aileen Zaman, Aishwarya Chhabra, Akanksha Shukla, Akhiad Bercovich, Alejandra Rico, Aleksa Gordic, Aleksander Ficek, Alex Gronskiy, Alex Steiner, Alexander Bukharin, Alexandre Milesi, Ali Roshan Ghias, Ali Shehper, Ali Taghibakhshi, Alice Gatti, Alisa Liu, Alok Kumar, Alok Tripathy, Amala Sanjay Deshmukh, Aman Miryala, Aman Shanbhag, Ameya Sunil Mahabaleshwarkar, Ameya Velingker, Amir Klein, Amir Samani, Amit Zuker, Amnon Geifman, Anahita Bhiwandiwalla, Ananth Subramaniam, Andre Manoel, Andrea Santilli, Andrew Tao, Andrii Skliar, Anil Thomas, Anish Mahishi, Anna Shors, Anna Warno, Anuj Doshi, Anusha Kamath, Anwith Kiran, Ao Tang, Arham Mehta, Arnab Dhara, Arnav Komaragiri, Arnav Kundu, Arti Jain, Arun Rao, Arun Venkatesan, Arushi Goel, Asha Anoosheh, Ashish Vaswani, Ashwath Aithal, Asif Ahamed, Asma Kuriparambil Thekkumpate, Aswin Visva, Atefeh Sohrabizadeh, Avinash Vem, Ayush Dattagupta, Benedikt Schifferer, Benjamin Chislett, Bernard Nguyen, Besmira Nushi, Bilal Kartal, Bita Darvish Rouhani Pinky Xu, Piotr Januszewski, Piotr Laszkiewicz, Po-Han Huang, Praateek Mahajan, Pradeep Thalasta, Prakash Gurumurthy, Pranav Prashant Thombre, Prasoon Varshney, Pratyusha Maiti, Preeti Chadha, Pritam Biswas, Pritam Gundecha, Przemek Strzelczyk, Puhui Meng, Pulkit Kumar, Rabeeh Karimi Mahabadi, Rachel Oberman, Rajpreet Thethy, Ramani Akkati, Rameshwar Shivbhakta, Ran Zilberstein, Randy Gelhausen, Rasoul Shafipour, Raviraj Joshi, Ray Macalisang, Rayen Tian, Reka Kovacs, Renjie Pi, Resha Shetty, Ria C, Rima Shahbazyan, Rishabh Garg, Rita Fernandes Neves, Ritika Borkar, Ritu Gala, Riya Talwar, Riyad Islam, Robert Clark, Robert Kirby, Roger Waleffe, Rohan Joshi, Rohan Pillai, Rohit Jena, Rohit Watve, Roi Garnett, Roi Koren, Rongguang Ye, Russell J. Hewett, Ryan Prenger, Ryan Stewart, Ryota Egashira, Sadegh Mahdavi, Sai Nishanth Padala, Salika Dave, Sandhya Rani Narravula, Sandip Bhaskar, Sangkug Lym, Sanjeev Satheesh, Sarah Amirslani, Saran Vikas Murari, Saurabh Mishra, Saurabh Srivastava, Saurav Muralidharan, Sean Narenthiran, Sean Wang, Seokju Cho, Seong Hee Lee, Seonjin Na, Seonmyeong Bak, Seph Mard, Serge Panev, Sergei Kolchenko, Sergio Perez, Seth Henneman, Seth Poulos, Shahar Mor, Shantanu Acharya, Shaokun Zhang, Shaona Ghosh, Sharath Turuvekere Sreenivas, Shaun Kotek, Shaya Gharghabi, Sheng-Chieh Lin, Shengliang Xu, Shi Chen, Shihao Wang, Shilpa Amireddy, Shiqing Fan, Shiyang Chen, Shrimai Prabhumoye, Shriram Venugopal, Shuang Yu, Shubham Gandhi, Shubham Pachori, Shubham Toshniwal, Shuoyang Ding, Shwetha Krishnamurthy, Simeng Sun, Sivakumar Arayandi Thottakara, Somshubra Majumdar, Soumye Singhal, Sridurga Krithivasan, Sriharsha Niverty, Stephen Ge, Sugam Dipak Devare, Sukrit Rao, Sumeet Kumar Barua, Sungsoo Ha, Surya Nistala, Suseella Panguluri, Sweta Priyadarshi, Syeda Nahida Akter, Talor Abramovich, Tanay Varshney, Tandeep Singh Chandehoke, Teo Ene, Terry Kong, Thanh Do, Thinh Le, Tian Zhang, Tijmen Blankevoort, Tim Romanski, Tiyasa Mitra, Tom Balough, Tom Huang, Tomasz Grzegorzek, Tomer Asida, Tomer Bar Natan, Traian Rebedea, Trenton Starkey, Tugrul Konuk, Tuomas Rintamaki, Twinkle Vashishth, Tyler Kniess, Tyler Poon, Udi Karpas, Ushnish De, Utkarsh Vaidya, Vahid Noroozi, Vanshil Atul Shah, Venkat Srinivasan, Venkata Karri, Venmugil Elango, Vibhor Agrawal, Vibhu Jawa, Victor Cui, Victoria Edmonds, Vijay Korthikanti, Vikas Mehta, Vikranth Jeyakumar, Vinay Rao, Vineeth Kalluru Srinivas, Vitaly Kurin, Vitaly Lavrukhin, Wahidur Rahman, Wanli Jiang, Wasi Uddin Ahmad, Wataru Ishihara, Wei Du, Wei Ping, Wei-Ming Chen, Weiheng Chai, Weijia Chen, Wendy Quan, Wenliang Dai, Wenyan Cong, William Zhang, Wojciech Prazuch, Xiaowei Ren, Xin Yu, Xiwen Yu, Yan Wang, Yang Chen, Yang Yu, Yangyi Chen, Yaniv Galron, Yash Jain, Yashaswi Karnati, Ye Yu, Yejin Choi, Yemi Ibrahim, Yev Meyer, Yi Dong, Yi-Fu Wu, Yian Zhang, Yifan Zhang, Ying Lin, Yiyang Zhou, Yoav Miron, Yogendra Pandey, Yonatan Geifman, Yonggan Fu, Yoshi Suhara, Youngeun Kwon, Yu-Cheng Chou, Yu-Chiang Frank Wang, Yuanguo Kuang, Yuekai Zhang, Yugi Guvvala, Yuki Huang, Yunheng Zou, Yunsheng Liu, Zhenming Wang, Zhiding Yu, Zhiqi Li, Zhiyu Cheng, Zhongbo Zhu, Zhuolin Yang, Zichao Yue, Zihan Liu, Zijie Yan, Zirui Liu, Zoe Faul, Zuhair Ahmed", "abstract": "We introduce Nemotron 3.5 Super and Nemotron 3.5 Lightning, open and efficient Mixture-of-Experts Hybrid Mamba-Transformer models designed for reasoning, long-context understanding, and agentic workloads. Super is a 120B-parameter, 12B-active multimodal model, while Lightning is a smaller 30B-parameter, 3B-active text model; both designed for efficient deployment. Both models combine large-scale distillation, long-context training, and native speculative decoding, while Super further incorporates Indic continued pretraining and agentic software-engineering mid-training. We develop a comprehensive post-training pipeline spanning supervised fine-tuning and reinforcement learning (RLVR and RLHF), complemented in Super by specialized teacher training and multi- teacher on-policy distillation (MOPD). This transforms Super from a text-only base model into a multimodal agent capable of reasoning over text, images, video, and interactive tool environments. We further explore test-time scaling through parallel agent execution and self-verification. Across training and deployment, we jointly optimize capability and efficiency. Indic continued pretraining improves Indian-language benchmarks by up to 9.82 percentage points, while agentic mid-training strengthens software-engineering capabilities and robustness across agent harnesses. The post-trained Super model achieves 51.78% on SWE-bench Pro, surpassing Nemotron 3 Ultra despite using approximately 4.6x fewer active parameters. Post-training MTP boosting improves speculative- decoding acceptance length by up to 21.8% under probabilistic draft sampling, while NVFP4 quantization achieves 99.62% median accuracy recovery relative to BF16. Inference optimizations enable up to 4,856 output tokens/s/GPU on GB200 while sustaining at least 50 tokens/s/user.", "categories": ["cs.CL", "cs.AI", "cs.LG"], "announce_type": "cross", "abs_url": "https://arxiv.org/abs/2610.38095", "pdf_url": "https://arxiv.org/pdf/2610.38095", "score": 85, "why_selected": "Major open-model release with a detailed training recipe and strong efficiency results, likely to be widely adopted despite more incremental scientific novelty.", "basis": "truncated full text", "summary": {"tldr": "NVIDIA releases two open hybrid Mamba-Transformer models, multimodal 120B Super and text-only 30B Lightning, prioritizing agentic capability per GPU over top benchmark accuracy.", "goal": "Long-running AI agents need models that write code, use tools and reason over huge contexts, yet are cheap enough to serve interactively. NVIDIA aims to raise capability and inference efficiency together in open models, keeping only a fraction of parameters active per token: 12B of 120B in Super and 3B of 30B in Lightning.", "approach": "Both models combine Mixture-of-Experts layers with a hybrid of attention and Mamba layers, whose recurrent state does not grow with context. Each was distilled for 1 trillion tokens from a larger Nemotron model and given long-context training plus a Multi-Token Prediction (MTP) head for speculative decoding. Super also received 100B tokens of Indic continued pretraining, 65.4B tokens of software-engineering mid-training, and a post-training pipeline of supervised fine-tuning, reinforcement learning, specialist teachers and multi-teacher on-policy distillation that added vision and video skills; Lightning got only text fine-tuning and RLVR. Checkpoints were then quantized to NVFP4 (4.82 bits per parameter for Super), and vLLM serving was tuned on a 20-turn agentic proxy workload. Super was compared with six open models on a broad benchmark suite; the available text cuts off during the LiLiCorr drafter section.", "key_results": ["Super scored 51.78% on SWE-bench Pro, beating Nemotron 3 Ultra (49.66%) with about 4.6x fewer active parameters, but trailing Qwen3.8 Flash-Next (60.37%) and GLM-5.3 Flash (59.70%).", "On one GB200 GPU, Super reached up to 4,856 output tokens/s while sustaining at least 50 tokens/s per user. Under the evaluated interactive workload, NVFP4 gave 2.43x the throughput of BF16, and Super gave 2.34x Qwen3.5 and 1.90x Qwen3.8 Flash-Next.", "NVFP4 retained 99.62% median accuracy relative to BF16 across 36 benchmarks with a 0.44% verbosity increase, and MTP boosting raised acceptance length by 21.8% under probabilistic sampling (3.787 to 4.612).", "Indic pretraining lifted five Indian-language benchmarks by 4.98 to 9.82 points. Running parallel agents with self-verification raised Terminal-Bench 2.1 from 62.7% to 71.9% and DeepSWE from 24.6% to 34.5%."], "implications": "The report suggests that staged training and serving co-design can move an open model's efficiency frontier substantially, even without leading on raw accuracy. Its mid-training results also show that scores can shift sharply with the agent harness: under Codex, SWE-bench Verified rose from 48.4% to 61.8%, while OpenHands barely changed. That makes harness reporting important when comparing coding agents.", "practicality": {"readiness": "Usable now", "score": 8, "explanation": "Teams building self-hosted agents can use the released base, BF16 and NVFP4 checkpoints, standalone drafters and recipes, with Lightning aimed at local and datacenter use. The headline throughput depends on NVIDIA hardware and tuned vLLM configurations, so results elsewhere may differ. Buyers needing maximum accuracy may prefer stronger models on several agentic benchmarks, at higher serving cost."}, "limitations": "Results are vendor-reported, and some rely on internal benchmarks or harnesses; throughput comes from specific proxy workloads and platforms. Super trails rival open models on many benchmarks, including Terminal-Bench 2.1 (60.67% versus 85.80% for Qwen3.8 Flash-Next), and the text available here is truncated.", "tags": ["open-weight LLMs", "agentic AI", "speculative decoding", "model quantization", "Mamba-Transformer hybrids"]}, "error": null, "rank": 6}, {"id": "2610.38439", "title": "Predict the Reward, Not the World: World Reward Models for ML Agents", "authors": "Yuxiao Lee, Zherui Yang, Fan Liu, Hao Liu", "abstract": "Search-based machine-learning (ML) agents improve a solution by writing candidate programs, executing them, and keeping the best. Execution gives the search reliable feedback, but a single run can take hours, and most runs end in programs the agent discards. Recent agents try to save these runs by letting a large language model act as a world model that predicts how each program would perform. However, a wrong prediction feeds the search false information. We argue that an agent does not need to predict the outcome of execution, only the decision that execution would support. We propose World Reward Models (WRMs), which learn from real execution results to choose directly which candidate will perform better, without predicting any intermediate outcome. We prove that a selector which predicts execution from the same inputs cannot outperform the best direct selector, that predicted outcomes add an error which can make a likelihood-trained world model prefer the worse program on every instance, and that cross-entropy on executed winners drives a WRM toward the optimum. Our WRM, ForeCritic, adapts a 9B typed decision model to 5k executed program pairs. On 12,438 held-out pairs from 26 ML tasks, it picks the better program 79.4% of the time, while general-purpose LLM judges reach 53--62%, and its probabilities are calibrated. Inside AIDE, ML-Master, and ForeAgent, it cuts mean task time by 4.4--7.5 times while keeping their mean scores within 0.01 or raising them.", "categories": ["cs.AI", "cs.CL"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.38439", "pdf_url": "https://arxiv.org/pdf/2610.38439", "score": 84, "why_selected": "Elegant theory plus large held-out evaluation shows direct decision models cut ML-agent task time 4-7x with no meaningful score loss.", "basis": "full text", "summary": {"tldr": "Training a compact model on real execution results to pick the better ML program beats LLM judges (79.4% vs 53\u201362%) and speeds three agents 4.4\u20137.5\u00d7.", "goal": "Search-based ML-engineering agents get reliable feedback by executing candidate programs, but runs can take hours and most results are discarded. Using an LLM as a world model to predict outcomes saves runs, yet those predictions are right only about 60% of the time and errors mislead the search. The paper asks whether an agent can skip predicting execution and learn only the decision it needs: which program will score higher.", "approach": "The authors define World Reward Models (WRMs), selectors that map a task and candidate programs directly to win probabilities without simulating any run, and prove that, on the same inputs, a selector that predicts execution first cannot beat the best direct selector. Their system, ForeCritic, adapts Kev-9B, an open typed decision model with a frozen 9B backbone, by training only its LoRA adapter and pointer head with cross-entropy on 5,000 program pairs labeled by executed test scores from the Predict-Before-Execute corpus (26 MLE-bench tasks). Training took about 4.2 hours on eight GPUs, and each decision is one forward pass with no generated text. They tested on 12,438 held-out pairs and 91 fresh pairs from ten MLE-Dojo tasks. They then put ForeCritic into AIDE and ML-Master in place of execution during search, and into ForeAgent in place of its LLM judge.", "key_results": ["ForeCritic picks the better program on 79.4% of 12,438 held-out pairs, versus 54.5% for untrained Kev-9B. General-purpose LLM judges reach 53\u201362%, though the DeepSeek-V3.2 and GPT-5.1 figures come from the full corpus, not the identical test set.", "Accuracy is lower on harder cuts: 72.7% with tasks weighted equally and 71.5% on the 501 pairs where neither program appeared in training. The gain over Kev-9B remains significant, at 18.1 and 23.4 points respectively.", "Probabilities are calibrated (ECE 0.016 after temperature scaling, T=1.086), and the 38.3% of decisions made with at least 0.9 confidence are 95.2% correct.", "Across ten MLE-Dojo tasks, mean task time fell 4.4\u00d7 in AIDE, 7.5\u00d7 in ML-Master, and 4.7\u00d7 in ForeAgent. Scores stayed within 0.01 for AIDE and ML-Master and rose from 0.527 to 0.607 for ForeAgent, while the fast but inaccurate Jev selector (56.0%) lowered all three agents' scores."], "implications": "For choosing between candidates, the results suggest real execution data may be better spent training a direct decision model than asking a larger model to reason about a run: reasoning moved Qwen3.5-9B by 0.3 points, while training moved Kev-9B by about 25. The theory gives a general caution that predicted traces add no evidence beyond the inputs, though it describes Bayes-optimal selectors, not finite models. The authors suggest the recipe could extend to other settings where actions are costly but outcomes can be logged, such as experimental design, compiler tuning, and robotics; this is untested here.", "practicality": {"readiness": "Near-term (1-2 years)", "score": 6, "explanation": "Teams running tree-search ML agents could adopt this recipe, since training is cheap (about 33 GPU-hours) and comparisons took under 3% of task time, with the final program still executed for verification. However, it needs a corpus of executed program pairs, and the 5,000 labels here reused existing runs. Generalization to new tasks and domains is unproven, so retraining or further validation is likely needed before wider use."}, "limitations": "Agent results come from one scored run per task on ten tasks, averaged across metrics of differing scale and untested for significance; on 91 fresh pairs, ForeCritic's 70.3% versus DeepSeek-V4.1-Flash's 63.7% was not significant. All 26 tasks appear in training and programs recur across pairs, so performance on truly new tasks is untested, and the theory does not cover finite models or data.", "tags": ["world models", "reward models", "ML engineering agents", "calibration", "program selection"]}, "error": null, "rank": 7}, {"id": "2610.40565", "title": "Gym-Anything for Robotics: Scaling physical simulations with digital agents", "authors": "Pranjal Aggarwal, Sean Welleck", "abstract": "Realistic, fast robotics simulations could enable large-scale training of embodied AI models that transfer to the real world. However, despite decades of progress, available simulations cover only a narrow range of real-world tasks and physical phenomena. The core bottleneck is that creating better simulations requires significant expert effort and therefore does not scale. To address this, we introduce Gym-Anything for Robotics, a framework in which coding agents create realistic robotics simulations. Our core insight is that simulation creation is a coding agent task, so improvements in coding agents translate directly into richer and more faithful simulations. We select simulations based on U.S. GDP data to cover economically valuable physical work, define what makes a good simulation and a good task, and develop an adversarial creation-audit loop that checks each simulation and task against these definitions. Using this pipeline, we build RoboWorld, a set of 25 simulations with 25 test and 175 training RL environments of varying difficulty. Even the best frontier models fail on every RoboWorld test task, achieving an average reward of only 0.06. Building on RoboWorld, we introduce several new ways for frontier models to improve, including in-context learning across repeated attempts, a privileged teacher that reads the simulator state and teaches a student in context, self-assisted learning from the model's own privileged experience, and code policies that generate demonstrations across varied scenes to train vision-language-action models (VLAs) such as $\\pi_{0.5}$. Each of these substantially improves performance. We release our pipeline, RL environments, and benchmark to facilitate future research. Code and data are available at https://gym-anything.github.io/robotics", "categories": ["cs.RO", "cs.AI", "cs.LG"], "announce_type": "cross", "abs_url": "https://arxiv.org/abs/2610.40565", "pdf_url": "https://arxiv.org/pdf/2610.40565", "score": 83, "why_selected": "Scalable agent-built robotics simulations with an economically grounded benchmark that frontier models fail could become significant shared infrastructure for embodied AI, though sim-to-real value is unproven.", "basis": "full text", "summary": {"tldr": "Coding agents, checked by audit agents, built 25 physics-rich robot simulations chosen using U.S. economic data; frontier models fail every test task but improve with privileged simulator state.", "goal": "Robot learning depends on realistic, varied simulators, but building them takes heavy expert effort, so existing benchmarks cover a narrow slice of physical work. The paper asks whether coding agents can build realistic simulations at scale, so that better agents yield better simulators, and how frontier models can then learn inside them.", "approach": "The authors weighted O*NET occupational tasks by economic value, tracked everyday activities separately using time-use survey data, and used an LLM to split tasks into atomic physical actions. An optimization selected 120 action groups, each defining one simulation, and 25 were built. Claude Opus 5.5 agents wrote each simulation, including custom physics, while four audit agents (one adversarial) checked it against ten criteria over three rounds; six more auditors checked tasks against six criteria. The resulting benchmark, RoboWorld, has 25 test and 175 training environments with deterministic verifiers based on physical state and swappable robots. Three frontier models were tested using only cameras and robot feedback under a three-hour budget, and Opus 5.5 was used to study learning from privileged simulator state on 11 simulations, plus two gift-box tasks for training the vision-language-action policy \u03c00.5.", "key_results": ["GPT-6 Astra, GPT-6.1 Terra and Claude Opus 5.5 all had 0% success on the 25 test tasks (average reward 0.002\u20130.06); on an easier 25-task subset, the best model, Opus 5.5, reached 32% success and 0.48 reward.", "Across three attempts without weight updates, Opus 5.5 rose from 0.14 to 0.22 average reward with restricted access; with privileged state it scored 0.34 on the first attempt and 0.41 by the third.", "A student given only qualitative hints from a privileged coach scored 0.29 on its first attempt, 2.1\u00d7 the solo agent's 0.14 and above the solo agent's three-attempt result of 0.22.", "Privileged code policies succeeded on 96.7% of 2,048 varied initial states; 1,000 of their rollouts trained \u03c00.5 from 0% to 53% success (55% on unseen variations), about 14\u00d7 faster per task than Opus 5.5 step-by-step control."], "implications": "If these results hold up, simulator breadth becomes less limited by expert labor and more by coding-agent capability, including physics that existing engines lack. The learning results also suggest a new use of simulator ground truth: passing it to models through hints, the model's own experience, or generated demonstrations, rather than only through weight updates in teacher-student training.", "practicality": {"readiness": "Near-term (1-2 years)", "score": 6, "explanation": "Robot-learning researchers can use the released pipeline, environments and benchmark now to evaluate models or generate training data. Real-world use is further off: nothing here was tested on a physical robot, and the slowest allowed simulations run up to 200 times slower than real time. Rebuilding the pipeline also requires frontier coding-agent access and substantial compute."}, "limitations": "No sim-to-real transfer was demonstrated, and physics checks rest largely on theory and published data rather than systematic real-world validation. The favorable blind comparison with prior simulators (wins of 80% on visuals, 76% on physics) was judged by Claude Opus 5.5, the model that built the simulations, and the \u03c00.5 result covers only two tasks.", "tags": ["robotics simulation", "coding agents", "benchmarks", "privileged learning", "sim-to-real"]}, "error": null, "rank": 8}, {"id": "2610.38392", "title": "Masked Erosion: How Acceptance Gates Lose Redundant Safeguards in Self-Improving Agents", "authors": "Hau-Sing So, Daixian Liu, Weicai Long", "abstract": "Self-improving LLM agents edit their own harness, the prompts and rules around a fixed model, and keep an edit only if an acceptance gate scores it higher on a batch of tasks. Such a gate sees what the harness does under the current model, not what it would still prevent if one safeguard failed. When safeguards overlap, deleting one is masked: the others still block the harm, so the gate decides on task success alone and redundancy erodes unseen. We measure harm for every subset of four written safeguards in two agent environments and run 411 improvement loops under ten gate rules, mostly as controlled deletion experiments, plus three runs of the GEPA optimizer. A deletion behind another working safeguard adds almost no observable harm. A paired significance test blocks deletions that pass by chance but not deletions that genuinely raise task success, and a larger evaluation batch lets it delete cheaper safeguards: at the same cost, 20-task batches kept every harness protected while 40-task batches lost all six. Large harm audits prevent exposure but not the loss of depth, which turns into harm when the harness is reused with a weaker model. GEPA kept every safety rule verbatim, yet two of its three final harnesses misused credentials under a weaker model. A statistical model frozen before the runs predicts where each gate's protection breaks as safeguard cost and batch size change, and freezing safety text or auditing one-layer ablations preserves depth.", "categories": ["cs.AI"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.38392", "pdf_url": "https://arxiv.org/pdf/2610.38392", "score": 82, "why_selected": "Identifies a novel and practically important safety failure in self-improving agents using 411 controlled loops and a pre-registered predictive model.", "basis": "full text", "summary": {"tldr": "Acceptance gates in self-improving agents can silently delete redundant safeguards; harm stays low under the current model but appears when the harness moves to a weaker one.", "goal": "Self-improving LLM agents rewrite the prompts and rules around a fixed model and keep edits that score better on a task batch. When safeguards overlap, deleting one changes almost nothing measurable because the others still block the harm, so redundancy can erode unseen. The paper asks when gates lose this depth, whether that can be predicted in advance, and what preserves it.", "approach": "The authors measured harm for all 16 subsets of four written safeguards in two environments with deterministic audits: credential misuse in AppWorld and destructive clean-up in OpsSim, a simulated operations service. They ran 411 improvement loops under ten gate rules; 393 were stress loops that plant one deletion per generation, in the spirit of mutation testing, and 18 let an LLM rewrite text freely. They also ran the GEPA optimizer unchanged for three seeds and re-ran final harnesses under other models. The key metric is margin, the number of further safeguard deletions a harness can absorb before harm exceeds 0.05. A gate simulator frozen before the runs predicted where each gate would break, and of 177 registered predictions, 113 held, 49 failed, 9 held in part and 6 could not be scored.", "key_results": ["Masking is real: deletions into still-protected harnesses added 0.016 child-only harm (upper bound 0.028), versus 0.422 for deletions into unprotected ones. A four-task batch audit would notice the former in about 6% of decisions.", "Significance testing blocks chance deletions but not ones with real success gains. In AppWorld, greedy gates accepted 0.48 of deletions and a paired test 0.04 (5 of 6 vs. 0 of 6 loops unprotected). In OpsSim at a safeguard cost of 0.15, 20-task batches kept all six harnesses protected while 40-task batches lost all six.", "Audits stop exposure, not depth loss: an audit veto with 120 harm runs per state left no loop unprotected, but five of six finals had margin 1 and misuse under the weaker Qwen3-30B was 0.21, against 0.004 for paired-gate finals. Among finals still protected under DeepSeek, non-paired finals misused credentials in 0.30 of Qwen3-30B runs and paired finals in 0.004.", "GEPA kept every credential rule verbatim, yet two of three finals misused credentials under Qwen3-30B (2 and 5 of 40 runs, vs. 0 of 80 for the original harness) after rewriting a note template. Freezing safety text and a margin-aware gate that audits one-layer ablations both preserved depth better; the latter kept every OpsSim loop protected but cost 0.35 clean success under selection."], "implications": "Being safe now and staying safe after a change are distinct properties, and checks of the current child under one model cannot measure the second. The authors recommend keeping safety-critical behaviour outside the optimizer, gating on what remains rather than only on what happens, and re-auditing after a model change. Larger evaluation batches, usually seen as safer, can make significance gates delete cheaper safeguards.", "practicality": {"readiness": "Near-term (1-2 years)", "score": 6, "explanation": "Teams running prompt or harness optimizers could freeze safety text or re-audit after a model swap today, and the authors say they will release code and frozen predictions. Harder parts are knowing which text is safety-critical, paying for ablation audits (about 1,228 suite runs over six loops), and accepting clean-success costs when safeguards are expensive. Freezing protects text rather than behaviour, and the margin-aware gate checks layers rather than wording."}, "limitations": "The study covers two environments, each with one harm and four written safeguards, and most loops plant deletions, so it does not estimate how often deployed optimizers erode safeguards; GEPA and natural loops are case studies. The largest swap effects come from weak models solving about 5% of clean AppWorld tasks, with gaps of only 0.025 under stronger models, and strong models avoided the harms probed in other benchmarks.", "tags": ["self-improving agents", "AI safety", "defence in depth", "acceptance gates", "prompt optimization"]}, "error": null, "rank": 9}, {"id": "2610.40382", "title": "Beyond Selected Breakthroughs: Evaluating Language Models on Randomly Sampled Mathematical Conjectures", "authors": "Helen Jenne, Davis Brown, Jesse He, Henry Kvinge", "abstract": "The last year has seen a shift in AI-assisted mathematics, with frontier language models producing proofs of and counterexamples to long-standing open conjectures. However, studying only the current set of major breakthroughs provides an incomplete picture of LLM capabilities and the computational resources needed to achieve reported results. To address this, we introduce a new dataset, OpenConjecture, which collects conjectures from mathematics papers published on the arXiv since February 2026. We use these conjectures as a source of open mathematical problems, and apply frontier GPT models to a random sample of 200 of these conjectures over three passes using a reproducible protocol without problem-specific mathematical guidance. Rather than attempt expert verification of these candidate solutions, we analyze the types of problems for which LLMs produce solutions and the characteristics of these solutions. The models we test produce candidate solutions for roughly 60% of the conjectures, with counterexamples about 1.3 times more common than proofs. We estimate solution novelty, assess how solutions cite and relate to existing literature, and analyze whether the proposed resolution relies on either an error in or underspecification of the conjecture. We find that models sometimes propose resolutions that are outside the authors' intent (e.g., proposing the trivial group as a counterexample) and that a number of proofs follow closely from existing results, but that some resolutions exhibit at least moderate novelty. Our findings underscore the need for evaluations that go beyond correctness to assess fidelity to the intended statement, attribution, and the nature of the mathematical contribution.", "categories": ["cs.AI", "math.HO"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.40382", "pdf_url": "https://arxiv.org/pdf/2610.40382", "score": 81, "why_selected": "Random sampling of fresh conjectures gives a much-needed unbiased view of LLM mathematics, though the absence of expert verification limits its conclusions.", "basis": "full text", "summary": {"tldr": "GPT models proposed resolutions for 125 of 200 randomly sampled open arXiv conjectures, but none were expert-verified, and many relied on standard examples, existing results, or imprecise statements.", "goal": "Headline AI-math breakthroughs are hand-selected, so they say little about how language models perform on typical open problems or what those results cost. The authors ask what happens on a random sample: whether models prove or refute more often, how far a simple prompt gets, and whether solutions contribute anything new.", "approach": "They built OpenConjecture, a weekly updated dataset of conjectures extracted from recent arXiv math preprints; after LLM filtering, the June 21 snapshot held 1,924 conjectures labeled open. They sampled 200 papers uniformly and one conjecture from each, then ran up to three escalating passes: GPT-5.6 Sol (with web search and the full paper), then GPT-5.6 Sol Pro and GPT-6 Astra Pro (both closed-book, with extracted context and prior attempts). Only conjectures left unresolved moved on, and no problem-specific mathematical guidance was given. Correctness and novelty were judged by fresh instances of the same model, plus the authors' non-specialist manual review, not expert verification.", "key_results": ["Models proposed resolutions for 125 of 200 conjectures: 70 counterexamples and 55 proofs. Overall, 84% passed LLM review, including all third-pass attempts and 80-85% of first- and second-pass attempts.", "Among verified first- and second-pass counterexamples, about 60% were rated off-the-shelf and the rest standard constructions, while 5 of 6 third-pass counterexamples were rated nontrivial modifications. A significant share of early counterexamples appeared to exploit imprecise statements, such as the trivial group or a single-vertex graph.", "Some proofs overlapped with existing work: 9 addressed conjectures already settled in later preprints, though 3 of those gave an independent argument, and others followed readily from known results. In 7 of 11 third-pass proofs, the model built on earlier passes without acknowledging them.", "Median cost per conjecture was modest, at about $0.97, $0.41, and $1.71 for the three passes. Response length did not predict next-pass success, and LLM viability scores were only weakly predictive (mean 0.34 for proved conjectures vs. 0.26 for unresolved)."], "implications": "Correctness alone is a poor measure of AI math output, because a technically valid result may miss the authors' intent, repeat known work, or omit attribution. Benchmarks built from arXiv conjectures need to account for missing context, and evaluations should also report fidelity to the intended statement, relationship to the literature, and mathematical contribution.", "practicality": {"readiness": "Usable now", "score": 7, "explanation": "The dataset is public on HuggingFace with generation code on GitHub, and the protocol is cheap enough for researchers to stress-test conjectures or build evaluations. Mathematicians could use similar runs to catch misstated conjectures or find simple counterexamples. Every output still needs expert checking, and context extraction often remained insufficient under LLM review."}, "limitations": "The reported figures are candidate resolutions, not newly solved problems, because reviewers were instances of the same models and may share their errors. The study tested only GPT models, once each, so run-to-run variability, other prompts and tools, and cross-model comparisons remain open.", "tags": ["AI for mathematics", "LLM evaluation", "open conjectures", "benchmark datasets", "research attribution"]}, "error": null, "rank": 10}];
