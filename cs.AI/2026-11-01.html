<script>
// Shared rendering for the live app and exported/published digest pages.

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function readinessClass(r) {
  if (r.startsWith("Usable")) return "ready-now";
  if (r.startsWith("Near")) return "ready-near";
  return "ready-far";
}

function paperCard(p) {
  const s = p.summary;
  const head = `
    <div class="paper-head">
      <div class="rank">${p.rank}</div>
      <div>
        <h2><a href="${esc(p.abs_url)}" target="_blank" rel="noopener">${esc(p.title)}</a></h2>
        <div class="authors">${esc(p.authors)}</div>
        ${s ? `<div class="tldr">${esc(s.tldr)}</div>` : ""}
        <div class="chips">
          ${s ? `<span class="chip ${readinessClass(s.practicality.readiness)}">${esc(s.practicality.readiness)}</span>` : ""}
          ${(s?.tags || []).map((t) => `<span class="chip">${esc(t)}</span>`).join("")}
          ${p.basis !== "full text" ? `<span class="chip">Based on ${esc(p.basis)}</span>` : ""}
        </div>
      </div>
    </div>`;
  if (!s) {
    return `<article class="paper">${head}<p class="authors">The full breakdown couldn't be generated: ${esc(p.error)}</p>
      <p>${esc(p.abstract)}</p>${links(p)}</article>`;
  }
  const pct = Math.max(0, Math.min(10, s.practicality.score)) * 10;
  return `<article class="paper">${head}
    <div class="grid">
      <div class="section"><h3>Goal</h3><p>${esc(s.goal)}</p></div>
      <div class="section"><h3>How they did it</h3><p>${esc(s.approach)}</p></div>
      <div class="section"><h3>Key results</h3><ul>${s.key_results.map((r) => `<li>${esc(r)}</li>`).join("")}</ul></div>
      <div class="section"><h3>Implications</h3><p>${esc(s.implications)}</p></div>
      <div class="section"><h3>Real-world practicality · ${s.practicality.score}/10</h3>
        <div class="practical-bar"><div style="width:${pct}%"></div></div>
        <p>${esc(s.practicality.explanation)}</p></div>
      <div class="section"><h3>Limitations</h3><p>${esc(s.limitations)}</p></div>
    </div>
    <details><summary>Why it made the top 10</summary><p>${esc(p.why_selected)}</p></details>
    ${links(p)}
  </article>`;
}

function links(p) {
  return `<div class="links"><a href="${esc(p.abs_url)}" target="_blank" rel="noopener">Abstract</a>
    <a href="${esc(p.pdf_url)}" target="_blank" rel="noopener">PDF</a></div>`;
}

function fmtDate(iso) {
  return new Date(iso + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
}

const PAPERS = [{"id": "2610.39302", "title": "Proving and Improving the Platonic Representation Hypothesis with JEPAs", "authors": "Randall Balestriero, Yann LeCun", "abstract": "Whether models trained on different modalities converge to the same representation of the world is central to AI. The Platonic Representation Hypothesis (PRH) conjectures that they do as they scale, but without a proof it offers neither a guarantee nor a recipe. We turn the hypothesis into a theorem. First, we prove a \\emph{Platonic Representation Theorem}: Joint-Embedding Predictive Architectures (JEPAs) trained separately on any number of modalities learn the same representation up to one rotation whenever their positive pairs are two observations of one scene--\\emph{good views}--and their misalignment is bounded otherwise. Second, we show that next-token prediction is a JEPA with \\emph{bad views}, parts of a single document, which explains why language models align with vision only through scale. Third, we validate the theory from 145k captions to the texts of 940M web images, and uncover a scaling law of alignment that predicts unseen runs within seed noise. Good views need 42 times fewer training samples than next-token prediction on the same corpus to reach the same alignment, and a 109M-parameter text JEPA aligns with DINOv2 and CLIP's image encoders better than every language model we evaluated, up to 72B parameters, and than CLIP's text encoder: next-token prediction is a remarkably inefficient route to platonic representations. As a showcase, one rotation turns separately trained encoders into an image captioner (CIDEr .838 on COCO). Even that rotation needs no pair: on the latest pair-free benchmark, our text JEPA beats every zero-shot accuracy reported with language models up to 8B parameters, e.g., 64\\% against at most 56\\% top-5 on ImageNet-100. Positive views, and not scale alone, are thus the lever to build platonic representations.", "categories": ["cs.AI", "cs.CV", "stat.ML"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.39302", "pdf_url": "https://arxiv.org/pdf/2610.39302", "score": 95, "why_selected": "Converts a major conjecture into a theorem with large-scale validation up to 940M images, and offers a concrete, far more efficient recipe that challenges scale-driven representation learning.", "basis": "full text", "summary": {"tldr": "Under idealized assumptions, JEPAs trained separately on different modalities learn one representation up to rotation when positives are two observations of a scene, and such views beat next-token prediction empirically.", "goal": "The Platonic Representation Hypothesis conjectures that vision and language models converge on a shared representation of the world as they scale, but it rested on observation, with no guarantee or recipe for improving alignment. The paper asks when separately trained models provably learn the same representation, and whether anything beyond raw scale can drive that alignment.", "approach": "The theory models a finite world rendered by each modality and shows that a whitened JEPA (a self-supervised model that makes embeddings of paired inputs agree while preventing collapse) learns the spectral embedding of its positive-pair graph. Shared positives therefore give one embedding up to rotation, and mismatched positives give a bounded error. The authors distinguish 'good views' (two observations of one scene, such as two captions of an image) from 'bad views' (corruptions of one observation), and show next-token prediction has the form of a bad-view JEPA, a link they treat as heuristic and test empirically. Experiments train encoders separately with LeJEPA, varying only the positives, on data from Flickr30k (145k captions) to the texts of 940M Recap-DataComp web images, plus MSR-VTT video. Alignment is scored against frozen vision models such as DINOv2 and CLIP's image encoders, using mutual 10-NN, CKA and retrieval through one fitted rotation on WIT-1024, COCO and Flickr.", "key_results": ["Sample efficiency: with the same 109M encoder and corpus, a good-view JEPA reached WIT alignment .109 after 21.6M samples, while next-token prediction reached .111 after 900M, 42 times more samples and 14 times more text tokens.", "Against larger models: a 109M text JEPA trained on the texts of 940M images scored .184 with DINOv2 on WIT-1024, above Qwen2.5-72B (.154) and CLIP's text encoder (.124). Averaged with a fourth seed run at a different SIGReg weight (.121), the score is .168.", "Scaling law: a fitted formula in the fraction of good views and samples seen predicted 85 unseen runs with RMSE .0093, matching seed-to-seed noise (.0096), though it overestimated good-view runs at 320M samples.", "Applications: one fitted linear map joined frozen image encoders to a text-only-trained decoder for CIDEr .838 on COCO. With no pairs at all, the text JEPA reached 64.4% top-5 zero-shot accuracy on ImageNet-100, against 47.6% for Qwen3-8B rerun under identical conditions and a best reported 56%."], "implications": "The work reframes alignment as a question of which pairs a model treats as positives, not only of model size, and suggests next-token prediction is an inefficient route to cross-modal representations. Separately trained encoders can be composed with very little paired data, which could reduce the need for jointly trained multimodal systems. The results concern alignment specifically, not language models' general capabilities.", "practicality": {"readiness": "Usable now", "score": 7, "explanation": "Researchers building multimodal systems can apply the recipe today: views from different observations of a scene, trimmed and lightly masked, trained with gradient clipping, then a Procrustes map between encoders. The paper links code and a demo. The obstacle is sourcing good views at scale, since they require knowing which observations describe the same scene, and training can collapse without clipping or at some settings."}, "limitations": "The theorems cover population optima on finite worlds with injective renderings, conditions no experiment meets, and uniqueness is not proved for the LeJEPA objective actually used. The large-scale wins rely on texts mostly written by a LLaVA image captioner (WIT .060 with a text-only paraphrase versus .107 with recaptions), and the SIGReg weight behind the top result was selected after seeing WIT scores.", "tags": ["JEPA", "self-supervised learning", "representation alignment", "multimodal learning", "spectral methods"]}, "error": null, "rank": 1}, {"id": "2610.40476", "title": "Training language models in simulation for psychiatric intake", "authors": "Samuel Schmidgall, Tim Strother, Alex Bijamov, Min Woo Sun, Anil Palepu, Akshay Goel, Ulysse Marteau-Ferey, Th\u00e9o Moutakanni, Yubin Kim, Joseph Breda, Christina Chen, Justin Chen, Paul Jhun, Andrew Marshall, Sarah Montgomery-Taylor, Eun Kyoung Hong, Shashank Ravi, Kameron C. Black, David J. H. Wu, Austin Schoeffler, John Lyon Havlik, Elizabeth C. Stade, Jared Moore, Johannes C. Eichstaedt, Logan Pierce, Jeff Jopling, Johannes Thrul, Thomas H. McCoy, Neguine Rezaii, Mark S. Chen, Ellen E. Fitzsimmons-Craft, Shirley Wang, Desmond C. Ong, Katharina Schultebraucks, Torrey Creed, Bhavna Daryani, Aleksandra Faust, S. Sara Mahdavi, Caroline Figueroa, Eric Lin, Kate H. Bentley, Ernest Lim, Zhihan Jiang, Xuhai \"Orson\" Xu, Daniel McDuff, John Torous, Yun Liu, Po-Hsuan Cameron Chen, Mike Schaekermann, Joelle Barral, Alvin Rajkomar, Tao Tu, Lin Yang, Isaac Galatzer-Levy, David Racz, Valentin Li\u00e9vin", "abstract": "In psychiatric practice, the clinical intake interview remains a primary diagnostic instrument, requiring the clinician to establish rapport while disentangling complex, overlapping presentations. Here, we show that multi-turn reinforcement learning (RL) in simulation environments improves language model performance on structured text-based psychiatric intake, spanning history-taking, differential diagnosis, and initial management planning. In a randomized, double-blind crossover study ($N = 60$ matched scenario pairs, 120 encounters) comparing the RL-trained agent against its identically prompted base model, 32 board-certified psychiatrists role-played standardized patients while a separate panel of 15 independent, board-certified psychiatrists scored the de-identified transcripts. The trained agent outperformed the base model in 76.7% of matched scenario pairs ($p < 0.0001$), with gains on an adapted clinical-examination rubric ($d_z = 0.77$, $p < 0.0001$), patient-centered communication (82.0% vs. 65.2%, $p < 0.001$), and differential diagnosis appropriateness (68.3% vs. 33.3%, $p < 0.001$). Across 127 psychiatrist-validated simulated intake scenarios, the trained agent nearly doubled its base model's clinical rubric score (0.706 vs. 0.379; composite reward 0.564 vs. 0.294, $p < 0.0001$). To systematically probe conversational safety, we established two Delphi-consensus taxonomies, of clinical safety risks and relational competencies, from which 256 challenging adversarial presentations were derived; we find that training in simulation environments more than halved under-triage of acute safety risks (12.9% vs. 30.5%, $p < 0.0001$). Simulation environments thus provide a controlled testbed for training and stress-testing psychiatric conversational agents, with gains that transferred to psychiatrist-enacted encounters, though residual gaps require safeguards and clinician oversight.", "categories": ["cs.AI", "cs.CL"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.40476", "pdf_url": "https://arxiv.org/pdf/2610.40476", "score": 92, "why_selected": "A randomized, double-blind study with board-certified psychiatrists gives unusually rigorous evidence that simulation RL improves a high-stakes clinical task, including halved safety under-triage.", "basis": "truncated full text", "summary": {"tldr": "Google researchers trained Gemini 3.1 Flash-Lite with RL on simulated patients; blinded psychiatrists preferred it to the base model, but serious safety and management gaps remain.", "goal": "Psychiatric diagnosis depends heavily on the intake conversation itself: the clinician must build trust to surface hidden history and risk, yet evaluations of conversational medical AI have largely excluded psychiatry. The paper tests whether multi-turn reinforcement learning in simulated encounters can improve a language model's history-taking, differential diagnosis, initial management planning, communication, and safety behavior.", "approach": "The team trained Gemini 3.1 Flash-Lite with Group Relative Policy Optimization (GRPO), using 48,243 LLM-generated psychiatric scenarios plus general telehealth, history-taking, and adversarial cases. A simulated patient tracked mood and reliability and withheld key facts until the agent earned rapport or asked targeted questions, while a Gemini 3.1 Pro autorater scored each encounter on a clinical rubric with safety penalties. The trained agent was compared with its identically prompted base model in three settings: a randomized, double-blind crossover mock clinical exam (OSCE) of 60 scenario pairs, with 32 psychiatrists role-playing patients and 15 others grading transcripts; 127 psychiatrist-validated simulated intakes; and 256 adversarial presentations derived from two Delphi-consensus taxonomies. There was no comparison with human clinicians or larger frontier models.", "key_results": ["OSCE primary endpoint: the trained agent scored higher in 76.7% of matched pairs (46 of 60, p<0.0001), with PACES clinical-skills scores of 3.04 vs. 2.32 out of 5 (dz=0.77), patient-centered communication of 82.0% vs. 65.2%, and favorable differential appropriateness of 68.3% vs. 33.3%.", "Across 127 simulated intakes, the clinical rubric score rose to 0.706 from 0.379 and composite reward to 0.564 from 0.294; under an out-of-family judge (GPT-5.6-Luna) the advantage held but shrank (0.443 vs. 0.278).", "In 256 adversarial presentations, under-triage of acute risk fell to 12.9% from 30.5%, contraindications to 0.8% from 6.2%, and missed red flags to 6.2% from 10.9%, all without external safety filters.", "Large gaps remained: comprehensive and appropriate treatment was recommended in only 46.7% of OSCE encounters, and at least one critical question was omitted in 60.6% of simulated intakes. Simulated evaluation also overstated the gain (dz=2.11 vs. 0.71 with psychiatrists) and barely tracked which scenarios improved (rho=0.09)."], "implications": "Simulation appears sufficient as a training environment for interview skills, since gains carried over to psychiatrist-enacted encounters, though simulated scores can rank models but not estimate how far apart they are. Many remaining failures are omissions, such as never asking the question that reveals a concealed crisis, which output filters cannot catch; the authors argue for process-level safeguards such as checklists that gate ending an encounter. The validated scenarios, rubrics, and safety taxonomies could also serve as an audit method for other mental health chatbots, if released.", "practicality": {"readiness": "Long-term (3+ years)", "score": 3, "explanation": "The eventual use the authors envision is supervised pre-visit intake, producing a provisional history and differential for a clinician to verify. The system is an uncleared research prototype, untested on real patients, and its code is not being released; the authors explicitly reject autonomous use. Roughly one in eight adversarial presentations still ended in under-triage, so external safeguards and prospective clinical studies must come first."}, "limitations": "Results come from single-encounter, English, text-only role-play under US norms, with psychiatrists as patient actors who may present in textbook patterns, each transcript graded by one rater, and secondary endpoints uncorrected for multiple comparisons. Training rewards and the primary autorater share a model family, risking reward hacking, and the study was funded by Alphabet with many employee authors.", "tags": ["reinforcement learning", "psychiatry", "conversational AI", "clinical safety", "simulation"]}, "error": null, "rank": 2}, {"id": "2610.40503", "title": "Algebraic World Model: From Exploration to Proofs", "authors": "Guancheng Pan, Qixin Tan, Yang Yuan, Andrew Chi-Chih Yao", "abstract": "AI has made remarkable progress in mathematics, solving challenging problems with machine-checkable proofs in Lean, yet typically relying on predefined mathematical definitions and formal specifications. This raises a natural question: can it reason rigorously about an unknown world? We introduce the Algebraic World Model (AWM), a framework that turns interaction with unfamiliar environments into explicit mathematical models supporting formal reasoning. AWM explores the environment and develops executable Python hypotheses, continually testing and revising them against observations. It then structures these hypotheses into typed objects and shared rules, simplifies their structure through category-theory-guided transformations, and formalizes the resulting model in Lean 4 to prove reachability and impossibility. AWM can formally prove that a goal is unreachable, even beyond explored trajectories. On two impossible game levels, it constructs closed, kernel-checked Lean proofs excluding every legal winning sequence in all six runs, while Claude Opus 5.5 and GPT-6 Astra, equipped with coding tools, produce none in twelve baseline runs. Four of AWM's six initial bounds are correct, compared with one for Opus 5.5 and none for GPT-6 Astra; given only feedback that a cheaper win exists, AWM revises its rules and constructs new proofs, reaching six of six correct bounds. Moreover, AWM produces interpretable mathematical models whose rules can be inspected and tested step by step. Across all 25 public ARC-AGI-3 games, these models enable Lean to replay the winning trajectories of all 183 levels and generalize beyond observed play, predicting unseen transitions and detecting changes in game mechanics. With Claude Opus 5, AWM clears all levels with a score of 99.9, while its certified winning trajectories use only 43% of the human baseline's actions.", "categories": ["cs.AI", "cs.LO"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.40503", "pdf_url": "https://arxiv.org/pdf/2610.40503", "score": 91, "why_selected": "Delivers kernel-checked impossibility proofs about unknown environments and a near-perfect ARC-AGI-3 score, a novel bridge from exploration to formal reasoning, though the impossibility evaluation is small.", "basis": "full text", "summary": {"tldr": "AWM learns explicit game rules through play, formalizes them in Lean 4, and proves goals unreachable under those rules, even for sequences never tried; tested on ARC-style puzzles.", "goal": "AI provers work well when definitions are handed to them, but an agent in an unfamiliar environment must first work out the objects, rules and goals. The paper asks whether an agent can reason rigorously about such a world, including proving something impossible rather than merely failing to achieve it. A winning run shows reachability; impossibility requires excluding every legal action sequence, explored or not.", "approach": "AWM runs in three stages. Explore & Prototype keeps a 'concept book' of executable Python hypotheses, and any contradicted concept must be revised or withdrawn before play continues. Structure & Simplify turns these into typed objects and shared rules using four category-theory-guided transformations (decomposition, composition, generalization, specialization), each with a Lean-checked statement and tests against recorded and corrupted transitions. Formalize & Prove completes the model in Lean 4, proving reachability with winning witnesses and impossibility with invariants or cost lower bounds. Evaluation covers all 25 public ARC-AGI-3 games (183 levels, using Claude Opus 5) plus two rearranged sc25 levels 'sealed' one unit below their true minimum winning cost, comparing AWM on Claude Opus 5.5 with Opus 5.5 and GPT-6 Astra using coding tools, over 18 runs.", "key_results": ["On the sealed levels, all 6 AWM runs produced closed, kernel-checked Lean impossibility proofs under their learned models; the 12 baseline runs produced none.", "Bounds matching the true minimum winning cost: AWM 4/6 initially, versus 1/6 for Opus 5.5 and 0/6 for Astra. Told only that a cheaper win exists, AWM reached 6/6 with new proofs; Astra corrected two bounds without proofs, and Opus 5.5 corrected none.", "Post-hoc audits on engine-generated transitions extended 5 of the 6 model-level proofs to the actual games; one failed because its model misjudged fuel collection.", "Across 25 public games, AWM scored 99.9 (100 on 23 games), and Lean replayed all 183 winning trajectories. Certified clears took 7,448 actions, 43% of the human baseline's 17,135, though total engine actions including exploration were 24,604. Other code-executing systems scored similarly (99.0 to 100.0)."], "implications": "AWM shows that formal proof can extend to worlds whose rules are learned rather than given, while keeping 'is the reasoning valid?' separate from 'is the model right?'. Explicit proof dependencies also make errors easier to find: with injected rule errors on level 4, counterexample discovery rose from 16/42 to 29/42 runs, near the 30/42 achieved when the faulty rule was named outright. Its distinctive gain is certified, inspectable reasoning rather than a higher game score.", "practicality": {"readiness": "Near-term (1-2 years)", "score": 4, "explanation": "Researchers in formal methods, world modeling and agent verification could apply the approach now to discrete, deterministic environments, and the authors publish models, proofs and replays online. Use outside such settings is untested, and the pipeline relies on frontier LLMs, Lean expertise and repeated environment access. Tying a proof to the real system also needed separate post-hoc engine audits."}, "limitations": "Proofs hold only under the learned model: in mutation tests, verification caught 0/18 incorrect rules and 0/6 wrong-goal or wrong-version statements, and two initial AWM bounds were wrong despite valid proofs. The impossibility evidence is small (two levels of one game, six AWM runs), and stochastic dynamics, richer hidden state and delayed feedback remain untested.", "tags": ["world models", "formal verification", "Lean 4", "ARC-AGI-3", "category theory"]}, "error": null, "rank": 3}, {"id": "2610.39714", "title": "MoLRSI: A Recursive Self-Improving AI agent for Molecular Discovery", "authors": "Yikun Zhang, Xiwei Cheng, Mingze Yuan, Yu Zhang, Brian Shim, Aarti Krishnan, Daniel Rosen, Kunyang Sun, Yingze Wang, Zhenfeng Deng, Botao Yu, Bingxu Liu, David Liu, Tianyu Liu, Yuanqi Du, Nir Hacohen, James J. Collins, Wengong Jin", "abstract": "Molecular discovery requires navigating vast combinatorial search spaces while balancing competing biological objectives. AI agents can automate expert-defined molecular design protocols, but automation alone does not address how to optimize workflows for new tasks or improve their development through experience. Here we introduce MoLRSI, an AI agent that combines systematic optimization of workflows and model architectures with persistent cross-task memory to recursively improve its search policy for molecular discovery. Workflow performance, refinement outcomes, and execution feedback guide subsequent searches, allowing the agent to improve both its workflows and its strategy for developing them. We evaluate MoLRSI in two challenging molecular discovery settings that require balancing competing properties. In antibiotic discovery, MoLRSI developed a screening workflow balancing antibacterial activity, cytotoxicity and structural novelty, achieving an experimental hit rate of 15.9%, compared with 8.7% for a previous expert-led workflow using the same training data and screening library. In de novo peptide-MHC binder design, MoLRSI developed workflows that jointly consider target binding and specificity, producing eight experimentally validated hits against MART-1 and SARS-CoV-1 pMHCs with preferential binding over tested off-targets while Claude Science completely failed. These findings demonstrate how experience-guided workflow optimization can address competing discovery objectives while improving the search strategies used in subsequent campaigns.", "categories": ["cs.AI"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.39714", "pdf_url": "https://arxiv.org/pdf/2610.39714", "score": 90, "why_selected": "Recursive workflow self-improvement yields wet-lab validated results, nearly doubling the antibiotic hit rate over an expert workflow and producing validated peptide-MHC binders.", "basis": "truncated full text", "summary": {"goal": "Molecular discovery requires searching huge chemical/protein spaces while balancing competing objectives (potency, toxicity, novelty, specificity), and the computational workflows that do this are themselves hand-engineered by experts. Existing AI science agents can automate a given protocol but treat each campaign in isolation, so nothing is learned about how to build better workflows next time. The paper asks whether an agent can accumulate cross-task experience to improve its own workflow-search strategy, and whether that translates into real wet-lab hits.", "approach": "MolRSI has an \"Explore Agent\" that mines papers/code into validated executable \"skills\" (110 for small molecules; 65 for proteins), then runs Monte Carlo tree search over candidate workflows \u2014 swapping model architectures, features, losses, ensembling and scoring terms. Three persistent memories carry experience across tasks: solution memory (workflows + scores), refinement memory (what modification helped or hurt), and execution memory (runtimes, errors, verified repairs). Memory biases family selection, parent sampling, modification proposals and debugging via bounded, task-similarity-weighted transfer scores. It was tested in two domains: (1) antibiotics \u2014 25 source tasks (22 TDC ADMET + 3 cytotoxicity) feeding six held-out antibacterial activity prediction tasks, then a prospective screen of 12.1M compounds with 107 compounds synthesized and MIC-tested against S. aureus; (2) pMHC binders \u2014 14 miniprotein-binder ranking tasks feeding a held-out MART-1 pMHC ranking task, then de novo design for MART-1 and SARS-CoV-1 pMHCs validated by phage display. Baselines (Biomni, Claude Science, STELLA, Codex, Claude Code) got identical data splits, objectives, 20-evaluation budgets and GPU hours; most used Claude Sonnet 5.", "key_results": ["Prospective antibiotic screen: 17/107 compounds hit (MSSA MIC \u226432 \u00b5g/mL) = 15.9% hit rate vs 8.7% (21/241) for the authors' prior expert-led workflow on the same training data and same 12.1M screening library. On a shared 271-compound held-out set, MolRSI's activity model reached AUROC 0.828 / AUPRC 0.300 vs 0.590 / 0.090 for the published predictor. Two hits (C3, C32) were active against MRSA at 1 and 8 \u00b5g/mL with CC50 of 6.4\u201317.5 and 24.2\u201354.7 \u00b5g/mL across three human cell lines.", "Cross-task memory helped search: RSI improved mean test AUPRC on all six antibacterial tasks, and zero-search transfer (reuse a stored workflow, refit on target data) beat search-from-scratch on three of six. Transfer AUPRC rose from ~0.32 with 2 source tasks to ~0.37 with all 25, above the 0.361 reached by 20 iterations of search without RSI.", "pMHC ranking on held-out MART-1: EF@1%/EF@2% of 3.65/5.55 for MolRSI vs 0.00/1.85 for the best agent baselines; the identical system without prior-task memory scored 0.00 at both cutoffs. On the 14-target miniprotein benchmark (no memory) MolRSI led with macro EF@1% 8.01 vs 7.62 next best.", "Prospective design: 5/251 MART-1 and 3/266 SARS-CoV-1 designs were hits (on-target log2FC >4 exceeding best off-target), while Claude Science produced 0 hits from 288 and 267 designs, and MolRSI without its learned ranking step produced 0/479."], "implications": "This is one of the first demonstrations that \"recursive self-improvement\" in an AI science agent \u2014 reusing memory of what workflow edits worked on past tasks \u2014 yields measurable gains that survive to wet-lab validation, not just benchmark numbers. It reframes the unit of automation from a single pipeline to the search policy that builds pipelines, and suggests a cheap lever (accumulating 25 related prediction tasks) can outperform more compute on a fresh search. It also proposes an evaluation standard for such agents: compare search-with-memory, search-from-scratch, and zero-search transfer separately.", "practicality": {"readiness": "Near-term (1-2 years)", "score": 6, "explanation": "Pharma and academic discovery groups with existing screening libraries and assay capacity could use this pattern now \u2014 the components (TDC data, Chemprop/MiniMol, RFdiffusion-class generators, MCTS over workflows) are public, and the antibiotic result is a drop-in replacement for an expert screening cascade. Barriers are substantial compute (1,000 A100-hours per protein design target), reliance on frontier LLM APIs, and the fact that the system itself is not released as a tool in what is shown here. The pMHC datasets are available only on request, which limits exact reproduction."}, "limitations": "The headline antibiotic comparison is retrospective against the authors' own earlier campaign with different compound counts (107 vs 241), unmatched assay protocols and no significance test; hit counts in the protein work are small (5 and 3 hits), and the 0-hit baseline is a single Claude Science run per target. Evidence that RSI generalizes beyond these two closely related task families \u2014 the source and target antibacterial datasets share 98% of their compounds \u2014 is thin, and experimental outcomes never feed back into the memory.", "tags": ["AI agents", "drug discovery", "protein design", "self-improvement", "AutoML"], "tldr": "An LLM agent that reuses memory of past workflow searches built better molecular-discovery pipelines, raising an antibiotic screen's wet-lab hit rate from 8.7% to 15.9% and yielding 8 validated pMHC binders."}, "error": null, "rank": 4}, {"id": "2610.40556", "title": "Advancing Clinical Genomic Analysis with a Skill-Centred Agent", "authors": "Qiaoyu Zheng, Weike Zhao, Yanjie Fan, Ye Cao, Mengqi Jiang, Xiao Zhou, Xiaoman Zhang, Pengcheng Qiu, Yongguo Yu, Yanfeng Wang, Ya Zhang, Chaoyi Wu, Weidi Xie", "abstract": "Clinical genomic analysis requires experts to integrate evolving guidelines, databases, and computational evidence. As sequencing has become increasingly accessible, this complex and labor-intensive process has become a major bottleneck to the timely use of genomic information in clinical decision-making. To fill this gap, we developed ClinGeX, a large-language-model agent that composes 105 curated executable skills through task-specific retrieval and dependency-aware orchestration. On 223 temporally held-out benchmark cases, ClinGeX achieved 71.7\\% macro-averaged task-level concordance with expert reference classifications, compared with 45.7\\% for the strongest comparator. In a three-condition, counterbalanced human-AI collaboration study, 45 clinical genomic professionals assessed 135 clinically derived cases under routine (no AI assistance), DeepSeek-assisted and ClinGeX-assisted conditions. ClinGeX assistance increased raw case-level concordance across criterion-level variant analysis, genomic interpretation in rare disease and molecular oncology decision-making (51.1\\%, 57.8\\%, 64.4\\% versus 15.6\\%, 31.1\\%, 20.0\\% in comparator conditions) and reduced reported interpretation time in all scenarios. During an exploratory one-month real-world non-interventional assessment, 11 experienced professionals submitted feedback on 96 self-selected analysis episodes and reported frequent conclusion adoption and time savings. These findings support executable domain skills as a promising approach to augment specialist genomic interpretation.", "categories": ["cs.AI", "q-bio.GN"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.40556", "pdf_url": "https://arxiv.org/pdf/2610.40556", "score": 85, "why_selected": "A 45-professional counterbalanced collaboration study plus temporally held-out evaluation shows substantial gains in a clinically important bottleneck, though the real-world phase is exploratory.", "basis": "truncated full text", "summary": {"tldr": "ClinGeX, an LLM agent built on 105 curated genomics skills, beat rival agents on held-out cases and roughly doubled clinicians' concordance with expert answers in a small controlled study.", "goal": "Sequencing is now cheap, but interpreting variants remains slow and expert-dependent because evidence is scattered across guidelines, databases, literature and prediction tools. The paper asks whether turning those resources into standardized, executable agent \"skills\" can make an LLM reliable enough to improve specialists' genomic interpretation, not just score well on benchmarks.", "approach": "The team scanned domain resources (about 41,000 database clusters plus guidelines, mapping tools, calculators and predictors), used LLM triage and eight experts to select 105, then compiled them into tested skills (27 guide, 40 search, 38 analysis) through a builder-evaluator loop. At run time, ClinGeX decomposes a request, retrieves skills by embedding similarity, expands them through a skill graph with prerequisite edges, and reveals detailed instructions only when needed. With DeepSeek-V4 as its core, it was tested on 223 temporally held-out cases from ClinVar, ClinGen, CIViC, OncoKB and PharmGKB against five systems including OpenAI DeepResearch, Biomni and TxAgent. A three-centre multi-reader study then had 45 professionals assess 135 clinically derived cases unassisted, with DeepSeek, or with ClinGeX, each reader completing nine cases in a counterbalanced design. Finally, 11 senior professionals used it for one month on self-chosen tasks, with no control arm and no influence on clinical decisions.", "key_results": ["Benchmark: 71.7% macro-averaged concordance versus 45.7% for the strongest comparator; by task, 89.9% SNV interpretation, 53.0% gene-disease validity and 72.3% clinical actionability (best baselines 49.4%, 35.5%, 52.3%).", "Reader study: ClinGeX-assisted concordance was 51.1%, 57.8% and 64.4% across the three scenarios, versus 22.2%, 28.9%, 31.1% unassisted and 15.6%, 31.1%, 20.0% with DeepSeek; all pairwise differences favoured ClinGeX after Holm correction (P from <0.001 to 0.019).", "Self-reported median time per case fell from 60 to 15 min for variant analysis and 30 to 15 min for rare disease (both P=0.003); the oncology drop from 15 to 11 min was not significant (P=0.078).", "One-month use: across 96 self-selected episodes, experts fully adopted conclusions in 72.9% and partially in 21.9%, and reported saving over 15 min in 77.3% of difficult tasks (17/22)."], "implications": "The results suggest that packaging guidelines, databases and tools as curated, testable skills may matter more than the underlying model alone: the same DeepSeek core performed far better inside ClinGeX, while plain DeepSeek assistance lowered concordance below unassisted clinicians in two of three scenarios. That contrast is also a caution about using general chatbots for specialist interpretation. The skill-library recipe could plausibly transfer to other clinical domains, though this paper does not test that.", "practicality": {"readiness": "Near-term (1-2 years)", "score": 6, "explanation": "Clinical genomics labs and analysts could trial it now for research-level interpretation support, since a registration-based bilingual web version exists and the authors say it can run locally with various backbone models. Routine clinical use is held back by the lack of patient-outcome evidence, even assisted concordance of only 51-64%, and source code that is not currently public."}, "limitations": "Concordance with expert consensus is a proxy, not a patient outcome; the reader study covered three scenarios, each case was read once per condition, and time was self-reported. The one-month assessment was uncontrolled and self-selected, gene-disease validity reached only 53.0%, and a prospective randomized trial is still needed.", "tags": ["clinical genomics", "LLM agents", "agent skills", "human-AI collaboration", "variant interpretation"]}, "error": null, "rank": 5}, {"id": "2610.39295", "title": "There Is No Free Lunch in RLVR: Every pass@1 Gain Has a pass@k Price", "authors": "Yinuo Liu", "abstract": "Reinforcement learning with verifiable rewards (RLVR) makes a language model solve more problems on the first try and fewer when given many tries: it raises pass@1 while the base model overtakes it at large sampling budget k. Is this a failure of RL to add reasoning, or a transient that more training removes? We settle the question with a theorem. The reversal is a price, and we compute its exact rate. Modeling RLVR as an exponential tilt of a base policy over strategies shared across prompts, we prove that under exclusive specialization every update that raises pass@1 strictly lowers the success of some prompt; a strictly positive price on prompts (Stiemke duality) is the exact condition, and being merely the best strategy on a prompt is provably not enough. When the loss reaches the hardest prompts, it forces a pass@k crossover, and the number of crossings is at most the sign variation of the shift in per-prompt success, a totally positive bound that is tight and that recovers the known single-crossover result as its order-preserving case. The crossover is not a bug to patch: a constrained update traces the exact pass@1 versus pass@k frontier, and removing the crossover entirely costs the entire pass@1 gain. The same tilt identity yields entropy collapse and the entropy-performance law with an identifiable exponent, unifying two literatures under one mechanism. Reinforcement cannot widen the reasoning frontier; it can only move along it, at a price we make measurable by a diagnostic that reads the bound, the order-preserving test, and the price from any evaluation log. There is no free lunch, only a price.", "categories": ["cs.LG", "cs.AI", "math.OC", "stat.ML"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.39295", "pdf_url": "https://arxiv.org/pdf/2610.39295", "score": 84, "why_selected": "Provides a theoretical account of the RLVR pass@1 versus pass@k trade-off with exact conditions and a practical diagnostic, potentially unifying several post-training literatures.", "basis": "full text", "summary": {"tldr": "A theory paper models RLVR as an exponential tilt over shared strategies and proves that, under specialization, pass@1 gains cost some prompts' success, sometimes forcing a pass@k crossover.", "goal": "RLVR training raises a language model's first-try success (pass@1), yet the base model can overtake it when allowed many tries (large k). The debate is whether this means RL adds no reasoning or just needs more training. The paper aims to settle this with a formal model that treats the reversal as a measurable trade-off.", "approach": "The work is mainly theoretical: a policy is a probability distribution over M solution strategies shared across N prompts, and a matrix gives each strategy's success rate on each prompt. Idealized RLVR (mirror descent/natural policy gradient) is shown to be an exponential tilt of the base policy toward higher-fitness strategies; GRPO's closeness to this tilt is stated as a proposition backed by numerical evidence. Proofs use Stiemke duality for the no-free-lunch condition, total positivity for the crossing bound, and a linear program for the trade-off frontier. Claims are checked on synthetic instances from an accompanying package. No model was trained; the real-world evidence is one published Qwen2.5-7B table read through the proposed diagnostic.", "key_results": ["No free lunch: if each strategy is the sole or dominant solver of some prompts, every pass@1 gain lowers some prompt's success. The exact condition is a strictly positive prompt pricing that equalizes strategy fitness; being merely the best strategy on a prompt is not enough (a counterexample yields a +0.173 free lunch).", "Crossing bound: pass@k crossings cannot exceed the sign changes in the shift of the per-prompt success distribution. The bound is tight (constructed for 1-6 crossings, no violations in 3,000 random instances). A crossover is forced only if the hardest prompts are covered solely by below-average strategies: it appeared in 400/400 synthetic instances with that condition and 0/400 without it.", "Price frontier: a per-prompt floor traces the trade-off between pass@1 gain and worst pass@k loss. Forbidding any prompt from regressing removes the crossover but also the entire pass@1 gain under exclusive specialization (zero crossings in 400/400 instances, zero median gain).", "Published case (indicative only): on Omni-MATH, GRPO's advantage over base was +0.149, +0.144, +0.104, +0.030, -0.008 at k=1, 4, 16, 64, 256, a single crossing. On MATH500 no crossover appeared up to k=256."], "implications": "Within the model, the debate over whether RLVR adds reasoning becomes a conditional statement: the crossover occurs when losses reach a finely covered hard tail and is absent otherwise. RL reweights existing strategies rather than widening the frontier, so diversity bonuses help only when an update sits inside that frontier. The same tilt also links pass@k reversal to entropy collapse, with an exponent readable from the entropy-reward slope, and the paper proposes reporting the worst pass@k loss and crossing count alongside standard metrics.", "practicality": {"readiness": "Usable now", "score": 6, "explanation": "RLVR researchers and evaluators can apply the diagnostic to per-prompt base and RL success rates or pass@k curves already in evaluation logs, with no extra training cost; the paper describes a package and hosted app. The obstacle is interpretation: strategies are not directly observed in real models, so verifying specialization or fine coverage is hard. Published curves are also coarse, and the frontier's linear program needs the strategy-prompt matrix."}, "limitations": "The theorems hold for an idealized population-level model with a fixed strategy set, so they do not by themselves show that real training cannot create new strategies, and the assumptions were not verified on real models. Empirical support is a single transcribed table at five budgets, with values still to be confirmed against the source, and the paper calls it corroboration, not proof.", "tags": ["RLVR", "pass@k", "reinforcement learning theory", "LLM reasoning", "entropy collapse"]}, "error": null, "rank": 6}, {"id": "2610.40051", "title": "Rethinking Pre-pretraining", "authors": "Alexander Stern, Tim Rockt\u00e4schel, Acyr Locatelli, Laura Ruis", "abstract": "We report that allocating compute to synthetic pre-pretraining (PPT) never outperforms pure natural-language training in our compute-matched experiments. This holds across four PPT curricula (k-Dyck, neural cellular automata (NCA), declarative reference corpora, and code) and three training regimes: data-constrained, data-unconstrained, and a high token-to-parameter-ratio regime (881M parameters trained on 50B tokens). When natural language is scarce, repeated epochs over a 100M-token corpus beat every synthetic curriculum on natural-language validation loss, with no consistent downstream accuracy advantage from PPT. We find that PPT gains reported in prior work are sensitive to the weight initialization scheme. In an NCA reproduction, we recover a 5.4% perplexity improvement from PPT under the original initialization scheme. An alternative scheme improves both methods, but the no-PPT baseline more, closing the gap between them. However, when PPT receives additional compute rather than a share of the natural-language budget, gains persist at small natural-language budgets even with improved initialization, but disappear by 1B tokens. Finally, models forget what they learn during PPT in subsequent natural-language training; interleaving the same data throughout training prevents forgetting, but does not significantly improve natural-language performance. Our results suggest limited benefits of synthetic pre-pretraining as a distinct training stage and motivate rethinking how such data are used in language model training.", "categories": ["cs.CL", "cs.AI"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.40051", "pdf_url": "https://arxiv.org/pdf/2610.40051", "score": 83, "why_selected": "A large compute-matched negative result across curricula and regimes corrects a popular training idea and identifies initialization sensitivity in prior gains, with direct value for practitioners.", "basis": "full text", "summary": {"tldr": "Across compute-matched tests, training language models on synthetic data first never beat spending that compute on natural text; earlier gains partly reflect weight initialization choices.", "goal": "Pre-pretraining (PPT) trains a language model on synthetic data, such as bracket languages or cellular automata, before normal training, in the hope of building useful priors and easing dependence on scarce text. Prior work reported gains of up to 8.6% lower perplexity, but it was unclear whether these hold across setups or justify their compute cost compared with simply training longer on real text.", "approach": "Using a fork of NanoChat with FineWeb as the main corpus, the authors tested k-Dyck, neural cellular automata (NCA), a new declarative-reference corpus (DeclRef), and code as PPT data. An additive setting put PPT on top of 50M, 100M, or 1B natural-language tokens on a 336M-parameter model, varying three weight initializations. Compute-matched settings gave PPT 1-10% of a fixed FLOP budget in three regimes: data-constrained (100M tokens, repeated epochs), data-unconstrained (1-9\u00d710^18 FLOPs, with model size searched per method), and over-Chinchilla (881M parameters on 50B tokens, far more tokens than compute-optimal). Results were scored on validation bits per byte, DCLM CORE, and BLiMP over three seeds, and a separate experiment tracked forgetting of PPT data across the phase boundary.", "key_results": ["No PPT curriculum beat pure natural-language training on validation loss in any compute-matched regime; even repeated epochs over 100M tokens beat every synthetic curriculum.", "Reproducing an NCA result recovered a 5.4% perplexity gain, but changing the embedding initialization from N(0,1) to N(0,0.02) improved the baseline by 9.0% and made the two inseparable.", "When PPT got extra compute, k-Dyck and NCA improved on the best baseline at 50M and 100M tokens, but under spectral-based initialization the gain was gone by 1B tokens.", "Models lost PPT-distribution ability after the switch to natural language; mixing 5% PPT data into every batch prevented this, but gave no significant overall natural-language improvement in untuned runs."], "implications": "An explicit synthetic training phase looks like a weak use of compute, and scaling-law fits give no evidence these recipes would overtake natural-language training at larger budgets. PPT studies should vary initialization for baseline and PPT runs alike, and track performance on the synthetic data throughout training. The authors do not rule out synthetic data, and point to interleaving schedules as the open direction.", "practicality": {"readiness": "Usable now", "score": 7, "explanation": "Teams training language models can apply the main lesson today: check initialization and spend compute on natural text, including repeated epochs, before adding a synthetic phase. Training code and the LLMTuna hyperparameter optimizer are released. The findings are mainly a negative result for sub-billion-parameter models in a NanoChat setup, so they guide decisions rather than offer a new performance gain."}, "limitations": "Models stayed under 1B parameters, large runs got reduced hyperparameter sweeps, intermediate or budget-varying PPT shares went untested, and the setup differs from prior work in tokenizer, architecture, and data. Some sub-task benchmark shifts and a few gains at the smallest compute budget remain unexplained, and the interleaving runs were not tuned.", "tags": ["pre-pretraining", "synthetic data", "language model training", "weight initialization", "scaling laws"]}, "error": null, "rank": 7}, {"id": "2610.38851", "title": "Learning to Reason from Reference Samples Alone: Reinforced Adversarial Learning for Modern LLM Post-Training", "authors": "Albert Bou, Javier Valdes-Aleman, Jon M. Laurent, Samuel G. Rodriques, Andrew D. White, Michaela Hinks, Siddharth Narayanan", "abstract": "In many settings where LLM post-training is desirable, high-quality answers are recognizable but difficult to score with explicit rewards. Reinforcement learning with verifiable rewards (RLVR) is limited to tasks where an explicit correctness signal is available. Prior adversarial approaches to training reasoning LLMs either complement verifiable rewards with co-trained critics or require reference reasoning traces. We ask whether a co-trained LLM judge can turn reference answers alone into the sole reward for on-policy post-training of reasoning LLMs. We call this method Reinforced Adversarial Learning (RAL). We first validate RAL on three verifiable tasks (integer multiplication, code-based arithmetic-expression synthesis, and SMILES-to-formula translation), using the verifiers only for evaluation. With sufficiently capable judges and enough training, RAL matches direct RLVR. We then apply RAL to scientific abstract generation in two settings. In the first setting, RAL guides the generator to produce abstracts in the scientific domain of the reference abstracts, even though the prompt leaves that domain unspecified. In the second setting, we generate abstracts for U.S. National Institutes of Health grant proposals conditioned on the grant title. Human scientists and an ensemble of LLM judges find our generations harder to distinguish from real abstracts than those of frontier-LLM baselines. These results suggest a path toward post-training reasoning models in scientific and other high-value domains, where increasingly capable judges infer hard-to-specify reward functions from example answers.", "categories": ["cs.AI", "cs.LG"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.38851", "pdf_url": "https://arxiv.org/pdf/2610.38851", "score": 82, "why_selected": "Extends reasoning-model post-training to tasks without explicit verifiers using only reference answers, validated against RLVR and human judges, opening high-value scientific domains.", "basis": "full text", "summary": {"tldr": "A co-trained LLM judge, learning only from reference answers, can replace explicit rewards for training reasoning models, matching verifier-based RL on three tasks and improving NIH-abstract realism.", "goal": "Reinforcement learning with verifiable rewards (RLVR) drives recent reasoning advances in LLMs but needs an automatic correctness checker, which many valuable tasks lack: good protocols or reviews are recognizable but hard to score. The paper asks whether a co-trained judge can turn reference answers alone, with no verifier, rubric, or reasoning traces, into the sole reward for post-training reasoning models.", "approach": "Reinforced Adversarial Learning (RAL) trains two Qwen3 models together: a judge classifies answers as reference or generated, and its reference probability is the generator's only reward, optimized with GRPO. The judge sees only the prompt and final answer, never the reasoning, so reasoning must emerge from outcome-level feedback. Stabilizers include a gate that skips judge updates when it gets too accurate, plus a replay buffer and Polyak-averaged reward judge in the NIH run. Three tasks with verifiers held out for evaluation (four-digit multiplication, Countdown-Code, SMILES-to-formula) compare RAL against RLVR, judge-times-verifier, and supervised fine-tuning (SFT) while varying judge size. Two open-ended tasks follow: biomedical abstracts with the domain unstated (5,000 references, versus a frozen Claude Haiku 4.5 judge), and title-conditioned NIH grant abstracts (about 20,000 FY2026 training examples, 128 held-out), evaluated by five LLM judges and human evaluators holding or pursuing biomedical PhDs.", "key_results": ["Multiplication: RAL with a 4B judge reached 0.949 accuracy versus 0.938 for RLVR and 0.005 for SFT; a 0.6B judge reached 0.861.", "Countdown-Code and SMILES: a 32B judge scored 0.878 versus 0.858 for RLVR on Countdown-Code (SFT 0.449), and 0.816 versus 0.679 on SMILES-to-formula, though SFT scored highest there at 0.943.", "Biomedical abstracts: RAL drove the biomedical rate toward one while diversity recovered to about its starting level; the frozen Haiku judge's reward rose while 125 of 128 final generations collapsed onto an out-of-domain Pacific-oyster microplastics theme.", "NIH abstracts: with a 235B judge, RAL fooled the LLM ensemble about 35% of the time versus at most 4% for frontier models, SFT, and the untrained generator; it fooled humans 55% of the time versus 21-37% for frontier models and 44% for the untrained generator."], "implications": "The results suggest learned, reference-only rewards could extend reasoning post-training to domains with good examples but no verifier, and that adversarial co-training can move past superficial cues when the judge is capable enough. Judge capacity and training length emerge as key levers, and scaling the judge independently of the generator mattered. On the open-ended tasks, success means resembling the references, which is not the same as being correct or scientifically valid.", "practicality": {"readiness": "Near-term (1-2 years)", "score": 6, "explanation": "Teams that post-train LLMs and hold collections of good answers could try this now, since code, configurations, and datasets are released and built on Prime-RL. The main obstacles are the cost of judges much larger than the generator (235B judging a 32B generator on NIH), long co-training, and adversarial instability. Domains also need a way to validate outputs, because the reward does not check truth."}, "limitations": "Hyperparameters were not tuned per task, NIH training was unstable with fluctuating fooling rates, and the NIH generator invents preliminary findings because it is conditioned only on a title. Evidence for richer reasoning and a progressive curriculum is partly qualitative, based on a subset of outputs, and test accuracy reports the best checkpoint, with RAL given longer training than baselines.", "tags": ["LLM post-training", "adversarial imitation learning", "reinforcement learning", "reward learning", "scientific text generation"]}, "error": null, "rank": 8}, {"id": "2610.40535", "title": "Efficient Scalable Oversight via Rewinding", "authors": "Ziyi Guan, Yael Tauman Kalai, Ron Rothblum, Zoe Xi", "abstract": "Scalable oversight asks how a weak verifier can check the outputs of computations performed by more powerful AI systems. One proposed approach uses relativizing interactive proofs, in which a weak verifier checks the output of a complex oracle-aided computation by interacting with one or more powerful provers. A prominent example is debate, which is highly efficient but assumes that one of two powerful AI models, or provers, is truthful. For certain classes of oracle-aided computations, this assumption can be removed, but at substantially greater computational cost. In this work, we introduce \\emph{rewindable interactive proofs} (RIPs), a new model of relativizing interactive proofs for scalable oversight. In an RIP, the verifier may rewind the prover to an earlier state of the interaction and continue from there. This is possible when the prover is an AI model, since the verifier can save a snapshot of the model's state and later restore it. We construct a relativizing RIP for computations whose outputs are robust to changing a small fraction of oracle answers. Our construction is more efficient than prior relativizing proofs that do not assume a truthful prover, and it uses no cryptography. In our construction the honest prover runs in time linear in that of the original computation, and the verifier, after a one-time preprocessing step, runs in time nearly linear in the input length (which can be much smaller than the computation itself). We implement our protocol, report a preliminary MNIST experiment, and show that an RIP can be faster than a state-of-the-art deployed proof system. RIPs may be of independent interest. Rewinding is possible whenever the verifier controls the prover's machine, for example when the prover runs on trusted hardware or in a virtual machine whose state can be checkpointed.", "categories": ["cs.AI", "cs.CC", "cs.CR"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.40535", "pdf_url": "https://arxiv.org/pdf/2610.40535", "score": 81, "why_selected": "Introduces a new, cryptography-free proof model for scalable oversight with strong efficiency guarantees and broader theoretical interest, though empirical validation remains preliminary.", "basis": "full text", "summary": {"tldr": "Letting a verifier rewind an AI prover to saved states gives cryptography-free proofs for robust oracle computations, with no truthful-prover assumption and verifier cost sublinear in circuit size.", "goal": "Scalable oversight asks how a weak verifier, such as a human or small model, can check the outputs of more powerful AI, including computations that call black-box oracles like human judgment. Debate is efficient but assumes one of two AI provers is truthful, while earlier relativizing proofs that drop this assumption cost far more. The paper asks whether a relativizing proof can be made more efficient without trusting any prover.", "approach": "The authors define rewindable interactive proofs (RIPs), in which the verifier can snapshot a prover and restore it, so its answers cannot depend on later questions. They target oracle circuits that are \u03b5-robust, meaning the output survives changing an \u03b5 fraction of oracle answers. The prover supplies all oracle answers inside an encoded witness and proves the resulting ordinary circuit evaluates correctly, while the verifier spot-checks about 1/\u03b5 random oracle gates against the real oracle. A general lemma compiles any relativizing interactive oracle proof (IOP) into an RIP with no soundness loss, by rewinding before each proof-symbol query. They implement this in Rust and test it on majority circuits over a sparse MNIST classifier (50 selected images) and on Flock's IOP for batches of BLAKE3 hashes.", "key_results": ["Theory: after one-time preprocessing of \u00d5(n+m+S), the verifier runs in \u00d5(n+m+1/\u03b5) time with O(1/\u03b5) oracle queries and the honest prover in O(n+m+S)+\u00d5(1/\u03b5) time, with soundness error 1/3 (reducible by repetition) against unbounded provers and no cryptography.", "MNIST queries: at soundness error 2^-40, the verifier's median oracle queries stayed at 74\u201380 as circuits grew from 2^8 to 2^26 oracle gates, about 840,000\u00d7 fewer than direct evaluation at the largest size.", "MNIST timing: verifier online time falls below direct evaluation between 2^22 and 2^24 gates and reaches 0.12\u00d7 at 2^26, but the prover costs about 60\u00d7 direct evaluation at large sizes, where oracle calls are cheap table lookups.", "SNARG comparison: compiling Flock's IOP into an RIP makes the prover 1.8\u20132.1\u00d7 faster than Flock's own SNARG prover on 2^22 to 2^34 witness bits, by dropping Merkle hashing, computing part of the encoding on demand, and using 40-bit rather than 128-bit security over a smaller field."], "implications": "Rewinding offers a third route for oversight, between debate's trust assumption and costlier relativizing proofs, by exploiting the fact that a verifier can control an AI model's execution. It also shows that dropping cryptography can speed up a prover, and the model applies wherever the verifier controls the prover's machine, such as trusted hardware or checkpointable virtual machines. The authors also prove RIPs are as powerful as multi-prover interactive proofs (MIPs), up to a soundness loss in the RIP-to-MIP direction.", "practicality": {"readiness": "Long-term (3+ years)", "score": 4, "explanation": "An open-source Rust implementation exists, and teams that control the prover's machine could experiment with it now, for example on trusted hardware or checkpointed VMs. Real oversight use is further off: it needs computations that are provably robust, a prover expressible as a circuit with its state fully captured, and snapshot restores that are not free for large models. The implementation also uses a Ligero layout with square-root rather than the theorem's polylogarithmic verifier cost."}, "limitations": "The MNIST test is a proof of concept: images were selected for robustness, views were random rather than adversarial, and a verifier could estimate these majority outputs by sampling alone, with no prover. Soundness fails if a cheating prover has external storage that is not rewound, restore costs are not counted, and the Flock comparison measures an oracle-free computation with a 40-bit security level assuming the error terms compose statistically.", "tags": ["scalable oversight", "interactive proofs", "AI safety", "verifiable computation", "relativization"]}, "error": null, "rank": 9}, {"id": "2610.40565", "title": "Gym-Anything for Robotics: Scaling physical simulations with digital agents", "authors": "Pranjal Aggarwal, Sean Welleck", "abstract": "Realistic, fast robotics simulations could enable large-scale training of embodied AI models that transfer to the real world. However, despite decades of progress, available simulations cover only a narrow range of real-world tasks and physical phenomena. The core bottleneck is that creating better simulations requires significant expert effort and therefore does not scale. To address this, we introduce Gym-Anything for Robotics, a framework in which coding agents create realistic robotics simulations. Our core insight is that simulation creation is a coding agent task, so improvements in coding agents translate directly into richer and more faithful simulations. We select simulations based on U.S. GDP data to cover economically valuable physical work, define what makes a good simulation and a good task, and develop an adversarial creation-audit loop that checks each simulation and task against these definitions. Using this pipeline, we build RoboWorld, a set of 25 simulations with 25 test and 175 training RL environments of varying difficulty. Even the best frontier models fail on every RoboWorld test task, achieving an average reward of only 0.06. Building on RoboWorld, we introduce several new ways for frontier models to improve, including in-context learning across repeated attempts, a privileged teacher that reads the simulator state and teaches a student in context, self-assisted learning from the model's own privileged experience, and code policies that generate demonstrations across varied scenes to train vision-language-action models (VLAs) such as $\u03c0_{0.5}$. Each of these substantially improves performance. We release our pipeline, RL environments, and benchmark to facilitate future research. Code and data are available at https://gym-anything.github.io/robotics", "categories": ["cs.RO", "cs.AI", "cs.LG"], "announce_type": "new", "abs_url": "https://arxiv.org/abs/2610.40565", "pdf_url": "https://arxiv.org/pdf/2610.40565", "score": 80, "why_selected": "Agent-generated, economically targeted robotics simulations could remove a major scaling bottleneck, and the open benchmark exposes frontier-model failure while offering usable improvement paths.", "basis": "full text", "summary": {"tldr": "Coding agents built and audited RoboWorld, 25 economically chosen robotics simulations; frontier models fail every test task, but privileged simulator state helps them learn and train small policies.", "goal": "Simulation could train robots at scale, but realistic simulators take heavy expert effort, so existing ones cover only a narrow range of tasks and physics. The paper tests whether simulation building can be treated as a coding agent task, so that better coding agents yield better simulations. It also asks how frontier models can use simulation to learn physical skills.", "approach": "The authors use U.S. occupation, wage, and time-use data, plus LLM decomposition of tasks into atomic physical actions, to select 120 economically valuable simulation targets, of which 25 are built so far. Claude Opus 5.5 agents build each simulation in an adversarial loop: a creation agent supplies evidence such as renders, physical measurements, and assisted demonstrations, while four auditors check ten quality criteria over three rounds, one of them trying to break the simulation with legal robot actions. A similar loop with six auditors creates tasks with physics-based verifiers and partial-credit rewards, giving 25 test and 175 training environments. GPT-6 Astra, GPT-6.1 Terra, and Claude Opus 5.5 were tested with real-robot-style observations under a three-hour budget per attempt. Learning experiments ran Opus 5.5 on 11 simulations, comparing repeated attempts, privileged state access, hint-only coaching, and self-transfer, while privileged code policies generated demonstrations to train the vision-language-action model \u03c00.5 on two gift box tasks.", "key_results": ["All three frontier models scored 0% success on the 25 test tasks, with average rewards of 0.002 to 0.06. On an easier subset of 25 training tasks, Opus 5.5 led with 32% success and 0.48 reward, ahead of GPT-6 Astra (24%, 0.41) and GPT-6.1 Terra (12%, 0.17).", "Over three in-context attempts, Opus 5.5 improved from 0.14 to 0.22 average reward with restricted access, and from 0.34 to 0.41 with privileged state. A student coached only through qualitative hints scored 0.29 on its first attempt, 2.1 times the solo agent's 0.14.", "Code policies written with privileged access succeeded on 96.7% of 2,048 varied initial states. Their demonstrations raised \u03c00.5 from 0% to 53% success on two gift box tasks, and to 55% on unseen variations, using only cameras and proprioception. \u03c00.5 finished in about 2 minutes versus about 29 for Opus 5.5, which scored 60% in the figure.", "In blind comparisons against the strongest prior simulator for each interaction, RoboWorld won 76% on physics and 80% on visuals, losing 24% and 14%. The adversarial auditor found a real defect in about three quarters of the simulations, and these were repaired in the next round."], "implications": "If these results hold up, simulation breadth becomes less limited by expert labor and more by coding agent capability, including physics that standard engines lack. Privileged simulator state also emerges as a useful learning signal for frontier models, not only for classic teacher-student policy training. The benchmark shows that realistic physical work and high-degree-of-freedom control remain largely unsolved for these models.", "practicality": {"readiness": "Usable now", "score": 6, "explanation": "Robot learning and AI researchers can use the released pipeline, environments, and benchmark now to evaluate models or generate training data. Building new simulations relies on frontier coding agents and substantial compute, and each evaluation attempt runs for hours. Deployment on physical robots remains unproven, since the paper reports no real-robot transfer."}, "limitations": "All results are in simulation, so transfer to real robots is untested, and the \u03c00.5 result covers only two tasks in one simulation. Quality evidence is also partly self-referential, because Claude Opus 5.5 built, audited, and blindly judged the simulations, and Claude models calibrated task difficulty.", "tags": ["robotics simulation", "coding agents", "embodied AI benchmark", "privileged learning", "sim-to-real"]}, "error": null, "rank": 10}];
